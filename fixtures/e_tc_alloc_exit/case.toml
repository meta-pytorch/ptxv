name = "e_tc_alloc_exit"
description = """
E-ALLOC and E-TC-EXIT mutants of a tcgen05.alloc / tcgen05.cp / commit / dealloc kernel (see
kernel.ptx). Unobserved tcgen05.cp work at dealloc and exit is a violation, a trailing commit
alone is a contract finding, a leaked or wrongly sized allocation is a violation, and an
allocation that can never succeed blocks (deadlock); on the SASS front ptxas's tcgen05
guardrails also trap."""
ptx = "kernel.ptx"
entry = "e_tc_alloc_exit"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [256]
init = "zeros"

[[buffers]]
name = "in"
dtype = "u32"
shape = [128]
init = "iota"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "in"

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "CPNOWAIT"
summary = "nobody waits for the tcgen05.cp commit and nobody reads TMEM: cp in flight at dealloc / exit"
marker = "@TW"
find = "mbarrier.try_wait.parity.shared::cta.b64 %p3, [%r31], 0;"
replace = "setp.eq.u32 %p3, %r1, %r1;"
edits = [{ marker = "@LD", find = "tcgen05.ld.sync.aligned.32x32b.x1.b32 {%r9}, [%r8];", replace = "mov.u32 %r9, 0;" }]
expect = ["race", "violation"]

[[variants]]
id = "TRAILCOMMIT"
summary = "thread 0 issues a second commit (no new tcgen05 op) after the dealloc and exits without waiting"
marker = "@DEALLOC"
find = "tcgen05.dealloc.cta_group::1.sync.aligned.b32 %r6, 32;"
replace = "tcgen05.dealloc.cta_group::1.sync.aligned.b32 %r6, 32; setp.eq.u32 %p6, %r1, 0; @%p6 tcgen05.commit.cta_group::1.mbarrier::arrive::one.shared::cluster.b64 [%r31];"
expect = ["contract"]

[[variants]]
id = "CP2"
summary = "thread 0 issues a second tcgen05.cp and commit after the wait; nobody waits for them before dealloc"
marker = "@PREDEALLOC"
find = "@%p1 bra DONE;"
replace = "@%p1 bra DONE; @%p2 bra NOCP2; tcgen05.cp.cta_group::1.32x128b.warpx4 [%r6], %rd5; tcgen05.commit.cta_group::1.mbarrier::arrive::one.shared::cluster.b64 [%r31]; NOCP2:"
expect = ["race", "violation"]

[[variants]]
id = "NODEALLOC"
summary = "the TMEM allocation is never freed"
marker = "@DEALLOC"
replace = "<delete>"
expect = ["violation"]

[[variants]]
id = "REALLOC"
summary = "warp 0 allocates 32 columns, then 512 more before freeing: the second alloc can never succeed"
marker = "@ALLOC"
find = "[%r32], 32;"
replace = "[%r32], 32; tcgen05.alloc.cta_group::1.sync.aligned.shared::cta.b32 [%r32], 512;"
expect = ["deadlock"]

[[variants]]
id = "DEALLOCSZ"
summary = "dealloc frees 64 columns of a 32-column allocation"
marker = "@DEALLOC"
find = "%r6, 32;"
replace = "%r6, 64;"
expect = ["violation"]
expect_sass = ["trap", "violation"]

[[variants]]
id = "W1ALLOC"
summary = "warp 0 holds all 512 columns; warp 1 allocates 32 before the bar.sync warp 0 waits at"
marker = "@ALLOC"
find = "[%r32], 32;"
replace = "[%r32], 512;"
edits = [
  { marker = "@DEALLOC", find = "%r6, 32;", replace = "%r6, 512;" },
  { marker = "@W1", find = "shl.b32 %r4, %r1, 2;", replace = "shl.b32 %r4, %r1, 2; setp.eq.u32 %p7, %r2, 1; @!%p7 bra NOW1; tcgen05.alloc.cta_group::1.sync.aligned.shared::cta.b32 [%r32], 32; NOW1:" },
]
expect = ["deadlock"]
expect_sass = ["deadlock", "trap", "violation"]
