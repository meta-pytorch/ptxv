name = "e_actor_base"
description = """
Actor ids (MISS 104): 4096 threads, and the last thread's bulk copy (an async actor) into shared
memory. The CTA of an access by an async actor must decode from the async actor base
(`async_base`, after FIXED_ACTORS_PER_THREAD fixed actors per thread); a decoder with a stale
base indexed past the last thread (a panic) or named another thread's CTA. See kernel.ptx."""
ptx = "kernel.ptx"
entry = "e_actor_base"
grid = [32, 1, 1]
block = [128, 1, 1]
outputs = ["dst"]

[[buffers]]
name = "src"
dtype = "u32"
shape = [4]
init = "iota"

[[buffers]]
name = "dst"
dtype = "u32"
shape = [4]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "dst"

[[variants]]
id = "good"
summary = "the last thread's bulk copy, waited and stored: clean"
expect = ["clean"]
expect_sass = ["clean"]
