name = "c_triton_cat"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of triton_cat.py (kernel ^cat_kernel$). 1 launch(es),
binary only (cubins captured from the loaded modules):
  0: cat_kernel grid [16, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton tools/capture_examples/triton_cat.py:cat_kernel --binary --out fixtures/c_triton_cat"""
cubin = "k0.cubin"
entry = "cat_kernel"
grid = [16, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [8, 32]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "y"
dtype = "f32"
shape = [8, 32]
init = "file"
file = "data/y.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [16, 32]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "y"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[params]]
kind = "u32"
value = 8

[[params]]
kind = "u32"
value = 32

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
