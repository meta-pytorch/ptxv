name = "c_triton_softcap"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of triton_softcap.py (kernel ^softcap_kernel$). 1 launch(es),
PTX from the JIT (kernel.ptx; its own cubin kept as jit.cubin):
  0: softcap_kernel grid [4, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton tools/capture_examples/triton_softcap.py:softcap_kernel --out fixtures/c_triton_softcap"""
ptx = "kernel.ptx"
entry = "softcap_kernel"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [4, 256]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [4, 256]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[params]]
kind = "u32"
value = 1024

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
