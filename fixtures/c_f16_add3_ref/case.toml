name = "c_f16_add3_ref"
description = """
Synthetic (docs/equiv-mma.md §2): out[i] = f16((x + y) + z) for f32 inputs x, y, z of 256 elements,
2 CTAs of 128 threads; an f16 output stored with st.global.b16. The pair c_f16_add3_ref /
c_f16_add3_cand rounds two different sum orders to f16 (fixtures/c_equiv_f16/equiv.toml)."""
ptx = "kernel.ptx"
entry = "add3"
grid = [2, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [256]
init = "normal"

[[buffers]]
name = "y"
dtype = "f32"
shape = [256]
init = "normal"

[[buffers]]
name = "z"
dtype = "f32"
shape = [256]
init = "normal"

[[buffers]]
name = "out"
dtype = "f16"
shape = [256]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "y"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "z"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
