name = "r3_cute_nvf4"
description = """
CUTLASS 4.6.1 CuTeDSL Blackwell persistent block-scaled dense GEMM
(examples/python/CuTeDSL/blackwell/dense_blockscaled_gemm_persistent.py: TMA loads of A, B
(4-bit tensor maps) and the scale factors, tcgen05.cp of the scale factors into TMEM,
block-scaled FP4 tcgen05.mma, TMEM epilogue, TMA store), NVFP4:
C[128x128] f32 = (A * SFA) @ (B * SFB)^T, A[128x256] / B[128x256] e2m1 (two per byte, low
nibble first), ue4m3 scales per 16 K elements (none 0), one persistent CTA, 6 warps (TMA, MMA, 4
epilogue). Captured by capture.py; the inputs are fixed files and gb300_C.bin is the GB300
output."""
ptx = "kernel.ptx"
entry = "kernel_cutlass_kernel_dbgpSm100BlockScaledPersistentDenseGemmKernel_object_at__TiledMMA_ThrLayoutVMNK11110000_PermutationMNK____MMAAtom_ThrID10_ShapeMNK12812864_TVLayoutA1128641281128_TVL_0"
grid = [1, 1, 1]
block = [192, 1, 1]
dynamic_smem = 218112
outputs = ["C"]

[[buffers]]
name = "A"
dtype = "u8"
shape = [128, 128]
init = "file"
file = "A.bin"

[[buffers]]
