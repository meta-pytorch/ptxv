name = "e_mma_m128_n8"
description = """
tcgen05.mma.cta_group::1.kind::f16 with M = 128, N = 8 (PTX ISA: N = 8..256 in steps of 8 at
M = 128), bf16 x bf16 -> f32, random normal operands (probes/tc_m128 config one_m128_n8_rand).
D lands in lanes 0..127, columns 0..7. The output is the CTA's whole TMEM (128 lanes x 256
columns, sentinel-filled before the MMA); expected/D.bin is GB300's (2026-11-05). The mslk
decode attention kernels issue this shape (UTCHMMA, idesc M = 128, N = 8)."""
ptx = "kernel.ptx"
entry = "mma_one"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "u16"
shape = [1, 128, 16]
init = "file"
file = "data/A.bin"

[[buffers]]
name = "B"
dtype = "u16"
shape = [1, 256, 16]
init = "file"
file = "data/B.bin"

[[buffers]]
name = "D"
dtype = "u32"
shape = [1, 128, 256]
init = "zeros"
expect = "expected/D.bin"

[[params]]
kind = "ptr"
buffer = "A"

[[params]]
kind = "ptr"
buffer = "B"

[[params]]
kind = "ptr"
buffer = "D"

# idesc: D f32, A / B bf16, N >> 3 = 1 at bit 17, M >> 4 = 8 at bit 24.
[[params]]
kind = "u32"
value = 0x8020490

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "B05"
summary = "the wait on the MMA's commit does not loop: the TMEM dump races with the MMA's write"
marker = "@B05"
replace = "<delete>"
expect = ["nondeterministic", "race", "violation"]
expect_sass = ["race", "violation"]

[[variants]]
id = "n4"
summary = "N = 4 (idesc N field 0, i.e. N = 0): not a valid shape, reported as not modeled"
marker = "@SHAPE"
find = "ld.param.u32    %r42, [idesc];"
replace = "mov.u32         %r42, 0x8000490;"
expect = ["unmodeled"]
