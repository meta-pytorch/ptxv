name = "r2_triton_gemm"
description = """
Rung 2. Triton 3.5 persistent matmul (host TensorDescriptors -> TMA, tl.dot -> tcgen05.mma),
C[512x128] f32 = A[512x128] bf16 @ B[128x128]^T, 2 persistent CTAs. Captured by capture.py."""
ptx = "kernel.ptx"
entry = "matmul_tma_persistent"
grid = [2, 1, 1]
block = [128, 1, 1]
dynamic_smem = 163888
outputs = ["C"]
spec = "gemm_tn"

[[buffers]]
name = "A"
dtype = "bf16"
shape = [512, 128]
init = "normal"
seed = 1

[[buffers]]
name = "B"
dtype = "bf16"
shape = [128, 128]
init = "normal"
seed = 2

[[buffers]]
name = "C"
dtype = "f32"
shape = [512, 128]
init = "zeros"
seed = 0

[[params]]
kind = "tensormap"
buffer = "A"
box = [64, 128]
swizzle = "128B"

[[params]]
kind = "u32"
value = 512

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u64"
value = 128

[[params]]
kind = "u64"
value = 1

[[params]]
kind = "tensormap"
buffer = "B"
box = [64, 128]
swizzle = "128B"

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u64"
value = 128

[[params]]
kind = "u64"
value = 1

[[params]]
kind = "tensormap"
buffer = "C"
box = [32, 128]
swizzle = "128B"

[[params]]
kind = "u32"
value = 512

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u64"
value = 128

[[params]]
kind = "u64"
value = 1

[[params]]
kind = "u32"
value = 512

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u64"
value = 0

[[params]]
kind = "u64"
value = 0

[[variants]]
id = "good"
summary = "as compiled by Triton 3.5"
# Races the tcgen05 thread-sync fences would order: contract (E-TC-FENCE-NOP).
expect = ["contract"]
expect_sass = ["contract"]

[[variants]]
id = "fenced"
summary = "Triton's PTX with the tcgen05 fences it omits and the descriptor version fixed"
edits = [
  { marker = "@ALLOC_BAR", find = "bar.sync \t0;", replace = "tcgen05.fence::before_thread_sync; bar.sync 0; tcgen05.fence::after_thread_sync;" },
  { marker = "@ZERO_BAR", find = "bar.sync \t0;", replace = "tcgen05.fence::before_thread_sync; bar.sync 0; tcgen05.fence::after_thread_sync;" },
  { marker = "@MMA0", find = "@", replace = "tcgen05.fence::after_thread_sync; @" },
  { marker = "@MMA1", find = "@", replace = "tcgen05.fence::after_thread_sync; @" },
  { marker = "@LD0", find = "tcgen05.ld", replace = "tcgen05.fence::after_thread_sync; tcgen05.ld" },
  { marker = "@LD1", find = "tcgen05.ld", replace = "tcgen05.fence::after_thread_sync; tcgen05.ld" },
  { marker = "@LDW0", find = "aligned;", replace = "aligned; tcgen05.fence::before_thread_sync;" },
  { marker = "@LDW1", find = "aligned;", replace = "aligned; tcgen05.fence::before_thread_sync;" },
  { marker = "@DEALLOC", find = "@", replace = "tcgen05.fence::after_thread_sync; @" },
  { marker = "@D00", find = "4611686293372403712", replace = "4611756662116581376" },
  { marker = "@D01", find = "4611686293372403712", replace = "4611756662116581376" },
  { marker = "@D02", find = "4611686293372403712", replace = "4611756662116581376" },
