name = "c_fa4_fwd"
description = """
FlashAttention-4 forward (flash_attn.cute 4.0.0b24, CuTeDSL; FlashAttentionForwardSm100), bf16
q, k, v 1 x 128 x 1 x 64, one CTA of 512 threads, captured by tools/capture.py --file
tools/capture_examples/fa4_fwd.py on GB300. Binary case: the JIT's own cubin (jit.cubin; its PTX
uses tcgen05.ld.red, which the PTX front-end does not parse). Lifts with LDTM.STAT
(tcgen05.ld.red row max) and R2P PR, Rx.Bk (mask bit tests); certified clean (E-WELLSYNC) once
STTM is ordered like the other lockstep memory instructions (E-LOCKSTEP); bitwise equal to the
GPU output, `ptxv hw` 100/100."""
cubin = "jit.cubin"
entry = "kernel_cutlass_kernel_flash_attncuteflash_fwd_sm100FlashAttentionForwardSm100_object_at__tensor0000o11101213_tensor0000o11101213_tensor0000o10111213_tensor0000o11101213_None_None_None_Non_0"
grid = [1, 1, 1]
block = [512, 1, 1]
dynamic_smem = 231424
outputs = ["out0"]

[[buffers]]
name = "q"
dtype = "bf16"
shape = [1, 128, 1, 64]
init = "file"
file = "data/q.bin"

[[buffers]]
name = "k"
dtype = "bf16"
shape = [1, 128, 1, 64]
init = "file"
file = "data/k.bin"

[[buffers]]
name = "v"
dtype = "bf16"
shape = [1, 128, 1, 64]
