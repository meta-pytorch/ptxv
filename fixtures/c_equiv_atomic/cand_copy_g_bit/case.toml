name = "c_equiv_atomic_cand_copy_g_bit"
description = """
MISS 98 (fixtures/c_equiv_atomic/gen.py): out = a; a[i] < 0 also stored into a scratch
buffer (an input-dependent guard). expected/ is cand_copy_g's GB300 output with out[5]
0x3fb37f79 -> 0x3fb37f78 (gen.py --tamper)."""
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/anan.bin"

[[buffers]]
name = "b"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/b.bin"

[[buffers]]
name = "c"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/c.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[buffers]]
name = "scr"
dtype = "f32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "c"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "scr"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
