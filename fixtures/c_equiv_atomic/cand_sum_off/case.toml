name = "c_equiv_atomic_cand_sum_off"
description = """
MISS 98 (fixtures/c_equiv_atomic/gen.py): out = a + (b + c). expected/ is bytes 2048.. of
cand_sum's GB300 output (expect_offset), bytes 2400..2404 ignored (expect_ignore) (gen.py
--tamper)."""
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/a.bin"

[[buffers]]
name = "b"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/b.bin"

[[buffers]]
name = "c"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/c.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"
expect_offset = 2048
expect_ignore = [[2400, 4]]

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "c"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
