name = "split-shuffle-bfly"
description = "Adversarial equivalence audit of split-shuffle-bfly"
ptx = "kernel.ptx"
entry = "k"
grid = [1, 1, 1]
block = [2, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [1]
init = "zeros"
values = [[0, 1]]
[[buffers]]
name = "out"
dtype = "f32"
shape = [1]
init = "zeros"
[[params]]
kind = "ptr"
buffer = "x"
[[params]]
kind = "ptr"
buffer = "out"
[[variants]]
id = "reference"
expect = ["clean"]
[[variants]]
id = "candidate"
expect = ["clean"]
marker = "@RESULT"
find = "mov.u32 %r8, %r0;"
replace = "mov.u32 %r8, 0;"
