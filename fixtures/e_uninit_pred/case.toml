# Soundness-harness reproducer (docs/soundness-harness.md, "Confirmed misses"). The kernel is
# fixtures/c_mm_bf16_mcast (cuBLAS nvjet, cluster 8). The variants patch the SASS try-wait of
# the tile-scheduler pipeline at 0x1b70 (`SYNCS.PHASECHK.TRANS64.TRYWAIT P4, [UR12], R4`)
# followed by `BRA !P4, .L_x_33` (the retry stub, which rejoins at 0x1b90). Nothing writes P4
# on this path before 0x1b70.

[[variants]]
id = "good"
expect = ["contract"]

[[variants]]
id = "nowait"
summary = "NOP the try-wait (scoreboards cleared): BRA !P4 reads a predicate nothing wrote (uninit-reg at 0x1b80). GB300: 198/200 runs wrong, or a hang"
expect = ["contract", "violation"]
patch = [{ at = "@0x1b70", nop = true, wbar = 7, rbar = 7, expect = "NOP" }]

[[variants]]
id = "nowait_nobra"
summary = "control: NOP the try-wait and the BRA (every lane skips the wait, = P4 true in every lane). GB300: 200/200 correct"
expect = ["contract"]
patch = [{ at = "@0x1b70", nop = true, wbar = 7, rbar = 7, expect = "NOP" }, { at = "@0x1b80", nop = true, expect = "NOP" }]

[[variants]]
id = "stub"
summary = "control: keep the try-wait, make the BRA after it unconditional (every lane also runs the retry stub after the fast-path wait). GB300: 200/200 correct"
expect = ["contract"]
patch = [{ at = "@0x1b80", bits = [[87, 4, 7]] }]

[[variants]]
id = "nowait_stub"
summary = "control: NOP the try-wait and make the BRA unconditional (every lane runs only the retry stub's wait, = P4 0 in every lane, what ptxv assumes for nowait). GB300: 200/200 correct"
expect = ["contract"]
patch = [{ at = "@0x1b70", nop = true, wbar = 7, rbar = 7, expect = "NOP" }, { at = "@0x1b80", bits = [[87, 4, 7]] }]
