name = "e_uninit_pred"
description = """
Soundness-harness miss 2 (docs/soundness-harness.md, tools/mutate/repro/uninit_pred): the
cuBLAS nvjet GEMM of fixtures/c_mm_bf16_mcast (`a @ b.t()`, cluster of 8; cubin and inputs
shared with it, no expected bytes here) with the tile scheduler's fast-path
`SYNCS.PHASECHK.TRANS64.TRYWAIT P4` at 0x1b70 NOPed. The `BRA !P4` after it then reads a P4
nothing wrote. The model used to read it as 0 in every lane (every lane takes the retry stub:
the good kernel), while GB300 is wrong 198/200. Predicates now start undefined, and the read
is an `uninit-reg` violation (S-INIT-PRED). The controls are 200/200 correct on GB300 and
certify."""
