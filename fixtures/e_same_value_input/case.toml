name = "same-value-input"
description = "Adversarial equivalence audit of same-value-input"
ptx = "kernel.ptx"
entry = "k"
grid = [2, 1, 1]
block = [1, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [1]
init = "zeros"
values = [[0, 0]]
[[buffers]]
name = "out"
dtype = "f32"
shape = [1]
init = "zeros"
[[params]]
kind = "ptr"
buffer = "x"
[[params]]
kind = "ptr"
buffer = "out"
[[variants]]
id = "reference"
expect = ["clean"]
[[variants]]
id = "candidate"
expect = ["clean"]
marker = "@RESULT"
find = "selp.b32 %r2,%r0,0,%q;"
replace = "mov.b32 %r2,0;"
