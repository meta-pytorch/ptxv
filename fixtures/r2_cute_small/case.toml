  { marker = "@ALLOC_BAR", find = "bar.sync", replace = "tcgen05.fence::before_thread_sync; bar.sync" },
  { marker = "@MMA_BAR", find = "bar.sync \t2, 160;", replace = "bar.sync 2, 160; tcgen05.fence::after_thread_sync;" },
  { marker = "@MMA0", find = "tcgen05.mma", replace = "tcgen05.fence::after_thread_sync; tcgen05.mma" },
  { marker = "@MMA1", find = "tcgen05.mma", replace = "tcgen05.fence::after_thread_sync; tcgen05.mma" },
  { marker = "@MMA2", find = "tcgen05.mma", replace = "tcgen05.fence::after_thread_sync; tcgen05.mma" },
  { marker = "@LD", find = "tcgen05.ld", replace = "tcgen05.fence::after_thread_sync; tcgen05.ld" },
  { marker = "@LD", find = "];", replace = "]; tcgen05.wait::ld.sync.aligned;" },
  { marker = "@SUB_BAR", find = "bar.sync", replace = "tcgen05.fence::before_thread_sync; bar.sync" },
  { marker = "@DEALLOC", find = "tcgen05.dealloc", replace = "tcgen05.fence::after_thread_sync; tcgen05.dealloc" },
  { marker = "@STORE", find = "cp.async.bulk.tensor", replace = "{\n\t.reg .pred %pst;\n\telect.sync _|%pst, -1;\n\t@%pst cp.async.bulk.tensor" },
  { marker = "@STORE", find = "%rd41;", replace = "%rd41;\n\t}" },
