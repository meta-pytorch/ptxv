name = "c_equiv_zero_sign_choice_gsel_ref"
description = """
MISS 135 (fixtures/c_equiv_zero_sign_choice/gen.py):
out[i] = a + b, then b where a > 0 (a guarded store).
expected/ is GB300's output (ptxas 13.0 -arch=sm_103a)."""
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/a.bin"

[[buffers]]
name = "b"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/b.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
