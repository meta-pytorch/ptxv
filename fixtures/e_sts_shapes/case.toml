find = "st.volatile.shared.v2.u32 [%r2], {%r1, %r3};"
replace = "sub.u32 %r6, %r1, 8; setp.lt.u32 %p3, %r6, 16; add.u32 %r7, %r1, 1; @%p3 st.volatile.shared.u16 [%r2], %r7;"
hw_note = "GB300: lane 8's bytes remain, out = 9 0 0 0 in 500 of 500 runs (ptxv hw --runs 500 --scrub)"
expect = ["nondeterministic"]
