marker = "@ST"
find = "st.volatile.shared.v2.u32 [%r2], {%r1, %r3};"
replace = "and.b32 %r6, %r1, 1; setp.eq.u32 %p3, %r6, 1; add.u32 %r7, %r1, 1; @%p3 st.volatile.shared.u8 [%r2], %r7;"
