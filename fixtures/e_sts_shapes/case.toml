replace = "and.b32 %r6, %r1, 1; setp.eq.u32 %p3, %r6, 1; @%p3 st.volatile.shared.v4.u32 [%r2], {%r1, %r3, %r4, %r5};"
hw_note = "GB300: lane 25's bytes remain, out = 25 125 225 325 in 500 of 500 runs (ptxv hw --runs 500 --scrub)"
