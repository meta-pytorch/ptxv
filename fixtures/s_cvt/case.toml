name = "s_cvt"
description = """
Conversions of torch's dynamic-cast copy kernel (mixed_3_modules) against GB300 bitwise
(cvt.cu): F2F.F32.F64 / F64.F32 / F16.F32, F2FP.F16.F32.PACK_AB, HADD2.F32 (f16 -> f32),
F2I.S64 / U64.TRUNC, I2F.S64 / U64 / S16 / U16.H1 / S8, LDG.E.S8 / S16 on the s_alu2 operands
(and every pair of them as f64 / 64-bit integers). expected/ is GB300's output."""
cubin = "kernel.cubin"
entry = "cvt"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

