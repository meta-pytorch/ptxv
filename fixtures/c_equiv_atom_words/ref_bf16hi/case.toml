name = "c_equiv_atom_words_ref_bf16hi"
description = """
MISS 177 (equiv: the nodes of the words an atomic covers): z[2t] = x; atom.add.noftz.bf16 of 1.0
on its upper half; out = the word."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "c_equiv_atom_words_ref_bf16hi"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
