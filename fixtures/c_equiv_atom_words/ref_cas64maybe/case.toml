name = "c_equiv_atom_words_ref_cas64maybe"
description = """
MISS 177 (equiv: the nodes of the words an atomic covers): z = {0, x}; atom.cas.b64 with the
compare {0, bits(w)}, new 0: swaps only where w = x; out = the high word. Captured inputs
data_plus1/ (w = x + 1): it fails and out = x; where w = x, 0."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "c_equiv_atom_words_ref_cas64maybe"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [32]
init = "file"
file = "../data_plus1/x.bin"

[[buffers]]
name = "w"
dtype = "f32"
shape = [32]
init = "file"
file = "../data_plus1/w.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"

[[buffers]]
name = "z"
dtype = "u32"
shape = [64]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "w"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "z"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
