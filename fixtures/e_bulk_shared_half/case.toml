init = "zeros"
[[params]]
kind = "ptr"
buffer = "x"
[[params]]
kind = "ptr"
buffer = "out"
[[variants]]
id = "reference"
expect = ["clean"]
[[variants]]
id = "candidate"
expect = ["clean"]
marker = "@RESULT"
find = "st.shared.b32 [%r2], %r4;"
replace = "st.shared.b32 [%r2], 0;"
