name = "e_rs_chan_ws2"
description = """
A signal-pad channel bug (ring RS flags vs the triton RS CAS barrier on one signal-pad channel), the reporters' faithful case: torch CUDASymmetricMemory's unicast barrier as atom.cas spin loops (put 0->1 on each peer, consume 1->0 from each peer), the cute ring RS's monotonic flags (atomic add, acquire poll). ws=2, per rank: triton RS (one channel-1 CAS barrier) -> 2 x cute ring RS (flags + channel-0 end barrier) -> triton RS. good = fix (ring flags in channel 2), prefix = ring flags in channel 1: the second triton barrier's put meets a residual flag and spins forever (deadlock). Generated by gen_case.py."""
arch = "sm_103a"
ptx = "kernel.ptx"
entry = "cas_barrier"
grid = [1, 1, 1]
block = [2, 1, 1]
outputs = ["pad0", "pad1"]
# E-LAUNCH-ORDER: a hand-written case; the launch list is the stream order its author states.
launch_order = "declared"

