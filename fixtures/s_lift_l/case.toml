name = "s_lift_l"
description = """
SASS forms lifted for real CuTeDSL kernels (FA4 forward / decode, quack softmax, mslk decode, the
FA4 block-sparsity kernel), against GB300 bitwise: CREDUX.MIN / .MAX / .MINABS / .MAXABS .F32
[.NAN] over 32, 16 and 1 lanes, PLOP3.LUT with a second predicate output (`P1, P0, !P0, PT, !P1,
0x80, 0xc8`), R2P PR, Rx.B1 / .B2 / .B3, LEA.HI d, a, -b, RZ, 0x1c (torch's fp8 conversion).
128 threads x 128 operands (the s_alu2 set: 64 special bit patterns, 64 random), 16 output words
per pair. Built from liftl.cu (see its header). tests/fixtures.rs checks the model against the
FNV-1a hash of the output GB300 wrote (`ptxv hw` compares every word)."""
cubin = "kernel.cubin"
entry = "liftl"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

