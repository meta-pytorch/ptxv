name = "r4b_coreader"
description = """
fixtures/r4b_moe reduced to DeepEP's dispatch layout and notify_dispatch launches (launches
0-3, 2 ranks, same captured cubin and data), plus one co-resident reader kernel per GPU on
another stream (`after = -1`, coreader.ptx). Each reader weak-loads bytes 96..99 of line 0
of its rank's local NVLink buffer (dev4_rX offset 0x60), which nothing in the case writes:
the reader races with nothing. notify_dispatch's CTA 0 reads the peer's token counts from
bytes 0..31 of that line after its second barrier_block (entry fence, fenceless poll;
docs/deepep-repro.md handoff 1). docs/deepep-coreader.md has the results and why the same
reader is legal in a full layer under a stated configuration. Expectations are for the
default flags (closed world, one CTA per SM): crates/sim/tests/fixtures.rs
`r4b_coreader_notify` checks l1_coresident and l1_havoc."""
cubin = "../r4b_moe/k0.cubin"
entry = "_ZN7deep_ep6layout19get_dispatch_layoutILi256ELi4ELi8EEEvPKlPiS4_S4_Pbiiii"
grid = [2, 1, 1]
block = [256, 1, 1]
dynamic_smem = 0
outputs = ["cr_r0", "cr_r1"]
replicas = []

# DeepEP synchronizes through relaxed polls and a shared-memory relay; under the strict PTX
# model those are races (docs/rung4.md, T4b). These opt-ins state the hardware behaviour the
# verdict relies on. E-SMEM-CUMUL is validated on GB300; E-POLL-ACQ is REFUTED there
# (docs/poll-acq-litmus.md): verdicts with it can miss stale reads, and ptxv says so.
poll_acquire = true
# E-POLL-ACQ is refuted on GB300 (docs/poll-acq-litmus.md): an explicit opt-in, named in every
# verdict. `ptxv check` runs the GB300 hardware model (twolevel.rs) as its second level, whose
# havoc probe (E-L1-HAVOC) reports the post-barrier reads as latent-closed-world.
assume_refuted = ["E-POLL-ACQ"]
smem_cumulative = true
hw_l1 = true

