    { kind = "u32", value = 1 },
    { kind = "u32", value = 2 },
    { kind = "ptr", buffer = "in_1_1" },
    { kind = "ptr", buffer = "out_1_1" },
    { kind = "ptr", buffer = "buf0" },
    { kind = "ptr", buffer = "buf1" },
    { kind = "ptr", buffer = "buf2" },
