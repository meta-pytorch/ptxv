name = "r1g_allreduce"
description = """
Rung 1g. One-shot all-reduce over symmetric memory on 3 GPUs, two back-to-back calls per rank:
stage into the symmetric buffer, signal/wait barrier, reduce in rank order, closing barrier."""
ptx = "kernel.ptx"
entry = "allreduce"
grid = [1, 1, 1]
block = [1, 1, 1]
outputs = ["out_0_0", "out_1_0", "out_2_0", "out_0_1", "out_1_1", "out_2_1"]
replicas = [["out_0_0", "out_1_0", "out_2_0"], ["out_0_1", "out_1_1", "out_2_1"]]
# E-LAUNCH-ORDER: a hand-written case; the launch list is the stream order its author states.
launch_order = "declared"

[[buffers]]
name = "buf0"
dtype = "f32"
shape = [32]
init = "zeros"
device = 0

[[buffers]]
name = "sig0"
dtype = "u32"
shape = [3]
init = "zeros"
device = 0

[[buffers]]
name = "buf1"
dtype = "f32"
shape = [32]
init = "zeros"
device = 1

[[buffers]]
name = "sig1"
dtype = "u32"
shape = [3]
init = "zeros"
device = 1

[[buffers]]
name = "buf2"
dtype = "f32"
shape = [32]
init = "zeros"
device = 2

[[buffers]]
name = "sig2"
dtype = "u32"
shape = [3]
init = "zeros"
device = 2

[[buffers]]
name = "in_0_0"
dtype = "f32"
shape = [32]
init = "normal"
device = 0
seed = 1

[[buffers]]
name = "out_0_0"
dtype = "f32"
shape = [32]
init = "zeros"
device = 0

[[buffers]]
name = "in_1_0"
dtype = "f32"
shape = [32]
init = "normal"
device = 1
seed = 2

[[buffers]]
name = "out_1_0"
dtype = "f32"
shape = [32]
init = "zeros"
device = 1

[[buffers]]
name = "in_2_0"
dtype = "f32"
shape = [32]
init = "normal"
device = 2
seed = 3

[[buffers]]
name = "out_2_0"
dtype = "f32"
shape = [32]
init = "zeros"
