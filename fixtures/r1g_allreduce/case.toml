params = [
    { kind = "u32", value = 2 },
    { kind = "u32", value = 2 },
    { kind = "ptr", buffer = "in_2_1" },
    { kind = "ptr", buffer = "out_2_1" },
    { kind = "ptr", buffer = "buf0" },
    { kind = "ptr", buffer = "buf1" },
    { kind = "ptr", buffer = "buf2" },
    { kind = "ptr", buffer = "sig0" },
    { kind = "ptr", buffer = "sig1" },
    { kind = "ptr", buffer = "sig2" },
