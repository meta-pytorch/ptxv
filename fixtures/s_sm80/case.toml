name = "s_sm80"
description = """
Flash-attention memory forms against GB300 bitwise (sm80.cu): cp.async 16 B with commit
groups, wait_group 1 / 0 and src-size 0 (LDGSTS with a source predicate, LDGDEPBAR, DEPBAR.LE
SB0), ldmatrix x1 / x2 / x4 with and without .trans (LDSM.16.M88.N / MT88.N), local memory
(STL.128, STL, LDL) and a 64-bit pointer decrement (LEA Rd, P, -Ra, Rb, 0x8). 64 output words
per thread; expected/ is GB300's output (`ptxv hw-worker`)."""
cubin = "kernel.cubin"
entry = "sm80"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [512]
init = "bits"
seed = 3

