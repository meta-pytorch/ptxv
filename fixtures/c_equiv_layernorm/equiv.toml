# Layer norm (docs/equiv-reassoc.md, "Layer norm and RMS norm"): F.layer_norm(x, (128,), w, b,
# 1e-5) (torch: per-thread Welford with the f32 constants 1/2, 1/3, 1/4, Welford combines across
# shuffles and warps, div.rn, rsqrt.approx.f32) against Triton's two-pass layernorm (mean as
# x - S * (1/n) in one FFMA, sum of squares, MUFU.SQRT and div.full), x 4x128 f32. "L1~": the
# exact polynomials differ by Welford's rounded 1/3 (charged in the bound).
#   ptxv equiv fixtures/c_equiv_layernorm/equiv.toml --trials 200
max_states = 200000
segments = true
trials = 10
sweep_cache = "sweeps.json"
reference = { case = "../c_layernorm_torch_f32", variant = "good", front = "sass" }

[[candidates]]
case = "../c_layernorm_triton_f32"
variant = "good"
front = "sass"
expect = "L1~"
expect_bound_u = 13255
