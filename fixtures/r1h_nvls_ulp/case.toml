name = "r1h_nvls_ulp"
description = """
Review probe for the N-MULTIMEM-ROUND16 tolerance (MISS 110): fixtures/r1h_nvls_inf with
in0 = in1 = (1, 1, 1, 2). The f32 multimem.ld_reduce sum (2, 2, 2, 4) is exact: no calibrated
f16 / bf16 rounding. expected/ is CONSTRUCTED, not captured on a GPU: (0x40000001, 2, 2, 4), one
ulp off in an f32 element. Both outputs are a mismatch (until MISS 110, both were within one
ulp: the tolerance covered every output of a case with a multicast object)."""
ptx = "kernel.ptx"
entry = "nvls"
grid = [1, 1, 1]
block = [4, 1, 1]
outputs = ["out0", "out1"]
replicas = [["out0", "out1"]]

[[buffers]]
name = "buf0"
dtype = "f32"
shape = [32]
init = "zeros"
device = 0

[[buffers]]
name = "buf1"
dtype = "f32"
shape = [32]
init = "zeros"
device = 1

[[buffers]]
name = "in0"
dtype = "f32"
shape = [4]
init = "file"
file = "data/in0.bin"
device = 0

[[buffers]]
name = "in1"
dtype = "f32"
shape = [4]
init = "file"
file = "data/in1.bin"
device = 1

[[buffers]]
name = "out0"
dtype = "f32"
shape = [4]
init = "zeros"
expect = "expected/out0.bin"
device = 0

[[buffers]]
name = "out1"
dtype = "f32"
shape = [4]
init = "zeros"
expect = "expected/out1.bin"
device = 1

[[multicast]]
name = "mc"
size = 128
binds = [
    { device = 0, offset = 0, buffer = "buf0", byte_offset = 0, size = 128 },
    { device = 1, offset = 0, buffer = "buf1", byte_offset = 0, size = 128 },
]

[[params]]
kind = "ptr"
buffer = "in0"

[[params]]
kind = "ptr"
buffer = "buf0"

[[params]]
kind = "ptr"
buffer = "mc"

[[params]]
kind = "ptr"
buffer = "out0"

[[launches]]
entry = "nvls"
grid = [1, 1, 1]
block = [4, 1, 1]
device = 1
params = [
    { kind = "ptr", buffer = "in1" },
    { kind = "ptr", buffer = "buf1" },
    { kind = "ptr", buffer = "mc" },
    { kind = "ptr", buffer = "out1" },
]

[[variants]]
id = "good"
summary = "correct NVLS all-reduce"
expect = ["clean"]
