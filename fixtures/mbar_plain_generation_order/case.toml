name = "mbar_plain_generation_order"
description = """
Three plain arrivals target a barrier expecting two. If the two nonproducers arrive first,
the consumer acquires their phase and its read races with the producer's write. A local
reduction that always schedules the producer's initially noncompleting arrival first hides
that race by putting its release in the completed phase.
"""
ptx = "kernel.ptx"
arch = "sm_100a"
entry = "mbar_plain_generation_order"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["race"]
expect_sass = ["nondeterministic"]
