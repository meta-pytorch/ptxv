name = "m53_scatter"
description = """
MISS 53 (errdist data-dependent preconditions): entry m53_scatter of ../kernel.ptx (see its
header). errdist refuses it: a store address chosen by a select on input data."""
ptx = "../kernel.ptx"
entry = "m53_scatter"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "w"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "v"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "y"
dtype = "f32"
shape = [65]
init = "iota"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "w"

[[params]]
kind = "ptr"
buffer = "v"

[[params]]
kind = "ptr"
buffer = "y"

[[variants]]
id = "good"
expect = ["clean"]
