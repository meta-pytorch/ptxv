name = "m57_ffma"
description = """
MISS 57 (slice identification across a data-dependent guard): entry m57_ffma of ../kernel.ptx
(see its header), the round-4 review's repro: where x[0] < -3 a = RN(a v[i] + w[i]) (a guarded
FFMA), y[i] = RN(a + v[i]). The probes of the captured x = 0 take the other outcome, and the
slice is identified as a."""
ptx = "../kernel.ptx"
entry = "m57_ffma"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y"]

