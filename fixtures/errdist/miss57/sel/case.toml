name = "m57_sel"
description = """
MISS 57 (slice identification across a data-dependent guard): entry m57_sel of ../kernel.ptx
(see its header): as m57_guard with an FSEL choosing RN(3 a) or a (RN(RN(3 a) + v[i]) also goes to z)."""
ptx = "../kernel.ptx"
entry = "m57_sel"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y", "z"]

