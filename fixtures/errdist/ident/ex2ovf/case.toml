name = "ident_ex2ovf"
description = """MISS 147 control (the fifth review's rE_ex2ovf): entry rE_ex2ovf of ../ex2ovf.ptx (see its header), captured x = 1000: on the probes only the affine form fits."""
ptx = "../ex2ovf.ptx"
entry = "rE_ex2ovf"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [64]
init = "file"
file = "x.bin"

[[buffers]]
name = "y"
dtype = "f32"
shape = [64]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "y"

[[variants]]
id = "good"
expect = ["clean"]
