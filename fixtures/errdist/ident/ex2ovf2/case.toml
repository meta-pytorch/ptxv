name = "ident_ex2ovf2"
description = """MISS 138 and MISS 147 (the fifth review's D2): entry rE_ex2ovf of ../ex2ovf.ptx (see its header), captured x = 100: exp2, sqrt and rcp forms fit the probes about as well as the affine one."""
ptx = "../ex2ovf.ptx"
entry = "rE_ex2ovf"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [64]
init = "file"
file = "x.bin"

[[buffers]]
name = "y"
dtype = "f32"
shape = [64]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "y"

[[variants]]
id = "good"
expect = ["clean"]
