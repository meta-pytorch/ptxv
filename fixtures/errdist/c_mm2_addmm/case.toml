name = "c_mm2_addmm"
description = """
torch.compile of x @ w1 + x @ w2 (f32 64x128 @ 128x64): mm into W0, then addmm(W0, x, w2) into out.
The addmm first copies W0 into out with a device-to-device memcpy, which the capture does not
record, so the case computes out = x @ w2 + 0 (errdist refuses it: the DAG disagrees with the
captured GPU output). Captured in process by ptxv.capture (python/ptxv). 2 launch(es), binary only (cubins from CUPTI):
