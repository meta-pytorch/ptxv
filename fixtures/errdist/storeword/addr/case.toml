name = "storeword_addr"
description = """entry sw_addr of ../kernel.ptx (see its header): a selection's store word, read by another thread after a barrier, the flag as an address."""
ptx = "../kernel.ptx"
entry = "sw_addr"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "w"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "v"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "y"
dtype = "f32"
shape = [64]
init = "iota"

[[buffers]]
name = "z"
dtype = "f32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "w"

[[params]]
kind = "ptr"
buffer = "v"

[[params]]
kind = "ptr"
buffer = "y"

[[params]]
kind = "ptr"
buffer = "z"

[[variants]]
id = "good"
expect = ["clean"]
