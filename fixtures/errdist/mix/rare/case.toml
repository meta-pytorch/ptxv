name = "rE_mix"
description = """MISS 139, the third review's probe: entry rE_mix of ../kernel.ptx (see its header): 4032 bf16 outputs per input that differ together on rare inputs and 64 that differ alone on most inputs."""
ptx = "../kernel.ptx"
entry = "rE_mix"
grid = [4, 1, 1]
block = [1024, 1, 1]
outputs = ["y"]

[[buffers]]
name = "x0"
dtype = "f32"
shape = [1]
init = "normal"
seed = 7

[[buffers]]
name = "xs"
dtype = "f32"
shape = [64]
init = "normal"
seed = 8

[[buffers]]
name = "y"
dtype = "bf16"
shape = [4096]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x0"

[[params]]
kind = "ptr"
buffer = "xs"

[[params]]
kind = "ptr"
buffer = "y"

[[variants]]
id = "good"
expect = ["clean"]
