name = "clamp_min"
description = """entry cl_min of ../kernel.ptx (see its header): a minimum against a constant inside an instruction slice."""
ptx = "../kernel.ptx"
entry = "cl_min"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["y"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "v"
dtype = "f32"
shape = [64]
init = "zeros"

[[buffers]]
name = "y"
dtype = "f32"
shape = [64]
init = "iota"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "v"

[[params]]
kind = "ptr"
buffer = "y"

[[variants]]
id = "good"
expect = ["clean"]
