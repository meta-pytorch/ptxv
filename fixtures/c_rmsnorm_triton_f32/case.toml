name = "c_rmsnorm_triton_f32"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of triton_rmsnorm_f32.py (kernel ^rmsnorm_kernel$). 1 launch(es),
binary only (cubins captured from the loaded modules):
  0: rmsnorm_kernel grid [4, 1, 1] block [64, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton tools/capture_examples/triton_rmsnorm_f32.py:rmsnorm_kernel --binary --out fixtures/c_rmsnorm_triton_f32"""
