name = "c_num_stasync_f32"
description = """
MISS 205 (probes/stasync_num_shadow r5_stasync_co_c1), an explicit 1-CTA cluster launch: S[t] = x[t]
(input, rn(t + 0.1f)) by st.shared, then st.async of s = add.rn(t, 0.1f), the same bits, into S[t]
(mbarrier complete_tx); out[t] = S[t], exact t + 0.1f. expected/out.bin: GB300 (ptxv hw --runs 20
--scrub, 20 of 20 runs equal to the simulator's)."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "r5_stasync_co_c1"
grid = [1, 1, 1]
cluster = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [32]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"
expect = "expected/out.bin"

[[buffers]]
name = "z"
dtype = "u32"
shape = [512]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "z"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
