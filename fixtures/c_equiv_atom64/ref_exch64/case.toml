name = "c_equiv_atom64_ref_exch64"
description = """
MISS 177 (equiv: the nodes of the words an atomic covers): thread t stores x[t] (input data) in
the high word of buf[2t .. 2t + 1], then atom.exch.b64 writes 0 over both words, and out[t] is the
high word read back: 0. Inputs: x = 1.5 + t/64 (data/)."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "c_equiv_atom64_ref_exch64"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [32]
init = "file"
file = "../data/x.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"

[[buffers]]
name = "buf"
dtype = "u32"
shape = [64]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "buf"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
