name = "r4_attn_triton"
description = """
Rung 4. Triton flash-attention forward (online softmax, exp2), one head,
N_CTX=128, HEAD=64, BLOCK_M=64, BLOCK_N=64, bf16 q/k/v/o, f32 accumulators.
Triton 3.5.0.2+fb, num_warps=4. Captured by tools/r4_triton_capture.py (inputs
data/, GPU outputs expected/)."""
ptx = "kernel.ptx"
cubin = "kernel.cubin"
entry = "attn_fwd_kernel"
grid = [2, 1, 1]
block = [128, 1, 1]
dynamic_smem = 57376
outputs = ['o']

[[buffers]]
name = "q"
dtype = "bf16"
shape = [1, 128, 64]
init = "file"
file = "data/q.bin"

[[buffers]]
name = "k"
dtype = "bf16"
shape = [1, 128, 64]
init = "file"
file = "data/k.bin"

[[buffers]]
name = "v"
dtype = "bf16"
shape = [1, 128, 64]
init = "file"
file = "data/v.bin"

[[buffers]]
name = "o"
dtype = "bf16"
shape = [1, 128, 64]
init = "zeros"
expect = "expected/o.bin"

[[params]]
kind = "ptr"
buffer = "q"

[[params]]
kind = "ptr"
buffer = "k"

[[params]]
kind = "ptr"
buffer = "v"

[[params]]
kind = "ptr"
buffer = "o"

[[params]]
kind = "u32"
value = 1040187392

[[params]]
kind = "u64"
value = 0

[[params]]
kind = "u64"
value = 0

[[variants]]
id = "good"
summary = "as compiled by Triton"
expect = ["contract"]
hw_note = "lifts completely (LDTM/STTM .16dp32bit halves, UTCHMMA with A in TMEM and an MN-major B, cp.async with zero fill, LDSM); the run matches GB300 bitwise (expected/). The one finding is a PTX contract one: Triton 3.5 leaves the fixed bits 46-48 of its shared-memory descriptors 0 (GB300's MMA ignores them: E-DESC-VERSION, probes/desc_version)"

[[variants]]
id = "nosb"
summary = "SASS: LDTM.16dp32bit_t16_t31 R4 (S = Q K^T, read back) at 0x11d0 gets no write scoreboard (wr SB2 -> none)"
patch = [{ at = "@0x11d0", wbar = 7 }]
expect = ["contract", "violation"]
hw_note = "the softmax reads S before tcgen05.ld has written it"
