name = "r3_cute_mxf8"
description = """
Rung 3b (CuTeDSL half). CUTLASS 4.6.1 CuTeDSL Blackwell persistent block-scaled dense GEMM
(examples/python/CuTeDSL/blackwell/dense_blockscaled_gemm_persistent.py: TMA loads of A, B
and the scale factors, tcgen05.cp of the scale factors into TMEM,
tcgen05.mma.kind::mxf8f6f4.block_scale, TMEM epilogue, TMA store), MXF8:
C[128x128] f32 = (A * SFA) @ (B * SFB)^T, A[128x256] / B[128x256] e4m3, ue8m0 scales per 32 K
elements, one persistent CTA, 6 warps (TMA, MMA, 4 epilogue). Captured by capture.py; the
inputs are fixed files and gb300_C.bin is the GB300 output."""
ptx = "kernel.ptx"
entry = "kernel_cutlass_kernel_dbgpSm100BlockScaledPersistentDenseGemmKernel_object_at__TiledMMA_ThrLayoutVMNK11110000_PermutationMNK____MMAAtom_ThrID10_ShapeMNK12812832_TVLayoutA1128321281128_TVL_0"
grid = [1, 1, 1]
block = [192, 1, 1]
dynamic_smem = 220160
outputs = ["C"]
spec = "gemm_tn_mx"


[[buffers]]
name = "A"
dtype = "u8"
shape = [128, 256]
init = "file"
file = "A.bin"

[[buffers]]
name = "B"
dtype = "u8"
shape = [128, 256]
init = "file"
file = "B.bin"

[[buffers]]
name = "SFA"
dtype = "u16"
shape = [2, 256]
init = "file"
file = "SFA.bin"

[[buffers]]
name = "SFB"
dtype = "u16"
shape = [2, 256]
init = "file"
file = "SFB.bin"

[[buffers]]
name = "C"
dtype = "f32"
shape = [128, 128]
init = "zeros"

[[params]]
kind = "bytes"
hex = "000000000000000000000000"

[[params]]
kind = "bytes"
hex = "000000000000000000000000"

[[params]]
kind = "tensormap"
buffer = "A"
box = [128, 128]
dims = [256, 128]
strides = [256]
swizzle = "128B"
raw = "0000c0bdfaff0000126004001000000000000000000000000000000000000000ff0000007f0000000000000000000000000000000000007f7f00000000000000"

[[params]]
kind = "bytes"
hex = "00010000"

[[params]]
kind = "tensormap"
buffer = "B"
box = [128, 128]
dims = [256, 128]
strides = [256]
swizzle = "128B"
raw = "0080c0bdfaff0000126004001000000000000000000000000000000000000000ff0000007f0000000000000000000000000000000000007f7f00000000000000"

[[params]]
kind = "bytes"
hex = "00010000"

[[params]]
kind = "tensormap"
buffer = "SFA"
box = [256, 1]
dims = [256, 2]
strides = [512]
swizzle = "none"
raw = "0000c2bdfaff0000920004002000000000000000000000000000000000000000ff00000001000000000000000000000000000000000000ff0000000000000000"

[[params]]
kind = "bytes"
hex = "02000000"

[[params]]
kind = "tensormap"
buffer = "SFB"
box = [256, 1]
dims = [256, 2]
strides = [512]
swizzle = "none"
raw = "0004c2bdfaff0000920004002000000000000000000000000000000000000000ff00000001000000000000000000000000000000000000ff0000000000000000"

[[params]]
kind = "bytes"
hex = "02000000"

[[params]]
kind = "tensormap"
buffer = "C"
box = [32, 128]
dims = [128, 128]
strides = [512]
swizzle = "128B"
raw = "0000c1bdfaff00009263040020000000000000000000000000000000000000007f0000007f0000000000000000000000000000000000001f7f00000000000000"

[[params]]
kind = "bytes"
hex = "80000000"

[[params]]
kind = "bytes"
hex = "01000000"

[[params]]
kind = "bytes"
hex = "010000000100000000000000"

[[params]]
kind = "bytes"
hex = "0100000001000000000035b5"

[[variants]]
id = "good"
summary = "as compiled by CuTeDSL 4.6.1"
expect = ["race", "violation"]
expect_sass = ["clean"]

[[variants]]
id = "B30"
summary = "B30: each k-tile's first MMA (K-block 0) uses the scale factors of K-block 1 (sf_id 1)"
marker = "@SF0"
find = "%r16;"
replace = "%r19;"
expect = ["race", "violation"]
expect_sass = ["clean"]
