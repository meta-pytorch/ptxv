name = "e_mm_lane"
description = """
MISS 74 gap A (review repro): the 32 lanes of one multimem.st write their tid to one multicast
word (bound to buf0 on GPU 0 and buf1 on GPU 1); lane 0 then reads the word on GPU 0 through the
unicast address. Each lane's store is its own memory operation under the PTX model, so any lane's
value may remain in each copy. The lane orders gave up on an address with more than one location
(lane order only, complete, no note): good, RED and TRAP0 were clean. Now one order per distinct
value is taken for every copy at once, and the verdict is incomplete with the lane-order note
(the copies' orders are not combined). RED: one multimem.red.add.f32 by every lane, 2^24 from
lane 0 and 1.0 from the others (order-dependent rounding). TRAP0: lane 0 traps on lane 0's value,
which GB300 leaves (2000 of 2000 runs of the review's multicast probe). UNI, UNIRED: the unicast
controls (one location: MISS 74 already explored them). SASS: the stores take the same orders
(MISS 168); one REDG keeps lane order (E-LOCKSTEP), so RED and UNIRED are SASS clean.
grid 1, block 32, GPU 0."""
ptx = "kernel.ptx"
entry = "e_mm_lane"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "buf0"
dtype = "u32"
shape = [32]
init = "zeros"
device = 0

[[buffers]]
name = "buf1"
dtype = "u32"
shape = [32]
init = "zeros"
device = 1

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"
device = 0

[[multicast]]
name = "mc"
size = 128
binds = [
    { device = 0, offset = 0, buffer = "buf0", byte_offset = 0, size = 128 },
    { device = 1, offset = 0, buffer = "buf1", byte_offset = 0, size = 128 },
]

[[params]]
kind = "ptr"
buffer = "buf0"

[[params]]
kind = "ptr"
buffer = "mc"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "multimem.st of tid by every lane to one multicast word: any lane's value may remain"
expect = ["nondeterministic"]

[[variants]]
id = "UNI"
summary = "control: st.relaxed.gpu.global of tid by every lane to buf0[0] through the unicast address (MISS 74: one order per value)"
marker = "@ST"
find = "multimem.st.relaxed.gpu.global.u32 [%rd2], %r1;"
replace = "st.relaxed.gpu.global.u32 [%rd1], %r1;"
expect = ["nondeterministic"]

[[variants]]
id = "RED"
summary = "multimem.red.add.f32 by every lane, 2^24 from lane 0 and 1.0 from the others: the sum depends on the order"
marker = "@ST"
find = "multimem.st.relaxed.gpu.global.u32 [%rd2], %r1;"
replace = "multimem.red.relaxed.gpu.global.add.f32 [%rd2], %f1;"
expect = ["nondeterministic"]
expect_sass = ["clean"]

[[variants]]
id = "UNIRED"
summary = "control: red.relaxed.gpu.global.add.f32 by every lane to buf0[0] through the unicast address (2^24 from lane 0, 1.0 from the others)"
marker = "@ST"
find = "multimem.st.relaxed.gpu.global.u32 [%rd2], %r1;"
replace = "red.relaxed.gpu.global.add.f32 [%rd1], %f1;"
expect = ["nondeterministic"]
expect_sass = ["unmodeled"]

[[variants]]
id = "TRAP0"
summary = "lane 0 traps when the word it reads is 0 (lane 0's value: GB300's outcome, reviewer probe mm_lane.cu var 0, 2000 of 2000 runs)"
marker = "@OUT"
find = "st.global.u32 [%rd3], %r5;"
replace = "setp.eq.u32 %p2, %r5, 0; @%p2 trap; st.global.u32 [%rd3], %r5;"
expect = ["nondeterministic", "trap"]
