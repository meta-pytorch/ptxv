name = "c_num_atom_f64_f32"
description = """
N-NUM-TRACK (MISS 114, an f64 atomic sum decides control; the independent review's probe
r2_f64atom_ctl, kernel.ptx, gen.py): thread 0 stores 0 to acc (f64); threads 0..9 atom.add.f64 0.1 (the
f64 constant) into it (old values kept in olds). After bar.sync every thread loads acc and branches on
acc >= 1: the run's sequential sum is 0.9999999999999999 (< 1), the exact sum of the ten f64 leaves
1.0000000000000000555 (>= 1). out[t] = rn(x[t] + 2) on the < 1 path, rn(x[t] + 1) on the >= 1 path.
expected/ is GB300's output (`ptxv hw`, PTXV_HW_DUMP)."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "c_num_atom_f64_f32"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [32]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"
expect = "expected/out.bin"

[[buffers]]
name = "olds"
dtype = "f32"
shape = [20]
init = "zeros"

[[buffers]]
name = "acc"
dtype = "f32"
shape = [2]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "olds"

[[params]]
kind = "ptr"
buffer = "acc"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
