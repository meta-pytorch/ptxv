name = "mbar_count_order"
description = """
Fixture for counted mbarrier arrivals in the reductions (kernel.ptx): an mbarrier expecting 3
arrivals gets a count-1 arrival after a data write and a count-3 arrival. The count-3 arrival
first completes the phase alone, so the consumer's read races with the write; second, it
overshoots (a fault, then the consumer waits forever). The race needs the count-3 arrival
first: the stateful explorer's local reduction used to commute the count-1 arrival with it,
and DPOR's footprints did not make them dependent."""
ptx = "kernel.ptx"
arch = "sm_100a"
entry = "mbar_count_order"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
# Which value the consumer reads is an outcome of the race (E-DRF: the race is reported, the
# second outcome need not be); on the SASS front plain shared accesses are not a race, the
# two outputs are.
expect = ["deadlock", "fault", "race"]
expect_sass = ["deadlock", "fault", "nondeterministic"]

[[variants]]
id = "aba"
summary = "warp 2 arrives with count 3 twice: phase 0 can complete, flip and take the count-1 arrival in phase 1"
# A phase that completes and flips while another arrival is not ordered after it: the arrival
# lands in either phase (ABA), so its footprint depends on the order. Every execution has such
# an update, so DPOR stops at the first one and the stateful explorer decides
# (dpor.rs OVER_ARRIVAL, exec.rs rec_late).
marker = "@COUNT"
find = "mbarrier.arrive.shared::cta.b64 _, [%r3], %r6; // @COUNT"
replace = "mbarrier.arrive.shared::cta.b64 _, [%r3], %r6;\n    mbarrier.arrive.shared::cta.b64 _, [%r3], %r6;"
expect = ["deadlock", "fault", "race"]
expect_sass = ["deadlock", "fault", "nondeterministic"]
