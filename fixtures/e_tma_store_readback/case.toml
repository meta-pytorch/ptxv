name = "e_tma_store_readback"
description = """
E-ASYNC-STEP: a thread loads back an element of its own TMA store's destination. With
wait_group 0 the writes are complete (good, clean; GB300 200/200). With wait_group.read 0 only
the shared-memory source reads are complete (PTX ISA), so the global load races with the
store's write: GB300 reads the old value in 196/200 runs (ptxas moves the LDG above
UTMACMDFLUSH / DEPBAR). The PTX front used to model .read as the full wait and called it clean.
NOWAIT: race (and the store still reading at exit, contract)."""
ptx = "kernel.ptx"
entry = "e_tma_store_readback"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D", "out"]

[[buffers]]
name = "D"
dtype = "f32"
shape = [32, 32]
init = "nan"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1]
init = "zeros"

[[params]]
kind = "tensormap"
buffer = "D"
box = [32, 32]

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "D"

[[variants]]
id = "good"
summary = "wait_group 0, then the load"
expect = ["clean"]

[[variants]]
id = "READ"
summary = "wait_group.read 0, then the load: races with the store's global writes (ptxas hoists the LDG above the flush and the wait)"
marker = "@WAIT"
find = "cp.async.bulk.wait_group 0;"
replace = "cp.async.bulk.wait_group.read 0;"
expect = ["race"]
hw_note = "GB300 196/200 runs wrong (out = NaN), ptxv hw 2026-11-09"

[[variants]]
id = "NOWAIT"
summary = "no wait"
marker = "@WAIT"
replace = "<delete>"
expect = ["contract", "race"]
hw_note = "GB300 195/200 runs wrong"
