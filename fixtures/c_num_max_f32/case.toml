name = "c_num_max_f32"
description = """
Captured by tools/capture.py (torch 2.15.0a0+gite0b6c79): run() of num_max.py (kernel ^num_max_kernel$). 1 launch(es),
PTX from the JIT (kernel.ptx; its own cubin kept as jit.cubin):
  0: num_max_kernel grid [4, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton fixtures/c_num_max_f32/num_max.py:num_max_kernel --out fixtures/c_num_max_f32"""
ptx = "kernel.ptx"
executed_cubin = "jit.cubin"
ptxas_toolkit = "13.0"
arch = "sm_103a"
entry = "num_max_kernel"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [256, 64]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "y"
dtype = "f32"
shape = [256, 64]
init = "file"
file = "data/y.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [256]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "y"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
