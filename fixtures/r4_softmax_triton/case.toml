name = "r4_softmax_triton"
description = """
Rung 4. Triton row softmax, y[4x128] f32 = softmax(x, dim=-1), one CTA per row
(max, exp via MUFU.EX2, sum, divide).
Triton 3.5.0.2+fb, num_warps=2. Captured by tools/r4_triton_capture.py (inputs
data/, GPU outputs expected/)."""
ptx = "kernel.ptx"
cubin = "kernel.cubin"
entry = "softmax_kernel"
grid = [4, 1, 1]
block = [64, 1, 1]
dynamic_smem = 8
outputs = ['y']

[[buffers]]
name = "x"
dtype = "f32"
shape = [4, 128]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "y"
dtype = "f32"
shape = [4, 128]
init = "zeros"
expect = "expected/y.bin"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "y"

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "u64"
value = 0

[[params]]
kind = "u64"
value = 0

[[variants]]
id = "good"
summary = "as compiled by Triton"
expect = ["clean"]
hw_note = "the SASS run (MUFU per N-MUFU) equals expected/ (GB300) bitwise (tests/fixtures.rs captured_outputs_match_the_gpu)"

[[variants]]
id = "nosb"
summary = "SASS: SHFL.BFLY R11 (the row max's first butterfly step) at 0x1a0 gets no write scoreboard (wr SBn -> none)"
patch = [{ at = "@0x1a0", wbar = 7 }]
expect = ["violation"]
hw_note = "the consumer's wait no longer covers the variable-latency result: it reads the register before it is written"
