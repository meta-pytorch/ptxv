name = "s_sv_page"
description = """
S-SAME-VALUE per byte across a whole shadow page: a 512-byte bulk reload of a tile whose first
byte keeps its value and whose other bytes change, then a bulk store of the tile ordered after
the reload by a release / acquire flag (good, clean) or only in time by a relaxed flag (PAGE:
a race between the reload and the reads). The shadow stores a page whose bytes are all alike as one element and
updates it with one call at its first byte (Pages::for_run); until 2026-11-11 that byte stood
for the page, so PAGE was a same-value write and clean on both fronts. CONC drops the wait for
the flag, so the store runs with the reload: also clean before (every explored schedule had the
store's reads after the reload). SHIFT changes the first byte too (a race before and after);
SAME reloads identical bytes (a same-value write of every byte: clean)."""
ptx = "kernel.ptx"
entry = "s_sv_page"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "u32"
shape = [128]
init = "zeros"

[[buffers]]
name = "b"
dtype = "u32"
shape = [256]
init = "iota"

[[buffers]]
name = "out"
dtype = "u32"
shape = [128]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "release / acquire flag: the reload happens before the bulk store's reads"
expect = ["clean"]

[[variants]]
id = "PAGE"
summary = "relaxed flag: the bulk store reads the reloaded tile without happens-before"
edits = [
    { marker = "@POLL", find = "ld.acquire.cta", replace = "ld.relaxed.cta" },
    { marker = "@FLAG", find = "st.release.cta", replace = "st.relaxed.cta" },
]
expect = ["race"]

[[variants]]
id = "SHIFT"
summary = "PAGE with the reload from b + 4 (the first byte changes too)"
edits = [
    { marker = "@POLL", find = "ld.acquire.cta", replace = "ld.relaxed.cta" },
    { marker = "@FLAG", find = "st.release.cta", replace = "st.relaxed.cta" },
    { marker = "@B", find = "[%rd2], 512", replace = "[%rd5], 512" },
]
expect = ["race"]

[[variants]]
id = "CONC"
summary = "thread 32 does not wait for the flag: the bulk store runs with the reload"
marker = "@WAITBRA"
find = "@%p4 bra $L_spin;"
replace = "<delete>"
expect = ["race"]

[[variants]]
id = "SAME"
summary = "PAGE with the reload from a: identical bytes, a same-value write of every byte"
edits = [
    { marker = "@POLL", find = "ld.acquire.cta", replace = "ld.relaxed.cta" },
    { marker = "@FLAG", find = "st.release.cta", replace = "st.relaxed.cta" },
    { marker = "@B", find = "[%rd2], 512", replace = "[%rd1], 512" },
]
expect = ["clean"]
