name = "s_ptx_cute_ops"
description = """
PTX front-end forms seen in CuTeDSL output, against GB300 bitwise, both front-ends
(kernel.ptx): cp.async.{ca,cg} (4 / 8 / 16 bytes, src-size 0 zero fill, ignore-src predicate,
.L2 prefetch hint), commit_group / wait_group / wait_all, cp.async.mbarrier.arrive[.noinc],
non-tensor cp.async.bulk load (complete_tx) and store (bulk_group), mad.lo.{s,u}64,
vote.sync.{any,all,uni}.pred / ballot.b32, bar.warp.sync, div.rn.f32 and cvt.rn.bf16.f32 /
cvt.rzi.{u32,s32}.f32 on the s_ptxdiv special values and random bits, mov.b32 {h0, h1}
unpack / pack, and a cvt.rn.bf16.f32 pair fused into F2FP.BF16.F32.PACK_AB (NaN -> 0x7fff). expected/ is GB300's output (ptxv hw-worker)."""
ptx = "kernel.ptx"
entry = "s_ptx_cute_ops"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

