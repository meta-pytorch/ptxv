name = "e_mbar_reuse_ordered"
description = """
RMK4 A4: store ordered after the invalidating thread's release flag, released before (good) or after (REL_AFTER_INV) the inval. Without the synchronization reduction (PTXV_NO_SYNC_POR=1, or any kernel with st / ld.shared::cluster such as CL) good / MOV / STX / CL were a violation: value-insensitive polls (E-POLL-ANY) acquire nothing and the mbar-store finding did not trigger the plain-model rerun races do."""
ptx = "kernel.ptx"
entry = "e_mbar_reuse_ordered"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [2]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "inval; release flag; t32 acquires the flag and stores (should be clean)"
edits = [{ marker = "@REL", replace = "<delete>" }, { marker = "@INV", find = "mbarrier.inval.shared::cta.b64 [%r2];", replace = "mbarrier.inval.shared::cta.b64 [%r2]; st.release.cta.shared.u32 [%r3], %r4;" }]
expect = ["clean"]

[[variants]]
id = "DATA"
summary = "analog with data: t0 invals, plain-stores x (word after the flag), releases; t32 acquires, loads x"
edits = [{ marker = "@REL", replace = "<delete>" }, { marker = "@INV", find = "mbarrier.inval.shared::cta.b64 [%r2];", replace = "mbarrier.inval.shared::cta.b64 [%r2]; mov.u32 %r11, 9; st.shared.u32 [%r3+4], %r11; st.release.cta.shared.u32 [%r3], %r4;" }, { marker = "@STORE", find = "st.shared.u64 [%r2], %rd5;", replace = "ld.shared.u32 %r12, [%r3+4]; st.global.u32 [%rd1+4], %r12;" }]
expect = ["clean"]

[[variants]]
id = "MOV"
summary = "good with a mov between the inval and the release"
edits = [{ marker = "@REL", replace = "<delete>" }, { marker = "@INV", find = "mbarrier.inval.shared::cta.b64 [%r2];", replace = "mbarrier.inval.shared::cta.b64 [%r2]; mov.u32 %r11, 9; st.release.cta.shared.u32 [%r3], %r4;" }]
expect = ["clean"]

[[variants]]
id = "STX"
summary = "good with a plain store to x between the inval and the release"
edits = [{ marker = "@REL", replace = "<delete>" }, { marker = "@INV", find = "mbarrier.inval.shared::cta.b64 [%r2];", replace = "mbarrier.inval.shared::cta.b64 [%r2]; mov.u32 %r11, 9; st.shared.u32 [%r3+4], %r11; st.release.cta.shared.u32 [%r3], %r4;" }]
expect = ["clean"]

[[variants]]
id = "CL"
summary = "good plus an unrelated st.shared::cluster of the CTA's own word before the first bar.sync (turns off the sync reduction, sync_por_ok)"
edits = [{ marker = "@REL", replace = "<delete>" }, { marker = "@INV", find = "mbarrier.inval.shared::cta.b64 [%r2];", replace = "mbarrier.inval.shared::cta.b64 [%r2]; st.release.cta.shared.u32 [%r3], %r4;" }, { marker = "@CL", find = "// @CL", replace = "@!%p2 st.shared::cluster.u32 [%r3+4], %r4;" }]
expect = ["clean"]

[[variants]]
id = "DATAW"
summary = "analog: t0 invals, plain-stores x, releases; t32 acquires and plain-stores x (write-write, ordered)"
edits = [{ marker = "@REL", replace = "<delete>" }, { marker = "@INV", find = "mbarrier.inval.shared::cta.b64 [%r2];", replace = "mbarrier.inval.shared::cta.b64 [%r2]; mov.u32 %r11, 9; st.shared.u32 [%r3+4], %r11; st.release.cta.shared.u32 [%r3], %r4;" }, { marker = "@STORE", find = "st.shared.u64 [%r2], %rd5;", replace = "mov.u32 %r12, 5; st.shared.u32 [%r3+4], %r12;" }]
expect = ["clean"]
