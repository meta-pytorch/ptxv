name = "c_triton_gelu_bf16"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of triton_gelu_erf.py (kernel ^gelu_kernel$). 1 launch(es),
binary only (cubins captured from the loaded modules):
  0: gelu_kernel grid [4, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton tools/capture_examples/triton_gelu_erf.py:gelu_kernel --out fixtures/c_triton_gelu_bf16 --seed 0 --inputs 'x=randn(4,256,bf16)*4' --binary"""
cubin = "k0.cubin"
entry = "gelu_kernel"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "bf16"
shape = [4, 256]
init = "zeros"
expect = "expected/out.bin"

[[buffers]]
name = "x"
dtype = "bf16"
shape = [4, 256]
init = "file"
file = "data/x.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[params]]
kind = "u32"
value = 1024

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
