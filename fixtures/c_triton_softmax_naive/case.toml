name = "c_triton_softmax_naive"
description = """
Triton naive row softmax y[4x64] f32 = exp(x) / sum exp(x) (no max subtraction; exp as
ex2.approx of x * log2(e)). Captured in process by ptxv.capture (python/ptxv), cubin from CUPTI,
PTX in jit.ptx: softmax_naive grid [4, 1, 1] block [128, 1, 1]. errdist fixture: under N(50, 1)
(fixtures/errdist/shift50.json) the f32 rounding of the exp2 argument (about 72) is 99.9% of the
error's variance, a bounded uniform (crates/cli/tests/errdist_open.rs)."""
cubin = "k0.cubin"
ptxas_toolkit = "13.0"
entry = "softmax_naive"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 8
outputs = ["y"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [4, 64]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "y"
dtype = "f32"
shape = [4, 64]
init = "zeros"
expect = "expected/y.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "y"
byte_offset = 0

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
