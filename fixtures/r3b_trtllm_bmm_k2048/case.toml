name = "r3b_trtllm_bmm_k2048"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of trtllm_fp8_moe.py with
PTXV_MOE_H=2048, gemm1 only (launchcap snapshots). The kernel and routing of
fixtures/r3b_trtllm_bmm (same cubin), K = H = 2048: 16 K-blocks through the 8 smem stages, so
every stage is used twice and each pipeline mbarrier completes phases 0 and 1.
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> PTXV_MOE_H=2048 $PTXV_PYTHON tools/capture.py --file tools/capture_examples/trtllm_fp8_moe.py --kernels '^bmm_E4m3' --out fixtures/r3b_trtllm_bmm_k2048
then python3 tools/cubin_slim.py k0.cubin k0.cubin <entry>. Buffers: W1 permuted row -> token, W2
tile -> expert, W3 tile -> row limit, W7 e4m3 output [rows][2I], W6 its scales [2I/128][rows]."""
