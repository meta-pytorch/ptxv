name = "s_lift_k"
description = """
SASS forms lifted for the compile-vs-eager gaps (Triton bf16 RoPE, cuBLAS gemmSN_NN_kernel,
CUTLASS fmha_cutlassF_f32), against GB300 bitwise: FFMA2 with -a / -c operands (`.F32x2.HI_LO`, `.LO_HI`, `.F32`), VIMNMX3 / VIMNMX3.U32 (PT / !PT), FSET.BF.GT.AND / FSET.BF.NEU.AND, FCHK Rd, Ra, <f32 immediate>, ATOMS.MIN / .MAX / .MIN.S32 / .MAX.S32 RZ, LDL.U8 / LDL.U16 / STL.U8 / STL.U16.
128 threads x 128 operands (the s_alu2 set: 64 special bit patterns, 64 random); every pair
(x, y) through every form, 16 output words per pair, plus the shared words the atomics leave.
Built from liftk.cu (see its header). tests/fixtures.rs checks the model against the FNV-1a
hash of the output GB300 wrote (`ptxv hw` compares every word)."""
cubin = "kernel.cubin"
entry = "liftk"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out", "atoms"]

[[buffers]]
name = "sp"
dtype = "u32"
shape = [64]
init = "zeros"
values = [[0, 0], [1, 2147483648], [2, 1], [3, 2147483649], [4, 8388607], [5, 2155872255], [6, 4194304], [7, 3], [8, 8388608], [9, 2155872256], [10, 8388609], [11, 16777215], [12, 1065353216], [13, 3212836864], [14, 1065353217], [15, 1065353215], [16, 1056964608], [17, 1073741824], [18, 1069547520], [19, 1077936128], [20, 2139095039], [21, 4286578687], [22, 2139095038], [23, 2130706432], [24, 2139095040], [25, 4286578688], [26, 2143289344], [27, 4290772992], [28, 2139095041], [29, 2143289343], [30, 2147483647], [31, 4286578979], [32, 864026624], [33, 855638016], [34, 1266679808], [35, 1266679809], [36, 1266679807], [37, 1051372203], [38, 1069066811], [39, 1036831949], [40, 3184315597], [41, 228737632], [42, 1900671690], [43, 4048155338], [44, 201326592], [45, 872415232], [46, 3011510272], [47, 864026625], [48, 1061158912], [49, 3204448256], [50, 12582912], [51, 4194304], [52, 226492416], [53, 1904214016], [54, 2122317824], [55, 16777216], [56, 3225419776], [57, 1067450368], [58, 1065353214], [59, 1065353218], [60, 7136238], [61, 2137108966], [62, 2], [63, 1078530011]]

