name = "clc-history"
description = "Adversarial equivalence audit of clc-history"
ptx = "kernel.ptx"
entry = "k"
grid = [1, 1, 1]
block = [1, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [1]
init = "zeros"
[[buffers]]
name = "out"
dtype = "f32"
shape = [1]
init = "zeros"
[[params]]
kind = "ptr"
buffer = "x"
[[params]]
kind = "ptr"
buffer = "out"
[[variants]]
id = "reference"
expect = ["clean"]
[[variants]]
id = "candidate"
expect = ["clean"]
marker = "@RESULT"
find = "mov.f32 %f2, %f1;"
replace = "mov.f32 %f2, %f0;"
