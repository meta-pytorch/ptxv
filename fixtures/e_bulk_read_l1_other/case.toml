name = "e_bulk_read_l1_other"
description = """
E-ASYNC-STEP, SASS front (MISS 102): another thread of the issuing CTA rereads a bulk store's
destination after a bar.sync that follows the issuer's cp.async.bulk.wait_group.read. Thread
32 loads D[5] (filling the SM's L1 line) before the store; thread 0 bulk-stores a 0..1023
tile to D and waits; bar.sync; thread 32 loads D[5] again. READ: GB300 returns the stale 0
from L1 in 1000/1000 runs (D[5] = 5 in memory; 2026-11-11); with the full wait (good) 0/1000.
The strict level acquires the store's writes only at the issuer's next CCTL.IVALL (none after
a .read wait), so the barrier carries nothing and READ is a race on both fronts; at the GB300
level (L1 model) the DEPBAR acquires them and thread 32's load reads its stale line."""
ptx = "kernel.ptx"
entry = "e_bulk_read_l1_other"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D", "out", "pre"]

[[buffers]]
name = "D"
dtype = "f32"
shape = [1024]
init = "zeros"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1]
init = "zeros"

[[buffers]]
name = "pre"
dtype = "f32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "D"

[[params]]
kind = "ptr"
buffer = "pre"

[[variants]]
id = "good"
summary = "wait_group 0"
expect = ["clean"]
hw_note = "GB300 0/1000 runs stale (out = 5), 2026-11-11"

[[variants]]
id = "READ"
summary = "wait_group.read 0"
marker = "@WAIT"
find = "cp.async.bulk.wait_group 0;"
replace = "cp.async.bulk.wait_group.read 0;"
expect = ["race"]
hw_note = "GB300 1000/1000 runs read the stale 0 from L1 (out = 0, D[5] = 5), 2026-11-11"
