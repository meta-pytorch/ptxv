name = "e_exh_concolic"
description = """
Exhaustive concolic expansion (2026-11-09): input-dependent decisions every thread makes the
same way, each thread writing its own word. good: certified (four paths, all clean). Each
mutant is clean on the captured input, with a race reachable only on an untaken side (an
equality, a NaN compare, a combination of two decisions, a loop trip count, float arithmetic, a
multiplicative hash; fault_oob: an out-of-bounds store): refuted, never
certified. div0 / div0g: a division by an input word (guarded in div0g), zero only off the
captured input: never certified (PTX; ptxas's division sequence does not trap). clock: two
clock reads (0 under E-CLOCK): blocked. neg: d2's guard again, negated (a repeated atom):
certified, the repeat closed without a solver. addr: an input-dependent address, clean for
every input but not fixed on the path: blocked."""
ptx = "kernel.ptx"
entry = "exh"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "cfg"
dtype = "u32"
shape = [4]
init = "zeros"
values = [[0, 7], [1, 3], [2, 0], [3, 0]]

[[buffers]]
name = "xs"
dtype = "f32"
shape = [1]
init = "zeros"
values = [[0, 0.25]]

[[buffers]]
name = "out"
dtype = "u32"
shape = [128]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "cfg"

[[params]]
kind = "ptr"
buffer = "xs"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "four paths, every thread on its own word"
expect = ["clean"]

[[variants]]
id = "race_eq"
summary = "a race on out[0] when n == 0x12345"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "setp.eq.u32 %p3, %r2, 0x12345; @%p3 st.global.u32 [%rd3], %r1;"

[[variants]]
id = "race_nan"
summary = "a race on out[0] when x is NaN"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "setp.nan.f32 %p3, %f1, %f1; @%p3 st.global.u32 [%rd3], %r1;"

[[variants]]
id = "race_combo"
summary = "a race on out[0] when n > 100 and m == 77"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "setp.eq.u32 %p3, %r3, 77; and.pred %p4, %p3, %p1; @%p4 st.global.u32 [%rd3], %r1;"

[[variants]]
id = "race_loop"
summary = "a loop of m & 7 trips that races on out[0] on trip 5"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "and.b32 %r31, %r3, 7; mov.u32 %r32, 0; LOOP: setp.ge.u32 %p5, %r32, %r31; @%p5 bra DONE; setp.eq.u32 %p6, %r32, 5; @%p6 st.global.u32 [%rd3], %r1; add.u32 %r32, %r32, 1; bra.uni LOOP; DONE:"

[[variants]]
id = "race_fmul"
summary = "a race on out[0] when x * x > 2^23 (float arithmetic: uninterpreted in the encoding)"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "mul.rn.f32 %f2, %f1, %f1; setp.gt.f32 %p3, %f2, 0f4B000000; @%p3 st.global.u32 [%rd3], %r1;"

[[variants]]
id = "race_hash"
summary = "a race on out[0] when n * 0x9e3779b1 == 5 (mod 2^32)"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "mul.lo.u32 %r34, %r2, 0x9E3779B1; setp.eq.u32 %p3, %r34, 5; @%p3 st.global.u32 [%rd3], %r1;"

[[variants]]
id = "fault_oob"
summary = "thread 0 stores 4 KiB past out when m == 4242: out of bounds"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "setp.eq.u32 %p3, %r3, 4242; setp.eq.u32 %p4, %r1, 0; and.pred %p3, %p3, %p4; @%p3 st.global.u32 [%rd3+4096], %r1;"

[[variants]]
id = "div0"
summary = "out[t] = 1000 / m: m == 0 divides by zero on the captured path (a value-fault operand)"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "div.u32 %r31, 1000, %r3; st.global.u32 [%rd5], %r31;"

[[variants]]
id = "div0g"
summary = "a guarded division, @(n == 9) r = 1000 / m: the guard of a faulting operation is a decision"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "mov.u32 %r31, 5; setp.eq.u32 %p4, %r2, 9; @%p4 div.u32 %r31, 1000, %r3; st.global.u32 [%rd5], %r31;"

[[variants]]
id = "clock"
summary = "a race on out[0] when n == 0x12345 and two clock reads differ (clocks read 0, E-CLOCK)"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "mov.u32 %r31, %clock; add.u32 %r35, %r31, %r2; mov.u32 %r32, %clock; sub.u32 %r33, %r32, %r31; setp.ne.u32 %p4, %r33, 0; setp.eq.u32 %p5, %r35, 0x12345; and.pred %p6, %p4, %p5; @%p6 st.global.u32 [%rd3], %r1;"

[[variants]]
id = "neg"
summary = "d2's guard again, negated: a repeated atom, closed without a solver"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "@!%p2 st.global.u32 [%rd5], 4;"

[[variants]]
id = "addr"
summary = "out[(t + n) & 63]: an input-dependent address, distinct per thread for every n"
expect = ["clean"]
[[variants.edits]]
marker = "@MUT"
find = "mov.u32 %r30, 0;"
replace = "add.u32 %r33, %r1, %r2; and.b32 %r33, %r33, 63; mul.wide.u32 %rd6, %r33, 4; add.s64 %rd7, %rd3, %rd6; st.global.u32 [%rd7+256], 5;"
