name = "c_triton_dot_f32acc"
description = """
Triton row dot product y[4] bf16 = sum_k a[k] b[k], bf16 inputs (K = 256), f32 accumulator,
the sum rounded to bf16. Captured in process by ptxv.capture (python/ptxv), cubin from CUPTI,
PTX in jit.ptx. errdist fixture: under N(0, 1) the output differs from the correctly rounded
sum about once in 14,000 inputs (GB300: 7.25e-5), a rare event the analytic tier resolves only
to +-22% over its inputs (crates/cli/tests/errdist_open.rs)."""
cubin = "k0.cubin"
ptxas_toolkit = "13.0"
entry = "dot_acc_f32"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["y"]

[[buffers]]
name = "a"
dtype = "bf16"
shape = [4, 256]
init = "file"
file = "data/a.bin"

[[buffers]]
name = "b"
dtype = "bf16"
shape = [4, 256]
init = "file"
file = "data/b.bin"

[[buffers]]
name = "y"
dtype = "bf16"
shape = [4]
init = "zeros"
expect = "expected/y.bin"

[[params]]
kind = "ptr"
buffer = "a"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "b"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "y"
byte_offset = 0

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
