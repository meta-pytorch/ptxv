name = "c_triton_cumsum"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of triton_cumsum.py (kernel ^cumsum_kernel$). 1 launch(es),
binary only (cubins captured from the loaded modules):
  0: cumsum_kernel grid [4, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton tools/capture_examples/triton_cumsum.py:cumsum_kernel --binary --out fixtures/c_triton_cumsum"""
cubin = "k0.cubin"
entry = "cumsum_kernel"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 16
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [4, 128]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [4, 128]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[params]]
kind = "u32"
value = 128

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
