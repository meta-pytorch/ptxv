name = "e_scope_mixed"
description = """
S-SCOPE, complete overlap (PTX ISA 9.5 section 8.7: two memory operations are morally strong
only if, among the other conditions, they overlap completely; 8.2.4: a vector access is one
operation per element). Thread 0 writes data and releases a u32 flag with st.release.gpu; thread
32 polls the flag with an acquire load, then reads the data. good: a u32 acquire, clean. MIXED:
a u8 acquire of the flag's first byte; WIDE: a u64 acquire covering the flag and the next word.
The flag accesses overlap partially, so they are a mixed-size data race at the PTX contract
(8.7.1, 8.7.2), and the acquire does not synchronize (8.9.2, 8.9.4): until 2026-11-11 the PTX
front checked scopes only and reported both clean. VEC: a relaxed v2.u32 load whose first
element is the flag, then fence.acq_rel.gpu: complete overlap per element, clean. The SASS front
does not decide overlap (an instruction's width is not the PTX element size), so it stays
clean."""
ptx = "kernel.ptx"
entry = "e_scope_mixed"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [4]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "u32 acquire of the u32 release"
expect = ["clean"]

[[variants]]
id = "MIXED"
summary = "u8 acquire of the flag's first byte"
marker = "@LD"
find = "ld.acquire.gpu.global.u32 %r4, [%rd1+8];"
replace = "ld.acquire.gpu.global.u8 %r4, [%rd1+8];"
expect = ["race"]
expect_sass = ["clean"]

[[variants]]
id = "WIDE"
summary = "u64 acquire covering the flag and the next word"
marker = "@LD"
find = "ld.acquire.gpu.global.u32 %r4, [%rd1+8];"
replace = "ld.acquire.gpu.global.u64 %rd4, [%rd1+8]; cvt.u32.u64 %r4, %rd4;"
expect = ["race"]
expect_sass = ["clean"]

[[variants]]
id = "VEC"
summary = "relaxed v2.u32 load whose first element is the flag, then fence.acq_rel.gpu"
marker = "@LD"
find = "ld.acquire.gpu.global.u32 %r4, [%rd1+8];"
replace = "ld.relaxed.gpu.global.v2.u32 {%r4, %r6}, [%rd1+8]; fence.acq_rel.gpu;"
expect = ["clean"]
