name = "c_atom_dec_cas16"
description = """
PTX front-end forms (MISS 160): atom.dec.u32 and atom.cas.b16, each thread on its own words.
out[4t] = the value atom.dec returned, out[4t + 1] = the word after (old == 0 or old > bound
stores the bound, else old - 1; data/w.bin and data/b.bin cover each case), out[4t + 2] = the
value atom.cas.b16 on half t & 1 of w2[t] returned, out[4t + 3] = that word after (the compare is
the half's value when t & 2: it swaps in 0xabcd ^ t; else the value + 1: it fails). expected/ is
GB300's output (`ptxv hw`, PTXV_HW_DUMP)."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "c_atom_dec_cas16"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "w"
dtype = "u32"
shape = [32]
init = "file"
file = "data/w.bin"

[[buffers]]
name = "b"
dtype = "u32"
shape = [32]
init = "file"
file = "data/b.bin"

[[buffers]]
name = "w2"
dtype = "u32"
shape = [32]
init = "file"
file = "data/w2.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [128]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "w"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "w2"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
# ptxas lowers atom.cas.b16 to a loop of 32-bit ATOMG.E.CAS whose compare is carried from one
# iteration to the next: E-SPIN does not hold, so `check` stops there (MISS 174's retry loop; the
# output still equals GB300's).
expect_sass = ["unmodeled"]
