[[variants]]
id = "good"
summary = "as captured"
expect = ["contract", "race"]
hw_note = "Strict PTX model: barrier_block's relaxed-poll handoffs are races (T4b), each classified latent on GB300 by the two-level check (E-HW-L1); plus E-BULK-EXIT: the CUTLASS epilogue's TMA store and DeepEP dispatch's bulk store may still read shared memory at CTA exit (GB300 drains them). With the refuted E-POLL-ACQ opted in: contract only."

[[variants]]
id = "B32"
summary = "the compute stream does not wait for dispatch's event: rank 0's expert gather (launch 6) is ordered after nothing, so it reads the receive buffer while DeepEP's dispatch is still filling it"
after = [[6, -1]]
expect = ["race"]
hw_note = "GB300 (2026-11-12): 199/200 runs differ from the capture (launch 6 runs on a stream of its own)"

[[variants]]
id = "B33"
summary = "dispatch sender: the release fence before the channel tail store is NOPed (st.relaxed tail), so the peer can see the new tail before the token data"
patch = [{ at = "@0x3830", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode8dispatchILi2ELi768ELi8192EEEvP4int4PfPiPlS4_S5_S5_PKS2_PKfPKlSA_PKbPKiiiiiiiiiPPviii" }]
expect = ["race"]
hw_note = "GB300: correct 1000/1000 (latent)"

[[variants]]
id = "B34"
summary = "buffer reuse without a barrier: cached_notify_combine skips both of its barrier_blocks (each vote's exit branch is made unconditional), so combine writes into the peer's NVLink buffer while the peer's dispatch may still be reading it"
patch = [
    { at = "@0x0470", bits = [[12, 4, 7]], expect = "BRA `(.L_x_122)", kernel = "_ZN7deep_ep9intranode21cached_notify_combineILi2EEEvPPvPiiiiPS4_i" },
    { at = "@0x0e00", bits = [[12, 4, 7]], expect = "BRA `(.L_x_137)", kernel = "_ZN7deep_ep9intranode21cached_notify_combineILi2EEEvPPvPiiiiPS4_i" },
]
expect = ["deadlock", "race"]
hw_note = "GB300: hangs (watchdog), every run"

[[variants]]
id = "B35"
summary = "dispatch sender never publishes its channel tail (the tail store is NOPed): the receiver waits for tokens forever"
patch = [{ at = "@0x3860", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode8dispatchILi2ELi768ELi8192EEEvP4int4PfPiPlS4_S5_S5_PKS2_PKfPKlSA_PKbPKiiiiiiiiiPPviii" }]
expect = ["deadlock", "race"]
hw_note = "GB300: hangs (watchdog), every run"

[[variants]]
id = "B36"
summary = "notify_dispatch's opening barrier loses a signal (the first ATOM.ADD to the peer's barrier slot is NOPed): the peer's barrier_block never completes"
patch = [{ at = "@0x0180", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode15notify_dispatchILi2EEEvPKiPiS3_S4_iiiPKbS4_S4_iiPPvPS4_i" }]
expect = ["deadlock"]
hw_note = "GB300: hangs (watchdog), every run"

[[variants]]
id = "B37"
summary = "the comm stream does not wait for the compute stream before combine: rank 0's cached_notify_combine (launch 19) is ordered only after dispatch, so combine reads the expert outputs while the bf16 cast is still writing them"
after = [[19, 5]]
expect = ["race"]
hw_note = "GB300 (2026-11-12): launch 19 runs on a stream of its own after launch 5 only; 200/200 runs match the capture at this timing. With a 50 ms spin kernel inserted on GPU 0 before launch 18 (rank 0's bf16 copy into W18_r0, which combine reads), 200/200 runs differ from the capture (896 words, one distinct output), good 0/200"

[[variants]]
id = "B38"
summary = "wrong expert offset: prepare_grouped_gemm_data does not load offs[g-1] (the load is NOPed), so every expert's group starts at row 0: expert 1's tensor maps cover rows 0..offs[1] and its TMA loads run past the gathered rows' allocation (the model faults there; the GEMM's pipeline then never completes)"
patch = [{ at = "@0x01e0", nop = true, expect = "NOP", cubin = "k2.cubin", kernel = "_ZN2at4cuda6detail25prepare_grouped_gemm_dataIN7cutlass10bfloat16_tES4_S4_fN4cute5tupleIJiiiEEENS6_IJlNS5_1CILi1EEENS8_ILi0EEEEEESB_SB_EEvPT_PT0_PT1_PT2_SJ_PSD_PSF_PSH_PSJ_SN_PT3_PT4_PT5_PT6_PKiiiiSt5arrayIlLm3EESZ_SZ_SZ_SZ_llbb" }]
expect = ["fault", "deadlock", "race"]
hw_note = "GB300: y bitwise unchanged 1000/1000: the out-of-range rows are read from and written to memory outside the observed tensors (the model faults at the first out-of-allocation TMA access)"

[[variants]]
id = "B39"
summary = "notify_dispatch: the release fence before its closing barrier is NOPed (MEMBAR.ALL.SYS), so the per-rank token counts it wrote into the peers' buffers are not published by the barrier signal"
patch = [{ at = "@0x1000", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode15notify_dispatchILi2EEEvPKiPiS3_S4_iiiPKbS4_S4_iiPPvPS4_i" }]
expect = ["race"]
hw_note = "GB300: correct 1000/1000 (latent)"

[[variants]]
id = "B40"
summary = "scope too narrow: notify_dispatch's closing barrier signals the peer GPU's slots with ATOM.ADD.STRONG.GPU instead of .SYS, so the peer's system-scope poll does not synchronize with it and the token counts written before the barrier race with their reads"
patch = [
    { at = "@0x1100", bits = [[77, 4, 7]], expect = "ATOM.E.ADD.STRONG.GPU PT, RZ, desc[UR36][R4.64], R3", kernel = "_ZN7deep_ep9intranode15notify_dispatchILi2EEEvPKiPiS3_S4_iiiPKbS4_S4_iiPPvPS4_i" },
    { at = "@0x1140", bits = [[77, 4, 7]], expect = "ATOM.E.ADD.STRONG.GPU PT, RZ, desc[UR36][R6.64], R13", kernel = "_ZN7deep_ep9intranode15notify_dispatchILi2EEEvPKiPiS3_S4_iiiPKbS4_S4_iiPPvPS4_i" },
]
expect = ["race"]
hw_note = "GB300: correct 1000/1000 (NVLink peers see .GPU atomics; contract-level, like B56)"
