# DeepEP synchronizes through relaxed polls and a shared-memory relay; under the strict PTX
# model those are races (docs/rung4.md, T4b). E-SMEM-CUMUL is validated on GB300 and stays on.
# E-POLL-ACQ is REFUTED there (docs/poll-acq-litmus.md) and is no longer set: the strict model
# reports barrier_block's races, and `ptxv check` classifies them against the GB300 hardware
# model (E-HW-L1, crates/sim/src/twolevel.rs) as latent. The old verdicts reproduce with
# `PTXV_POLL_ACQUIRE=1 ptxv check --assume-refuted E-POLL-ACQ ...` (named in the verdict).
smem_cumulative = true
# E-LAUNCH-ORDER: captured before launch orders were recorded, but tools/capture_dist.py saw two
# streams per rank and ordered every switch between them by an event (capture.json notes: an
# event recorded after the previous launch and waited for before the next; no kernel filter,
# no graph capture), so each GPU's list is an order CUDA enforced.
launch_order = "declared"

