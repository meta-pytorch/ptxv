name = "e_sentinel_fill"
description = """
Input coverage and input mutation (2026-11-08): the shape of a
bucket-fill kernel whose lanes without a slot store their indices to one
sentinel-row address. All-valid captured input: clean, with one input-coverage note (`ok != 0`
never false); --mutate-inputs (ok = 0 in two lanes of different warps): race on the sentinel
word. fixed: only valid lanes store (the later fix of that kernel): clean on the mutated input."""
ptx = "kernel.ptx"
entry = "sentinel_fill"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["flat"]

[[buffers]]
name = "bucket"
dtype = "u32"
shape = [64]
init = "iota"

[[buffers]]
name = "ok"
dtype = "u32"
shape = [64]
init = "zeros"
values = [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1], [12, 1], [13, 1], [14, 1], [15, 1], [16, 1], [17, 1], [18, 1], [19, 1], [20, 1], [21, 1], [22, 1], [23, 1], [24, 1], [25, 1], [26, 1], [27, 1], [28, 1], [29, 1], [30, 1], [31, 1], [32, 1], [33, 1], [34, 1], [35, 1], [36, 1], [37, 1], [38, 1], [39, 1], [40, 1], [41, 1], [42, 1], [43, 1], [44, 1], [45, 1], [46, 1], [47, 1], [48, 1], [49, 1], [50, 1], [51, 1], [52, 1], [53, 1], [54, 1], [55, 1], [56, 1], [57, 1], [58, 1], [59, 1], [60, 1], [61, 1], [62, 1], [63, 1]]

[[buffers]]
name = "flat"
dtype = "u32"
shape = [65]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "bucket"

[[params]]
kind = "ptr"
buffer = "ok"

[[params]]
kind = "ptr"
buffer = "flat"

[[params]]
kind = "u32"
value = 64

[[variants]]
id = "good"
summary = "every lane stores; invalid lanes to the sentinel word (racy only with two invalid lanes)"
expect = ["clean"]

[[variants]]
id = "fixed"
summary = "only valid lanes store"
expect = ["clean"]
[[variants.edits]]
marker = "@STORE"
find = "st.global.u32 [%rd8], %r2;"
replace = "@%p1 st.global.u32 [%rd8], %r2;"

[[variants]]
id = "derived"
summary = "the flag is compared after arithmetic (ok + 1 != 1): --mutate-inputs refuses"
expect = ["clean"]
[[variants.edits]]
marker = "@CMP"
find = "setp.ne.s32 %p1, %r4, 0;"
replace = "add.s32 %r6, %r4, 1; setp.ne.s32 %p1, %r6, 1;"
