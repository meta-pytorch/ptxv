name = "c_fmax_atomic"
description = """
Row maxima through CUTLASS's atomicMaxFloat into shared memory (4 warps per row). Y[r] = max_j X[r][j], X[32 x 128] f32 (fixtures/c_equiv_fmax/fmax.cu)."""
cubin = "kernel.cubin"
entry = "rowmax_atomic"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["Y"]

[[buffers]]
name = "X"
dtype = "f32"
shape = [32, 128]
init = "normal"
seed = 41

[[buffers]]
name = "Y"
dtype = "f32"
shape = [32]
init = "nan"
expect = "expected/Y.bin"

[[params]]
kind = "ptr"
buffer = "X"

[[params]]
kind = "ptr"
buffer = "Y"

[[variants]]
id = "good"
expect = ["clean"]
