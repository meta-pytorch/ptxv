[[variants]]
id = "good"
summary = "as shipped in flashinfer 0.5.3 (cubin slimmed by tools/cubin_slim.py)"
expect = ["contract"]
hw_note = "E-BULK-EXIT (epilogue TMA stores not waited for before exit) and E-TC-EXIT (the MMA warp's last two tcgen05.commit arrive on load-stage empty barriers nobody waits for). Certified for the whole grid (E-WELLSYNC); GB300 bitwise = simulator."

[[variants]]
id = "B25"
summary = "B25: the token loader arms its stage mbarrier with expect_tx(512) where the two gather4 loads deliver 1024 bytes"
patch = [{ at = "@0x15d0", bits = [[32, 32, 512]], expect = "IMAD.MOV.U32 R0, RZ, RZ, 0x200" }]
expect = ["race", "violation"]
hw_note = "the phase completes after one gather: the MMA reads unwritten stage bytes (race) and the other gather may land after exit (violation); GB300 hangs every run"

[[variants]]
id = "B27"
summary = "B27: the first epilogue half computes its token offset as ctaid.y * 4 (not * 8): neighbouring CTAs store overlapping rows"
patch = [{ at = "@0x2870", bits = [[32, 32, 2]], expect = "USHF.L.U32 UR4, UR13, 0x2, URZ" }]
expect = ["race"]
hw_note = "races inside a CTA (scale STGs) and across CTAs (--slices); GB300 wrong 100/100, 6 distinct outputs"

[[variants]]
id = "B28"
summary = "B28: the first MMA of the second K-block accumulates (enable_input_d) instead of starting its TMEM accumulator fresh"
patch = [{ at = "@0x4ad0", bits = [[90, 1, 0]], expect = "UTCQMMA gdesc[UR4], gdesc[UR6], tmem[UR13], tmem[UR10], idesc[UR11], UPT" }]
expect = ["violation"]
hw_note = "accumulates into never-written TMEM; GB300 wrong 99/100 (run 0 correct: TMEM starts zeroed)"

[[variants]]
id = "B30"
summary = "B30: the scale loader does not advance the weight-scale pointer after K-block 0, so K-block 1 is scaled by K-block 0's weight scale"
patch = [{ at = "@0x1c40", bits = [[32, 32, 0]], expect = "IADD3 R4, P0, PT, R4, 0x0, RZ" }]
expect = ["contract"]
hw_note = "execution unchanged; the numerics claim fails (tests/r3b.rs); GB300 = the simulator's B30 output bitwise 1000/1000 (PTXV_HW_EXPECT=variant)"
