name = "s_warpcoll"
description = """
Warp-collective SASS forms of torch.topks gatherTopK against GB300 bitwise (see warpcoll.cu):
REDUX / REDUX.OR / .XOR / .SUM, CREDUX.MIN / .MAX (.S32), VOTEU.ANY UR, SR_LEMASK / GEMASK /
GTMASK / EQMASK / LTMASK, and ptxass collective lowering of run-time member masks (REDUX.OR,
R2UR P, `BRA.DIV`, `WARPSYNC.COLLECTIVE` ... `ENDCOLLECTIVE`), in four data-dependent groups per
warp. `gb300_fnv` in tests/fixtures.rs is the FNV-1a hash of GB300s output."""
