name = "e_race_dead"
description = """
Fixture for E-RACE-DEAD (race_dead.rs): the loads of a global word by the threads other than
thread 0 race with thread 0's store of the word plus one. Their values are never used (good):
the races are `race-dead` findings and the verdict is clean. RD1: warp 1 stores the value it
loaded, so the race stays a race (positive control). RDMIX (MISS 226): the loads read one byte
of the word, a mixed-size data race with the u32 store (PTX ISA 9.5 section 8.7.2): it stays a
race on the PTX front although the values are dead; the SASS front does not decide overlap."""
ptx = "kernel.ptx"
entry = "e_race_dead"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["cnt", "out"]

[[buffers]]
name = "cnt"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "out"
dtype = "u32"
shape = [64]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "cnt"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "RD1"
summary = "warp 1 stores the value it loaded"
marker = "@USE"
find = "st.global.u32 [%rd4], %r1;"
replace = "st.global.u32 [%rd4], %r5;"
expect = ["race"]

[[variants]]
id = "RDMIX"
summary = "the loads read one byte of the word (ld.global.u8), unused by warp 1: a mixed-size data race with thread 0's u32 store, which the axioms do not describe (8.7.2): race on the PTX front (until 2026-11-12: race-dead, clean). SASS: overlap not decided: race-dead, clean"
marker = "@LOAD"
find = "ld.global.u32 %r5, [%rd1];"
replace = "ld.global.u8 %r5, [%rd1];"
expect = ["race"]
expect_sass = ["clean"]
