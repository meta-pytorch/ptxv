name = "e_vcache_order"
description = """
E-LAUNCH-ORDER and the verdict cache (crates/cli/src/vcache.rs): a writer and a reader of its
output with ld.global.nc, the next launch on the GPU. The case's order is unknown (no
launch_order), so the grids may run at the same time and S-NC reports the .nc read (good: race
+ violation); variant DECL declares the order (clean). `ptxv check --variant DECL --certify` does not store DECL's verdict, as DECL edits the
launch order; equiv's precondition for DECL (equiv.toml) checks DECL's order again: clean, not
the case's violation (crates/cli/tests/launch_order.rs)."""
ptx = "kernel.ptx"
entry = "writer"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "src"
dtype = "f32"
shape = [32]
init = "normal"
seed = 3

[[buffers]]
name = "data"
dtype = "f32"
shape = [32]
init = "zeros"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "data"

[[launches]]
entry = "reader"
grid = [1, 1, 1]
block = [32, 1, 1]
params = [
    { kind = "ptr", buffer = "data" },
    { kind = "ptr", buffer = "out" },
]

[[variants]]
id = "good"
summary = "order unknown: the grids may run at the same time, so the .nc read of the writer's output races with it and is an S-NC violation"
expect = ["race", "violation"]

[[variants]]
id = "DECL"
summary = "the same launches with the order declared: clean"
launch_order = "declared"
expect = ["clean"]
