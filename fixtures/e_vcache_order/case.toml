name = "e_vcache_order"
description = """
E-LAUNCH-ORDER and the verdict cache (crates/cli/src/vcache.rs): a writer and a reader of its
output with ld.global.nc, the next launch on the GPU. The case's order is unknown (no
launch_order), so S-NC reports the .nc read (good: violation); variant DECL declares the order
(clean). `ptxv check --variant DECL --certify` stores DECL's verdict; equiv and errdist build
their precondition's machine from the case as loaded, without the variant's launch-order
edits, so DECL's cached verdict is not theirs: their precondition must explore (violation), not
reuse it (equiv.toml; crates/cli/tests/equiv.rs)."""
ptx = "kernel.ptx"
entry = "writer"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "src"
dtype = "f32"
shape = [32]
init = "normal"
seed = 3

[[buffers]]
name = "data"
dtype = "f32"
shape = [32]
init = "zeros"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "data"

[[launches]]
entry = "reader"
grid = [1, 1, 1]
block = [32, 1, 1]
params = [
    { kind = "ptr", buffer = "data" },
    { kind = "ptr", buffer = "out" },
]

[[variants]]
id = "good"
summary = "order unknown: the .nc read of the writer's output is an S-NC violation"
expect = ["violation"]

[[variants]]
id = "DECL"
summary = "the same launches with the order declared: clean"
launch_order = "declared"
expect = ["clean"]
