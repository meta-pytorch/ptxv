name = "e_mbar_async_live"
description = """
Writes over a live mbarrier by an atomic, cp.async or a TMA bulk copy (MISS 256). Thread 32
writes over `a`'s bytes between its init and its later uses with no mbarrier.inval. MISS 218
reports a plain store over a live mbarrier as a contract violation (PLAIN, control); the same
write by atom.shared.add (ATOM), red.shared.add (RED), cp.async.ca (CPASYNC) or a
cp.async.bulk completing on another mbarrier (BULK) is clean on both fronts. NEAR (the atomic on
the word next to `a`) is clean."""
ptx = "kernel.ptx"
entry = "e_mbar_async_live"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "src"
dtype = "u32"
shape = [8]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "src"

[[variants]]
id = "PLAIN"
summary = "control: st.shared.u64 of zero over the live a (reported since MISS 218)"
expect = ["violation"]

[[variants]]
id = "ATOM"
summary = "atom.shared.add.u32 on the live a's low word (returns the old value)"
marker = "@WRITE"
find = "st.shared.u64 [%r2], %rd5;"
replace = "atom.shared.add.u32 %r6, [%r2], 1;"
expect = ["violation"]

[[variants]]
id = "RED"
summary = "red.shared.add.u32 on the live a's low word"
marker = "@WRITE"
find = "st.shared.u64 [%r2], %rd5;"
replace = "red.shared.add.u32 [%r2], 1;"
expect = ["violation"]

[[variants]]
id = "CPASYNC"
summary = "cp.async.ca.shared.global of 8 bytes into the live a, committed and waited for"
marker = "@WRITE"
find = "st.shared.u64 [%r2], %rd5;"
replace = "cp.async.ca.shared.global [%r2], [%rd2], 8; cp.async.commit_group; cp.async.wait_group 0;"
expect = ["violation"]

[[variants]]
id = "BULK"
summary = "cp.async.bulk of 16 bytes into the live a, completing on b, waited for"
marker = "@WRITE"
find = "st.shared.u64 [%r2], %rd5;"
replace = "mbarrier.arrive.expect_tx.shared::cta.b64 _, [%r3], 16; cp.async.bulk.shared::cluster.global.mbarrier::complete_tx::bytes [%r2], [%rd2], 16, [%r3]; BW: mbarrier.try_wait.parity.shared::cta.b64 %p5, [%r3], 0; @!%p5 bra BW;"
expect = ["violation"]

[[variants]]
id = "NEAR"
summary = "control: the atom.shared.add.u32 on c, next to a (clean)"
marker = "@WRITE"
find = "st.shared.u64 [%r2], %rd5;"
replace = "atom.shared.add.u32 %r6, [%r4], 1;"
expect = ["clean"]
