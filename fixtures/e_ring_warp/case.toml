name = "e_ring_warp"
description = """
Fixture for C-RING (E-WELLSYNC) with DeepEP's consumer shape: e_ring's ring consumed by a CTA
of two warps; warp 0 polls the tail in a warp-level loop and relays it through shared memory,
and the warps share each chunk's slots by warp index, so which warp copies which slot depends
on the tails seen. See kernel.ptx."""
ptx = "kernel.ptx"
entry = "e_ring_warp"
grid = [2, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "src"
dtype = "u32"
shape = [6]
init = "iota"

[[buffers]]
name = "buf"
dtype = "u32"
shape = [4]
init = "zeros"

[[buffers]]
name = "head"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "tail"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "out"
dtype = "u32"
shape = [8]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "buf"

[[params]]
kind = "ptr"
buffer = "head"

[[params]]
kind = "ptr"
buffer = "tail"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "correct ring, warp-level poll, slots shared by the two warps"
expect = ["clean"]

[[variants]]
id = "R1"
summary = "the producer publishes the chunk's tail before writing its payload"
marker = "(head wait slot)"
find = "// (head wait slot)"
replace = "add.u32 %r21, %r3, 2; st.release.gpu.global.u32 [%rd4], %r21;"
expect = ["race"]

[[variants]]
id = "R2"
summary = "the copy loop reads one slot past the tail it saw"
marker = "@BOUND"
find = "setp.ge.u32 %p5, %r12, %r11;"
replace = "setp.gt.u32 %p5, %r12, %r11;"
expect = ["race"]

[[variants]]
id = "R4"
summary = "a threshold branch on the observed batch size changes the stored value"
marker = "@VALUE"
find = "add.u32 %r15, %r15, 1;"
replace = "sub.u32 %r16, %r11, %r10; setp.le.u32 %p10, %r16, 2; @%p10 bra NOBUMP; add.u32 %r15, %r15, 1; NOBUMP: add.u32 %r15, %r15, 1;"
expect = ["nondeterministic"]

[[variants]]
id = "R7"
summary = "the consumer stores how many batches it took (an implicit flow of the chunking)"
marker = "@COUNT"
find = "// (batch count slot)"
replace = "setp.ne.u32 %p11, %r1, 0; @%p11 bra DONE; st.global.u32 [%rd5+28], %r20;"
expect = ["nondeterministic"]

[[variants]]
id = "W1"
summary = "both warps copy the same slots: two unordered plain writes of each output word"
marker = "@START"
find = "add.u32 %r12, %r10, %r31;"
replace = "mov.u32 %r12, %r10;"
expect = ["race"]
