name = "c_equiv_atomic_ftz_mixA_ref_n"
description = """
MISS 134 (fixtures/c_equiv_atomic_ftz/gen.py): out[i] = (+0 + a[i] (FTZ)) + b[i] (bulk, no flush), one thread per 4 elements; input set n. expected/ is GB300's
output (ptxas 13.0 -arch=sm_103a)."""
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "f32"
shape = [1024]
