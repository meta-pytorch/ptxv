name = "c_equiv_atomic_ftz_ftz2_ab_s"
description = """
MISS 134 (fixtures/c_equiv_atomic_ftz/gen.py): out[i] = (+0 + a[i]) + b[i], both FTZ; input set s. expected/ is GB300's
output (ptxas 13.0 -arch=sm_103a)."""
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/a_s.bin"

[[buffers]]
name = "b"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/b_s.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
