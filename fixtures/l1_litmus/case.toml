name = "l1_litmus"
description = """
E-HW-L1 validation (docs/deepep-repro.md): a producer CTA hands a payload to a consumer CTA
through DeepEP barrier_block's shapes (weak store + fence.acq_rel.sys + relaxed atomic signal;
relaxed ld.volatile poll, bar.sync, weak read), with the payload line's L1 state varied as in
docs/poll-acq-litmus.md. GB300 results per variant are quoted in each summary."""
ptx = "kernel.ptx"
entry = "l1lit"
grid = [2, 1, 1]
block = [64, 1, 1]
outputs = ["out"]
hw_l1 = true

[[buffers]]
name = "pay"
dtype = "u32"
shape = [32]
init = "zeros"

[[buffers]]
name = "flag"
dtype = "u32"
shape = [32]
init = "zeros"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "pay"

[[params]]
kind = "ptr"
buffer = "flag"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "pr0"
summary = "DeepEP barrier_block: entry fence, nothing loads the payload in the window (GB300 bb-f0: 0 stale in 1.4e12)"
marker = "@ENTRY"
find = "// (entry slot)"
replace = "fence.acq_rel.sys;"
expect = ["race"]

[[variants]]
id = "pr0-payld"
summary = "entry fence, another warp of the SM loads the payload during the barrier (GB300 poll-f0-rd0-pr0-payld: 0.14% stale)"
marker = "@ENTRY"
find = "// (entry slot)"
replace = "fence.acq_rel.sys;"
edits = [{ marker = "@STRESS", find = "// (stress slot)", replace = "ld.global.u32 %r9, [%rd1]; and.b32 %r9, %r9, -2147483648;" }]
expect = ["race", "stale"]

[[variants]]
id = "pr1"
summary = "no entry fence, no load before the poll: the line is not in L1 (GB300: stale only when the line is valid)"
marker = "@ENTRY"
find = "// (entry slot)"
replace = "// none"
expect = ["race"]

[[variants]]
id = "pr2"
summary = "weak payload load just before the poll (GB300 poll-f0-rd1-pr2: 76% stale)"
marker = "@PRE"
find = "// (pre slot)"
replace = "ld.global.u32 %r9, [%rd1]; and.b32 %r9, %r9, -2147483648;"
expect = ["race", "stale"]

[[variants]]
id = "pr3"
summary = "weak payload load in every poll iteration (GB300 poll-f0-rd1-pr3: 80% stale)"
marker = "@RELOAD"
find = "// (reload slot)"
replace = "ld.global.u32 %r9, [%rd1]; and.b32 %r9, %r9, -2147483648;"
expect = ["race", "stale"]

[[variants]]
id = "pr3-swap"
summary = "pr3 with the roles swapped (CTA 0 consumes, CTA 1 produces): the explorer reaches the state after the poll first on the path where the poll saw the flag at once (no reload before it), so a state hash without the logs' clocks merges away the path with the early reload"
marker = "@RELOAD"
find = "// (reload slot)"
replace = "ld.global.u32 %r9, [%rd1]; and.b32 %r9, %r9, -2147483648;"
edits = [{ marker = "@ROLE", find = "setp.ne.u32", replace = "setp.eq.u32" }]
expect = ["race", "stale"]

[[variants]]
id = "neg"
summary = "negative control: weak load before the poll, then fence.acq_rel.sys after the poll (GB300 ctl-neg-poll-rd3: 0 stale). The race is the early load itself"
marker = "@PRE"
find = "// (pre slot)"
replace = "ld.global.u32 %r9, [%rd1]; and.b32 %r9, %r9, -2147483648;"
edits = [{ marker = "@POST", find = "// (post slot)", replace = "fence.acq_rel.sys;" }]
expect = ["race"]

[[variants]]
id = "neg-payld"
summary = "entry fence + stress loads + acquire fence after the poll (the one-instruction DeepEP fix)"
marker = "@ENTRY"
find = "// (entry slot)"
replace = "fence.acq_rel.sys;"
edits = [{ marker = "@STRESS", find = "// (stress slot)", replace = "ld.global.u32 %r9, [%rd1]; and.b32 %r9, %r9, -2147483648;" }, { marker = "@POST", find = "// (post slot)", replace = "fence.acq_rel.sys;" }]
# The stress load's value is masked to 0 (dead): `race-dead`, verdict clean (E-RACE-DEAD).
# Before 2026-11-07 the explorer's race log kept racing reads from its first search (an
# acquire poll taken as value-insensitive acquires nothing, so the final payload read looked
# racy) and the race stayed a race; the certificate (C-POLL-ATOM) and the explorer now agree.
expect = ["clean"]

[[variants]]
id = "pr0-lineshare"
summary = "entry fence; another warp of the SM reads a different, unchanging word of the payload's L1 line during the barrier (race-free line sharing, the DeepEP co-reader shape): stale on the payload read"
marker = "@ENTRY"
find = "// (entry slot)"
replace = "fence.acq_rel.sys;"
edits = [{ marker = "@STRESS", find = "// (stress slot)", replace = "ld.global.u32 %r9, [%rd1+4]; and.b32 %r9, %r9, -2147483648;" }]
expect = ["race", "stale"]
