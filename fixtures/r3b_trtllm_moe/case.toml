name = "r3b_trtllm_moe"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of trtllm_fp8_moe.py, the whole
flashinfer 0.5.3 trtllm_fp8_block_scale_moe call. 5 launches, binary only:
  0: moe::dev::routing::routingRenormalize::routingIndicesClusterKernel  grid [8,1,1] block [1024,1,1]
     cluster [8,1,1] (compiled in) pdl
  1: bmm_E4m3_E4m3E4m3_Fp32_t128x8x128u2_s8_..._dsFp8_..._bN_tma_..._dynBatch (gemm1)  grid [2,7,1] block [416,1,1]
  2: moe::dev::activation::activationDeepSeekKernel  grid [1,16,2] block [128,1,1] pdl
  3: bmm_Bfloat16_E4m3E4m3_Fp32_t128x8x128_s8_..._dsFp8_..._bN_tmaOpt_..._dynBatch (gemm2)  grid [2,7,1] block [384,1,1]
  4: moe::dev::finalize::finalizeKernel  grid [1,16,1] block [256,1,1] pdl
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --file tools/capture_examples/trtllm_fp8_moe.py --out fixtures/r3b_trtllm_moe
then python3 tools/cubin_slim.py on each kN.cubin with its launched kernels. Rung 3b, the full MoE
(docs/rung3b.md). T = 16 tokens, H = 256, I = 128, top-2 of E = 4 (8 tokens per expert). Buffers:
W0 padded rows; W1 expanded (token, k) -> permuted row; W2 permuted row -> token; W5 tile ->
expert; W6 tile -> row limit; W7 non-exiting CTAs; W8 bf16 routing weights [T][2]; W9 / W10
gemm1 e4m3 output and scales; W12 / W11 activation e4m3 output and scales; W13 gemm2 bf16 output;
out the bf16 MoE output (expected: GB300's)."""
cubin = "k0.cubin"
