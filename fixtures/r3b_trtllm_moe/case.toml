[[variants]]
id = "good"
summary = "as shipped in flashinfer 0.5.3 (cubins slimmed by tools/cubin_slim.py)"
expect = ["race"]
hw_note = "T3b-2: gemm2's warp 0 frees TMEM (UTCATOMSWS.AND, sass:0x1cc0) after a named barrier of epilogue warps 0-3 only; the second M half's MMAs (committed to the mbarrier only warps 4-7 wait on) and warps 4-7's LDTM are not ordered before it. GB300: out bitwise = simulator 1000/1000 (one CTA per SM: nothing can reallocate the freed columns)"

[[variants]]
id = "fixed"
summary = "good with gemm2's two epilogue halves meeting at named barrier 9 (256 threads) before warp 0 frees TMEM: warps 0-3's BAR.SYNC 0x9, 0x80 and warps 4-7's last BAR.SYNC 0x7, 0x80 become BAR.SYNC 0x9, 0x100"
patch = [
    { at = "@0x1ad0", bits = [[42, 12, 256]], expect = "BAR.SYNC.DEFER_BLOCKING 0x9, 0x100", cubin = "k3.cubin", kernel = "bmm_Bfloat16_E4m3E4m3_Fp32_t128x8x128_s8_et64x8_m64x8x32_cga1x1x1_16dp256b_rM_TN_transOut_noShflA_dsFp8_schedS_bN_tmaOpt_clmp_dynBatch_sm100f" },
    { at = "@0x2790", bits = [[42, 12, 256], [54, 6, 9]], expect = "BAR.SYNC.DEFER_BLOCKING 0x9, 0x100", cubin = "k3.cubin", kernel = "bmm_Bfloat16_E4m3E4m3_Fp32_t128x8x128_s8_et64x8_m64x8x32_cga1x1x1_16dp256b_rM_TN_transOut_noShflA_dsFp8_schedS_bN_tmaOpt_clmp_dynBatch_sm100f" },
]
expect = ["contract"]
hw_note = "certified (E-WELLSYNC) for all five launches; contracts only (E-BULK-EXIT, E-TC-EXIT); GB300 out = simulator bitwise 1000/1000"

[[variants]]
id = "B70"
summary = "B70 (on fixed): routing's expert-count atomic adds 0 (IMAD.MOV.U32 R10, RZ, RZ, 0x0 before ATOMS.ADD at sass:0x2af0): every (token, k) of an expert gets slot 0"
