name = "s_selp64"
description = """
64-bit selp (b64 / u64 / s64, register and immediate operands) keeps all 64 bits. The expected
bytes are GB300's output (ptxv hw), also derived by hand."""
ptx = "kernel.ptx"
entry = "s_selp64"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u64"
shape = [96]
init = "zeros"
expect = "data/expect_out.bin"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
