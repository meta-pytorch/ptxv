name = "e_ring"
description = """
Fixture for C-RING (E-WELLSYNC): a single-producer single-consumer ring buffer (N = 6 items
through CAP = 4 slots) with monotone head and tail counters, on one GPU. The consumer chunks
its work by the tail values it observes, so its events depend on the schedule; the
certificate decides every chunking. See kernel.ptx."""
ptx = "kernel.ptx"
entry = "e_ring"
grid = [2, 1, 1]
block = [1, 1, 1]
outputs = ["out"]

[[buffers]]
name = "src"
dtype = "u32"
shape = [6]
init = "iota"

[[buffers]]
name = "buf"
dtype = "u32"
shape = [4]
init = "zeros"

[[buffers]]
name = "head"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "tail"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "out"
dtype = "u32"
shape = [8]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "buf"

[[params]]
kind = "ptr"
buffer = "head"

[[params]]
kind = "ptr"
buffer = "tail"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "correct ring: payload, then st.release of the tail; reuse after the head release"
expect = ["clean"]

[[variants]]
id = "R1"
summary = "the producer publishes the chunk's tail before writing its payload"
marker = "(head wait slot)"
find = "// (head wait slot)"
replace = "add.u32 %r21, %r3, 2; st.release.gpu.global.u32 [%rd4], %r21;"
expect = ["race"]

[[variants]]
id = "R2"
summary = "the consumer reads one slot past the tail it observed"
marker = "@BOUND"
find = "setp.lt.u32 %p5, %r12, %r11;"
replace = "setp.le.u32 %p5, %r12, %r11;"
expect = ["race"]

[[variants]]
id = "R3"
summary = "the producer reuses slots without waiting for the head release"
marker = "@WAITH"
find = "ld.acquire.gpu.global.u32 %r5, [%rd3];"
replace = "mov.u32 %r5, 6;"
expect = ["nondeterministic", "race"]

[[variants]]
id = "R4"
summary = "a threshold branch on the observed batch size changes the stored value"
marker = "@VALUE"
find = "add.u32 %r15, %r15, 1;"
replace = "sub.u32 %r16, %r11, %r10; setp.le.u32 %p7, %r16, 2; @%p7 bra NOBUMP; add.u32 %r15, %r15, 1; NOBUMP: add.u32 %r15, %r15, 1;"
expect = ["nondeterministic"]

[[variants]]
id = "R5"
summary = "the tail is released at .cta scope: the consumer CTA's acquire does not synchronize with it"
marker = "@PUBLISH"
find = "st.release.gpu.global.u32"
replace = "st.release.cta.global.u32"
expect = ["race"]

[[variants]]
id = "R6"
summary = "the tail store is relaxed: it releases nothing"
marker = "@PUBLISH"
find = "st.release.gpu.global.u32"
replace = "st.relaxed.gpu.global.u32"
expect = ["race"]

[[variants]]
id = "R7"
summary = "the consumer stores how many batches it took (an implicit flow of the chunking)"
marker = "@COUNT"
find = "// (batch count slot)"
replace = "st.global.u32 [%rd5+28], %r20;"
expect = ["nondeterministic"]
