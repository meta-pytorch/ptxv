[[variants]]
id = "good"
summary = "as captured"
expect = ["contract"]
hw_note = "E-BULK-EXIT only: DeepEP dispatch's bulk store may still read shared memory at CTA exit (GB300 drains it)."

# Rung 4b's DeepEP mutants on this instance (same SASS offsets: the same DeepEP build).

[[variants]]
id = "B33"
summary = "dispatch sender: the release fence before the channel tail store is NOPed (st.relaxed tail), so the peer can see the new tail before the token data"
patch = [{ at = "@0x3830", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode8dispatchILi2ELi768ELi8192EEEvP4int4PfPiPlS4_S5_S5_PKS2_PKfPKlSA_PKbPKiiiiiiiiiPPviii" }]
expect = ["race"]

[[variants]]
id = "B34"
summary = "buffer reuse without a barrier: cached_notify_combine skips both of its barrier_blocks (each vote's exit branch is made unconditional)"
patch = [
    { at = "@0x0470", bits = [[12, 4, 7]], expect = "BRA `(.L_x_122)", kernel = "_ZN7deep_ep9intranode21cached_notify_combineILi2EEEvPPvPiiiiPS4_i" },
    { at = "@0x0e00", bits = [[12, 4, 7]], expect = "BRA `(.L_x_137)", kernel = "_ZN7deep_ep9intranode21cached_notify_combineILi2EEEvPPvPiiiiPS4_i" },
]
expect = ["deadlock", "race"]

[[variants]]
id = "B35"
summary = "dispatch sender never publishes its channel tail (the tail store is NOPed): the receiver waits for tokens forever"
patch = [{ at = "@0x3860", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode8dispatchILi2ELi768ELi8192EEEvP4int4PfPiPlS4_S5_S5_PKS2_PKfPKlSA_PKbPKiiiiiiiiiPPviii" }]
expect = ["deadlock"]

[[variants]]
id = "B36"
summary = "notify_dispatch's opening barrier loses a signal (the first ATOM.ADD to the peer's barrier slot is NOPed): the peer's barrier_block never completes"
patch = [{ at = "@0x0180", nop = true, expect = "NOP", kernel = "_ZN7deep_ep9intranode15notify_dispatchILi2EEEvPKiPiS3_S4_iiiPKbS4_S4_iiPPvPS4_i" }]
expect = ["deadlock"]

[[variants]]
id = "B37"
summary = "stream order: combine (launch 7) is ordered only after its rank's dispatch (launch 4), not after cached_notify_combine, which still clears the buffer combine uses"
after = [[7, 4]]
expect = ["race"]

