# model those are races (docs/rung4.md, T4b), and so is the reuse of a ring slot (T4c). These
# opt-ins state the hardware guarantees the verdict relies on (ASSUMPTIONS.md E-POLL-ACQ,
# E-SMEM-CUMUL, E-READ-DONE).
