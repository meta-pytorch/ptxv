find = "add.u32         %r14, %r6, %r13;"
replace = "mov.u32         %r14, %r7;"

[[variants.edits]]
marker = "@CEMP"
find = "add.u32         %r14, %r6, %r13;"
replace = "mov.u32         %r14, %r7;"

[[variants.edits]]
