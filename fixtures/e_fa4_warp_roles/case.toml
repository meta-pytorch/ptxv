name = "e_fa4_warp_roles"
# The reporters' case (2026-11-05), written for GB200 (arch
# sm_100a there); run here on the default sm_103a.
description = """
An FA4 forward bug (flash_fwd_sm100.py): compute-sanitizer synccheck reported divergent aligned
named barriers. Pre-fix, the TmemPtr barrier (bar.sync from tmem.wait_for_alloc() in the MMA,
softmax and correction branches; bar.arrive at the end of softmax/correction; bar.sync before
tmem.free in MMA) and the SoftmaxStatsW0+stage*4+w barrier (bar.arrive in softmax, bar.sync in
correction, 64 threads) are aligned barriers reached from different pcs. The fix moves both
handoffs to mbarriers: pipeline_tmem_sync (one stage, every TMEM user arrives, waits parity 0;
MMA waits parity 1 before free) and pipeline_sm_stats with sp_stage*4 stages of one warp each.
1 CTA, 2 softmax + 2 correction + 1 MMA warp, 2 stats rounds per pair."""
ptx = "kernel.ptx"
entry = "d117107863"
grid = [1, 1, 1]
block = [160, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [192]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "post-fix: TMEM lifetime and softmax-stats handoffs through mbarriers (pipeline_tmem_sync; per-(slot*4+warp) full/empty)"
expect = ["clean"]

[[variants]]
id = "prefix"
summary = "pre-fix: TmemPtr bar.sync/bar.arrive 1,160 from the MMA, softmax and correction branches; stats bar.arrive (softmax) / bar.sync (correction) id 2+w,64; one stage-indexed empty mbarrier (count 64)"
marker = "@STMA"
find = "mbarrier.arrive.shared::cta.b64 _, [%r4];"
replace = "bar.sync 1, 160;"
expect = ["clean"]
hw_note = "PTX-level: aligned bar.sync/bar.arrive of one id reached from different pcs by different warps (compute-sanitizer synccheck error). GB200 completes; ptxv models the per-warp rule only (E-ALIGNED), so clean"

[[variants.edits]]
marker = "@CTMA"
find = "mbarrier.arrive.shared::cta.b64 _, [%r4];"
replace = "bar.sync 1, 160;"

[[variants.edits]]
marker = "@MTMA"
find = "mbarrier.arrive.shared::cta.b64 _, [%r4];"
replace = "bar.sync 1, 160;"

[[variants.edits]]
marker = "@MTMB"
find = "mbarrier.arrive.shared::cta.b64 _, [%r4];"
replace = "bar.sync 1, 160;"

[[variants.edits]]
marker = "@XSTMW"
replace = "<delete>"

[[variants.edits]]
marker = "@XCTMW"
replace = "<delete>"

[[variants.edits]]
marker = "@XMTMW0"
replace = "<delete>"

[[variants.edits]]
marker = "@XMTMW1"
replace = "<delete>"

[[variants.edits]]
marker = "@STMB"
find = "mbarrier.arrive.shared::cta.b64 _, [%r4];"
replace = "bar.arrive 1, 160;"

[[variants.edits]]
