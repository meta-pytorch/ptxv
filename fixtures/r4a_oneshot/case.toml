[[variants]]
id = "good"
summary = "as captured; clean under exit_fence = sys (E-EXIT-FENCE). Under the strict PTX model the closing barrier's wait has no acquire, and call 2's restaging races with a peer's call-1 reads (docs/rung4.md)"
expect = ["clean"]
hw_note = "GB300 (GPUs 0,1,3): bitwise = simulator on every rank, 1000/1000 (2026-11-03)"

[[variants]]
id = "B57"
summary = "the start barrier's release fence is MEMBAR.ALL.GPU instead of .SYS: a peer on another GPU reads the staged input without synchronizing with it"
patch = [{ at = "@0x0490", bits = [[76, 1, 0]], expect = "MEMBAR.ALL.GPU" }]
expect = ["race"]
hw_note = "GB300: correct 1000/1000 (latent, like B19)"

[[variants]]
id = "B58"
summary = "relaxed start signal: no release fence before the put, so the copy of the input into the symmetric buffer is not published by the signal"
patch = [{ at = "@0x0490", nop = true, expect = "NOP" }]
expect = ["race"]
hw_note = "GB300: correct 1000/1000 (latent)"

[[variants]]
id = "B59"
summary = "the start barrier's wait has no acquire (CCTL.IVALL dropped): peers' buffers are read without synchronizing with their signals"
patch = [{ at = "@0x05c0", nop = true, expect = "NOP" }]
expect = ["race"]
hw_note = "GB300: correct 1000/1000 (latent)"

[[variants]]
id = "B60"
summary = "no closing barrier (`@P0 EXIT` made unconditional): call 2 restages the symmetric buffer while peers may still read it for call 1"
patch = [{ at = "@0x1350", bits = [[12, 4, 7]], expect = "EXIT" }]
expect = ["divergent", "nondeterministic", "race"]
hw_note = "GB300: correct 1000/1000: needs rank skew (a peer still reducing call 1 when this rank restages), which back-to-back launches do not produce"

[[variants]]
id = "B61"
summary = "lost signal: the closing barrier's put swaps in 0 instead of 1, so the peer's wait never sees it"
patch = [{ at = "@0x13c0", bits = [[32, 32, 0]], expect = "IMAD.MOV.U32 R9, RZ, RZ, 0x0" }]
expect = ["deadlock"]
hw_note = "GB300: hangs, killed by the watchdog (every run)"
