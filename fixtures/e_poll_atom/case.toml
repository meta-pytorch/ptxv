name = "e_poll_atom"
description = """
C-POLL-ATOM (E-WELLSYNC): a poll on an arrival counter of atomic adds (red.release.add from
three CTAs), exiting at the full count. The certificate accepts it (only all three adds give
3); exiting on a partial count (ge1) is refused and races."""
ptx = "kernel.ptx"
entry = "e_poll_atom"
grid = [3, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "data"
dtype = "u32"
shape = [3]
init = "zeros"

[[buffers]]
name = "cnt"
dtype = "u32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "data"

[[params]]
kind = "ptr"
buffer = "cnt"

[[variants]]
id = "good"
summary = "poll until the count is 3 (every add landed)"
expect = ["clean"]

[[variants]]
id = "reset"
summary = "the poller resets the counter after its exit: ordered after the adds by coherence"
marker = "@RESET"
find = "mov.u32 %r9, 0;"
replace = "st.relaxed.gpu.global.u32 [%rd3], 0;"
expect = ["clean"]

[[variants]]
id = "ge1"
summary = "poll until the count is nonzero, then write data[2]: exits on a partial count, write-write race (deterministic outputs)"
marker = "@COND"
find = "setp.ne.u32 %p3, %r5, 3;"
replace = "setp.eq.u32 %p3, %r5, 0;"
edits = [{ marker = "@USE", find = "ld.global.u32 %r8, [%rd2+8];", replace = "mov.u32 %r8, 0; st.global.u32 [%rd2+8], %r8;" }]
expect = ["race"]

[[variants]]
id = "own2"
summary = "CTA 2 polls after its own add until the count is 2: exits on its add and one other, races on data (the base of the partial counts must include the poller's own add)"
marker = "@POLLER"
find = "setp.ne.u32 %p2, %r2, 0;"
replace = "setp.ne.u32 %p2, %r2, 2;"
edits = [{ marker = "@COND", find = "setp.ne.u32 %p3, %r5, 3;", replace = "setp.lt.u32 %p3, %r5, 2;" }, { marker = "@USE", find = "ld.global.u32 %r8, [%rd2+8];", replace = "ld.global.u32 %r8, [%rd2+4];" }]
expect = ["race"]

[[variants]]
id = "own3"
summary = "CTA 2 polls after its own add until the count is 3 (every add landed)"
marker = "@POLLER"
find = "setp.ne.u32 %p2, %r2, 0;"
replace = "setp.ne.u32 %p2, %r2, 2;"
edits = [{ marker = "@USE", find = "ld.global.u32 %r8, [%rd2+8];", replace = "ld.global.u32 %r8, [%rd2+4];" }]
expect = ["clean"]
