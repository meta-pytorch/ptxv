name = "r2_cublas_gemm"
vendor = "cuBLAS (nvjet)"
library = "torch 2.12.0a0+git808dd93, CUDA 13.0"
files = ["kernel.cubin"]
kind = "dir"
cmd = "$PY capture.py 512 128 128"

