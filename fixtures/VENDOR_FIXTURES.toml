# Fixtures whose kernels are third-party (vendor) code: cuBLAS / cuBLASLt (nvjet, gemmSN,
# cutlass3x sgemm), CUTLASS (CuTeDSL examples, libtorch's grouped GEMM and mem-efficient
# attention), TRT-LLM-gen (flashinfer), DeepEP and FlashAttention. Their kernel binaries
# (`files`) are not part of the open-source export; case.toml, inputs and expected outputs are.
# Tests that need a missing file skip with a message (ptxv_case::skip_missing_vendor_files).
#
# Regenerate on a Blackwell (sm_100a / sm_103a) machine with the library installed:
#   python3 tools/regen_fixture.py <name> [<name> ...]     # or --all
# Each entry's `cmd` runs in a scratch directory and must leave `files` in it ("capture":
# repo root as cwd, $OUT = scratch dir; "dir": cwd = a scratch copy of the fixture directory
# next to links to probes/ and tools/). With `slim = true` each cubin is then shrunk to the
# kernels case.toml launches (tools/cubin_slim.py). Kernel choice depends on the library
# version: other versions may pick other kernels, and the case's expectations may then differ.
#
# Library versions the checked-in cases were captured with:
#   torch   2.12.0a0+git808dd93, CUDA 13.0 (cuBLAS / cuBLASLt, libtorch_cuda's CUTLASS and
#           FlashAttention kernels)
#   CUTLASS 4.6.1 CuTeDSL (the copy bundled with flashinfer 0.5.3)
#   flashinfer 0.5.3 with flashinfer-cubin (trtllm-gen kernels)
#   DeepEP  1.2.1.2026.6.4.43822+567632d (upstream 567632d), torch as above
#   flash_attn.cute 4.0.0b24 (FlashAttention-4), torch as above

