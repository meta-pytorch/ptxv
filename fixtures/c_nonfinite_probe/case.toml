name = "c_nonfinite_probe"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of nf_probe.py (kernel ^nf_probe_kernel$). 1 launch(es),
PTX from the JIT (kernel.ptx; its own cubin kept as jit.cubin):
  0: nf_probe_kernel grid [4, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton fixtures/c_nonfinite_probe/nf_probe.py:nf_probe_kernel --out fixtures/c_nonfinite_probe"""
ptx = "kernel.ptx"
entry = "nf_probe_kernel"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out0", "out1", "out2", "out3"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [512]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "out0"
dtype = "e4m3"
shape = [512]
init = "zeros"
expect = "expected/out0.bin"

[[buffers]]
name = "out1"
dtype = "e5m2"
shape = [512]
init = "zeros"
expect = "expected/out1.bin"

[[buffers]]
name = "out2"
dtype = "f32"
shape = [512]
init = "zeros"
expect = "expected/out2.bin"

[[buffers]]
name = "out3"
dtype = "f32"
shape = [512]
init = "zeros"
expect = "expected/out3.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out0"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out1"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out2"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out3"
byte_offset = 0

[[params]]
kind = "u32"
value = 512

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
# The byte stores of the e4m3x2 / e5m2x2 conversions store the defined lane only: clean on
# both fronts (the PTX front was undef-insensitive before per-byte stores of virtual
# registers, 2026-11-08).
expect = ["clean"]
