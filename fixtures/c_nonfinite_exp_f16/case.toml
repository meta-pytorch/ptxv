name = "c_nonfinite_exp_f16"
description = """
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of nf_exp_f16.py (kernel ^nf_exp_f16_kernel$). 1 launch(es),
PTX from the JIT (kernel.ptx; its own cubin kept as jit.cubin):
  0: nf_exp_f16_kernel grid [4, 1, 1] block [128, 1, 1]
Regenerate: CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --triton fixtures/c_nonfinite_exp_f16/nf_exp_f16.py:nf_exp_f16_kernel --out fixtures/c_nonfinite_exp_f16"""
ptx = "kernel.ptx"
entry = "nf_exp_f16_kernel"
grid = [4, 1, 1]
block = [128, 1, 1]
dynamic_smem = 0
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f16"
shape = [1024]
init = "file"
file = "data/x.bin"

[[buffers]]
name = "out"
dtype = "f16"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "x"
byte_offset = 0

[[params]]
kind = "ptr"
buffer = "out"
byte_offset = 0

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[params]]
kind = "bytes"
hex = "0000000000000000"

[[variants]]
id = "good"
summary = "as captured"
expect = ["clean"]
