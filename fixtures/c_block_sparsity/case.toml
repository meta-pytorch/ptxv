name = "c_block_sparsity"
description = """
A block-sparsity bug (reduction buffer reused too early), the reporters' real captured
CuTeDSL kernel (1 CTA, 2 n_blocks, sliding-window
mask). good = the fix (second sync_threads after warp 0 reads reduction_buffer), prefix =
pre-fix. Its PTX needs mad.lo.s64 and vote.sync.any.pred. expected/ is the fixed kernel's GPU
output.
Captured by tools/capture.py (torch 2.12.0a0+git808dd93): run() of run.py. 1 launch(es),
PTX from the JIT (kernel.ptx):
  0: kernel_cutlass_kernel_opskernelscuteexternmslk_flash_attncompute_block_sparsityBlockSparsityKernel_object_at__ grid [1, 1, 1] block [64, 1, 1]
Regenerate: BS_MASK=sliding CUDA_VISIBLE_DEVICES=<gpu> $PTXV_PYTHON tools/capture.py --file <reporters' run.py> --kernels BlockSparsity --out <dir> (run.py and the kernel source are not part of this repo)"""
arch = "sm_103a"
ptx = "kernel.ptx"
entry = "kernel_cutlass_kernel_opskernelscuteexternmslk_flash_attncompute_block_sparsityBlockSparsityKernel_object_at__BlockSparseTensorsmask_block_cnttensorptri32gmemoi64i641mask_block_idxtensorp_0"
