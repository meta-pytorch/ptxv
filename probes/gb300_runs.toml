# GB300 runs of the probes whose expected/ outputs are GB200's (sm_100a builds). Evidence
# class: GB300 hardware (sm_103a), kept apart from the GB200 records it is compared with.
# Each probe's PTX built with ptxas 13.0 -arch=sm_103a, run with `ptxv hw-worker <probe>
# <cubin> --runs 3 --dump` on one GB300 (driver 580.126.20), 2026-11-09; every run gave the same
# output. `bytes` / `fnv1a64`: the dumped outputs (the case's outputs concatenated in order).
# Every one equals the GB200 expected output bit for bit (test
# gb300_runs_equal_gb200_probe_records in crates/sim/tests/fixtures.rs).

