name = "cpasync_proxy_pipe152"
description = """
E-CPASYNC-PROXY probe in rung 1b's pipeline (../pipe/kernel.ptx), grid 152: the
epilogue fills the staging tile with st.shared (rung 1b) or cp.async from `src`, then
bar.sync 1, 128 and thread 64's TMA store (or bulk store, `_b` variants; `_nobar`: no bar.sync
after the mbarrier wait). Variants: writer x fence.proxy.async placement (none / before the
wait / after the wait). st_none is rung 1b's
B04 (fails on GB300). Every CTA computes the same GEMM tile pair and writes rows
ctaid * 256 + [0, 256) of D; cp.async variants copy the same rows of src. Run
`PTXV_HW_EXPECT=variant ptxv hw probes/cpasync_proxy/pipe152 --scrub --runs 1000`
(each variant against its own simulator run). The expects are the model's verdicts; the
cpm_* variants (128 copy-completion arrivals per phase) need more than 200000 states for a
complete `ptxv check`."""
ptx = "../pipe/kernel.ptx"
entry = "r1b_pipeline"
grid = [152, 1, 1]
block = [192, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "bf16"
shape = [256, 128]
init = "normal"
seed = 21

[[buffers]]
name = "B"
dtype = "bf16"
shape = [16, 128]
init = "normal"
seed = 22

[[buffers]]
name = "D"
dtype = "f32"
shape = [38912, 16]
init = "nan"

[[buffers]]
name = "src"
dtype = "f32"
shape = [38912, 16]
init = "normal"
seed = 24

[[params]]
kind = "tensormap"
buffer = "A"
box = [64, 128]
swizzle = "128B"

[[params]]
kind = "tensormap"
buffer = "B"
box = [64, 16]
swizzle = "128B"

[[params]]
kind = "tensormap"
buffer = "D"
box = [16, 128]

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "D"

[[variants]]
id = "good"
summary = "st.shared writers (rung 1b); fence.proxy.async.shared::cta after the stores (rung 1b good); TMA store"
expect = ["clean"]

[[variants]]
id = "st_none"
summary = "st.shared writers (rung 1b); no fence.proxy.async; TMA store"
expect = ["race"]
edits = [
    { marker = "@FENCE", replace = "<delete>" },
]

[[variants]]
id = "cpw_none"
summary = "cp.async.cg (4 x 16 B per thread), cp.async.wait_group 0; no fence.proxy.async; TMA store"
expect = ["contract"]
edits = [
    { marker = "@ST", replace = "<delete>" },
    { marker = "@CPI", find = "// CP_ISSUE", replace = "cp.async.cg.shared.global [%r38], [%rd22], 16; cp.async.cg.shared.global [%r38+16], [%rd22+16], 16; cp.async.cg.shared.global [%r38+32], [%rd22+32], 16; cp.async.cg.shared.global [%r38+48], [%rd22+48], 16; cp.async.commit_group;" },
    { marker = "@CPW", find = "// CP_WAIT", replace = "cp.async.wait_group 0;" },
    { marker = "@FENCE", replace = "<delete>" },
]

[[variants]]
id = "cpw_before"
summary = "cp.async.cg (4 x 16 B per thread), cp.async.wait_group 0; fence.proxy.async.shared::cta before the wait; TMA store"
expect = ["contract"]
edits = [
    { marker = "@ST", replace = "<delete>" },
    { marker = "@CPI", find = "// CP_ISSUE", replace = "cp.async.cg.shared.global [%r38], [%rd22], 16; cp.async.cg.shared.global [%r38+16], [%rd22+16], 16; cp.async.cg.shared.global [%r38+32], [%rd22+32], 16; cp.async.cg.shared.global [%r38+48], [%rd22+48], 16; cp.async.commit_group;" },
    { marker = "@CPW", find = "// CP_WAIT", replace = "cp.async.wait_group 0;" },
    { marker = "@FENCE", replace = "<delete>" },
    { marker = "@FB", find = "// FENCE_BEFORE", replace = "fence.proxy.async.shared::cta;" },
]

[[variants]]
