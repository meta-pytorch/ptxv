name = "probe_f64_misc"
description = """
Probe (L-ROSETTA) for min.f64, max.f64, neg.f64 and abs.f64 on all pairs of f64 specials
(signed zeros, infinities, quiet / signaling / negative NaNs, subnormals) and random values
(kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a
kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "f64_misc"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
