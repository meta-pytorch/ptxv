# Generated by gen.py (python3 gen.py sat > ../i2f8_lat_sat/case.toml); see gen.py for the window.
name = "probe_i2f8_lat_sat"
description = """
Probe (L-OPCLASS): the result latency of an I2F.S8 with no write scoreboard under a saturated
conversion pipe. Grid 304 x 1024 threads (full occupancy: 64 warps per SM). The odd warps of
every CTA (the saturating pool) run 32 rounds of 16 independent I2F.S16 / I2F.S8; the even
warps (the probe pool) spin 256 dependent IMADs, then run probes/i2f8_lat's window (gen.py
sat): the I2F.S8 (no write scoreboard), K I2F.S16 followers (SB3), NOP padding, the FMUL reading
the I2F.S8's result D stall cycles after it. NOWAIT: the FMUL waits on nothing; COVER: on the
followers' SB3; OWN: on the I2F.S8's own SB2 (reference). clk (not compared) holds each warp's
SM id and clocks (the overlap check in results.txt). Variants compute something else than good:
PTXV_HW_EXPECT=variant. GB300 counts in results.txt."""
ptx = "kernel.ptx"
entry = "i2f8s"
grid = [304, 1, 1]
block = [1024, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [4980736]
init = "zeros"

[[buffers]]
name = "clk"
dtype = "u32"
shape = [38912]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "u32"
value = 2654435761

[[params]]
kind = "u32"
value = 1065353216   # scale = 1.0f

[[params]]
kind = "u32"
value = 32   # iters: the saturating pool's rounds

[[params]]
kind = "u32"
value = 256   # delay: the probe pool's IMADs before the window

[[params]]
kind = "ptr"
buffer = "clk"

[[variants]]
id = "good"
expect = ["clean"]

