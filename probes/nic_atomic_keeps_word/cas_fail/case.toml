name = "r6n_cas_fail"
description = """
MISS 257 repro (cas_fail, a NIC compare-and-swap that fails: compare 0xdeadbeefdeadbeef, swap 0x1234): thread 0 writes dst[i] = src[i] = rn(A_i + B_i) (constants: (0.1, 0.2), (1, 1e-8), (3, 0.1), (1e8, 1)), src[4..6) = dst[0..2), src2 = (dst[2], dst[3], dst[0], dst[1]); slot 0: write into dst2 (key 0x202) or within src; slot 1: NIC atomic cas_fail on dst's first 8-byte word, the fetched value to sink; polls CQE 1; out[0..4) = dst, out[4..10) = dst2, out[10..12) = sink, out[12..18) = src."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "r6n_cas_fail"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out", "dst", "dst2", "src", "src2", "sq", "cq", "uar", "dbr", "sink"]

[[nic_qps]]
name = "qp0"
device = 0
peer = 0
qpn = 0x42
sq = "sq"
sq_wqes = 2
cq = "cq"
cq_cqes = 2
db = "uar"

[[nic_mrs]]
key = 0x100
buffer = "src"

[[nic_mrs]]
key = 0x101
buffer = "sink"

[[nic_mrs]]
key = 0x200
buffer = "dst"

[[nic_mrs]]
key = 0x202
buffer = "dst2"

[[nic_mrs]]
key = 0x103
buffer = "src2"

