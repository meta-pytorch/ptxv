name = "r5e_c1_ref_stasyncw_plus1"
description = """
(explicit 1-CTA cluster launch) equiv probe (MISS 205): S[t] = x by st.shared; st.async bits(w) into S[t]; out = S[t] (w; equal to x where w = x). Input: x = 1.5 + (t + 1)/128, w = x + 1."""
ptxas_toolkit = "13.0"
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "r5e_c1_ref_stasyncw_plus1"
grid = [1, 1, 1]
cluster = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [32]
init = "file"
file = "../data_plus1/x.bin"

[[buffers]]
name = "w"
dtype = "f32"
shape = [32]
init = "file"
file = "../data_plus1/w.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [32]
init = "zeros"

[[buffers]]
name = "z"
dtype = "u32"
shape = [128]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "w"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "z"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
