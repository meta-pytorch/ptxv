name = "probe_movm"
description = """
Probe (L-ROSETTA) for movmatrix.sync.aligned.m8n8.trans.b16 (SASS MOVM.16.MT88): per warp, two
transposes in a row and one after a per-lane change, on lane-coded and random halves
(kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "movm"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
