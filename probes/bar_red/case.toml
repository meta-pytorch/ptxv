name = "probe_bar_red"
description = """
Probe (E-BAR-RED) for bar.red.{popc.u32, and.pred, or.pred} (SASS BAR.RED.{POPC,AND,OR} +
B2R.RESULT): CTA-wide on barriers 0-2, negated sources, and counted barriers 3-4 reached by
warps 0-1 only (kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin,
`ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "bar_red"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
