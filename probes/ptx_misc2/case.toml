name = "probe_ptx_misc2"
description = """
Probe (L-ROSETTA) for abs.s64, brev.b32 and rcp.{rn,rz,rm,rp}.f64 on edge and random inputs
(kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "ptx_misc2"
grid = [1, 1, 1]
block = [1024, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [2048]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [12288]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
