name = "probe_bf16_norn"
description = """
Probe (L-ROSETTA) for bf16 add / sub / mul (.bf16x2 and .bf16) with no rounding modifier where
ptxas cannot contract (operands are loads; the muls are only stored, directly or packed), on random bits,
specials and near-1 normals (kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin,
`ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "bf16_norn"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [512]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
