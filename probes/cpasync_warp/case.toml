name = "probe_cpasync_warp"
description = """
Probe (E-CPASYNC) for the cp.async scoreboard's scope: odd and even lanes issue cp.async +
commit on two divergent paths (two LDGDEPBAR on the warp's SB0, one group per thread), the warp
reconverges at one DEPBAR, bar.warp.sync, and each lane reads its neighbour's shared slot
(kernel.ptx, gen.py). `good`: wait_group 0; `w1`: wait_group 1 (SASS `DEPBAR.LE SB0, 0x1`): per thread nothing is
waited for (exit with copies pending: contract, E-CPASYNC-EXIT; the neighbour's read races
with its copy); on the SASS front the warp's first group is complete and the second is not.
expected/ is GB300's output of `good` (ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "cpasync_warp"
grid = [2, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u8"
shape = [262144]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u8"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "w1"
summary = "wait_group 1 after the two divergent groups"
marker = "@WAIT"
find = "wait_group 0;"
replace = "wait_group 1;"
expect = ["contract", "race"]
expect_sass = ["contract", "nondeterministic", "race"]
hw_note = "GB300 1000/1000 scrubbed runs equal `good`'s output (the later group landed in time)"
