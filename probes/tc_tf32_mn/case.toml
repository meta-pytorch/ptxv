name = "probe_tc_tf32_mn"
description = """
Probe (N-MMA, S-TMA) for tcgen05.mma.kind::tf32 with MN-major A or B through smem descriptor
layout 1 (SWIZZLE_128B_BASE32B): a host-built shared-memory image (gen.py), two MMAs, the
TMEM result dumped (kernel.ptx). expected/ is GB300's output (kernel.cubin = ptxas
-arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "tc_tf32_mn"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "img"
dtype = "u32"
shape = [4608]
init = "file"
file = "img.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [4096]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "img"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
