name = "probe_sttm_ldtm"
description = """
Probe (L-OPREAD) on GB300: a TMEM load that overwrites the source registers of the TMEM store
just before it, with no wait (ptxas: `STTM.x16 tmem[UR6], R20` with no read scoreboard, then
`LDTM.x16 R20, tmem[UR7+0x10]`; CUTLASS fmha_fwd, FA4 hd256). Each thread stores x ^ 0x5a5a5a5a
to column 16, x to column 0, loads column 16 into the same registers, then reads column 0
back; out = (column 0, column 16) per thread. The TMEM queue reads the store's registers
before the load writes them (kernel.ptx, gen.py). expected/ is GB300's output."""
ptx = "kernel.ptx"
entry = "sttm_ldtm"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [128, 32]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [128, 32]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
