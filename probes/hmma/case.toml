name = "hmma"
description = """
N-HMMA probe: D[128x128] f32 = A[128x64] bf16 * B[128x64]^T through mma.sync m16n8k16
(SASS HMMA.16816.F32.BF16), one warp per 16x8 tile, 4 accumulating steps (hmma.cu).
`ptxv calib-mma probes/hmma` scores the MmaModel family against GB300 with the calibration
input sets; the default inputs (normal) are compared with expected/ (GB300) in cargo test."""
ptx = "kernel.ptx"
cubin = "kernel.cubin"
entry = "hmma"
grid = [32, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "bf16"
shape = [128, 64]
init = "normal"
seed = 21

[[buffers]]
name = "B"
dtype = "bf16"
shape = [128, 64]
init = "normal"
seed = 22

[[buffers]]
name = "D"
dtype = "f32"
shape = [128, 128]
init = "nan"
expect = "expected/D.bin"

[[params]]
kind = "ptr"
buffer = "A"

[[params]]
kind = "ptr"
buffer = "B"

[[params]]
kind = "ptr"
buffer = "D"

[[variants]]
id = "good"
expect = ["clean"]
