name = "probe_memhints"
description = """
Probe (L-ROSETTA) for the cache-hint and scope tokens of the DeepEP hybrid / DeepCP kernels:
LDG.E.NA[.U8|.64].STRONG.SYS, LDG.E.NA, LDG.E.NA.128.CONSTANT (.L1::no_allocate), LD.E[.64|.128]
.STRONG.{SM,GPU,SYS}, generic ATOM.E.{MAX,CAS,ADD}[.64].STRONG.{SM,GPU,SYS}, ST.E.STRONG.{SM,
GPU,SYS}, ST.E.EF.128 (.L1::evict_first), STG.E.64.MMIO.SYS (st.mmio.relaxed.sys) and UBLKPF.L2
(cp.async.bulk.prefetch.L2). Each thread reads its own 128-byte row of in and writes its own
row of out (kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin,
`ptxv hw-worker probes/memhints <cubin> --runs 1 --dump`)."""
ptx = "kernel.ptx"
entry = "memhints"
grid = [4, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256, 32]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [256, 32]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
