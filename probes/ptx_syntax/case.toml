name = "probe_ptx_syntax"
description = """
Probe (L-ROSETTA) for PTX syntax forms: %lanemask_{lt,le,ge,gt,eq}, an inline-asm scope register
declared without `%`, a `[%rd+-N]` address, a vector operand list continued on a new line after
a comma, and a branch to a label past it (kernel.ptx, gen.py). expected/ is GB300's output
(ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "ptx_syntax"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
