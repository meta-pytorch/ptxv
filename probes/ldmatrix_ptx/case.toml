name = "probe_ldmatrix_ptx"
description = """
Probe (L-ROSETTA) for PTX ldmatrix on GB300: m8n8.x4, .x4.trans, .x1 and .x2.trans (with
non-consecutive destination registers) .shared.b16 from a 32 x 32 b16 tile whose element
(r, c) is r << 8 | c (kernel.ptx, gen.py). expected/ is GB300's output."""
ptx = "kernel.ptx"
entry = "ldm"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [32, 16]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [32, 12]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
