name = "probe_f32x2_unpack"
description = """
Probe (L-ROSETTA, PTX-FMAD) for mul.f32x2 with no rounding modifier whose product ptxas keeps
apart from its readers: halves unpacked into scalar add / sub / neg / fma addend, the product
as an fma.rn.f32x2 addend, and a half repacked into the other lane of a vector an add.f32x2
reads (kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a
kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "f32x2_unpack"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
