name = "same_value"
description = """
S-SAME-VALUE probe: lane 0 of each of the 4 warps of each of 2 CTAs stores v to one shared
word and to one global word, unordered. `good`: every store writes v (GB300: out = v
everywhere); `differ`: warp w stores v + w, a race."""
ptx = "kernel.ptx"
entry = "k"
grid = [2, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [3]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "u32"
value = 1234567

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "differ"
marker = "@DIFFER"
find = "%r1, 0;"
replace = "%r1, %r4;"
expect = ["nondeterministic", "race"]
