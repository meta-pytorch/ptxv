name = "probe_rsqrt_f64"
description = """
Probe (N-MUFU) for rsqrt.approx.f64 without .ftz (ptxas: MUFU.RSQ64H, a DFMA refinement, a
slow path for zero / Inf / NaN / negative / subnormal inputs) on 4096 inputs (kernel.ptx,
gen.py). expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a kernel.ptx,
`ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "rsqrt_f64"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u64"
shape = [4096]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u64"
shape = [4096]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
