name = "probe_f16_arith"
description = """
Probe (L-ROSETTA) for f16 arithmetic on GB300: fma / mul / add / sub .rn.f16x2, fma.rn.f16 on
packed halves (HFMA2 / HMUL2 / HADD2 with .H0_H0 / .H1_H1 and immediate-pair operands) and
mul.f16 by 32768 that ptxas cannot contract (HMUL2 R, R.H1_H1, 32768, 32768), over the f16
classes (gen.py). expected/ is GB300's output (ptxas cubin,
`ptxv hw-worker probes/f16_arith <cubin> --runs 1 --dump`)."""
ptx = "kernel.ptx"
entry = "f16a"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024, 3]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1024, 8]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
