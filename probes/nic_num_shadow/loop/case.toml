name = "nic_num_shadow_loop"
description = """
MISS 224 repro: the put-with-signal of fixtures/r5a_ibgda_putsig on one GPU over a loopback
queue pair. Thread 0 copies the input c into dst (c[i]: the f32 value x[i] + y[i] rounds to),
writes src[i] = x[i] + y[i], RDMA-writes src into dst, signals sig with a fetch-add, polls the
signal's completion and copies dst to out. Every buffer the run writes is an output. Exact:
out[i] = x[i] + y[i], not representable in f32 for these inputs; out[i] holds its rounding."""
ptx = "kernel.ptx"
entry = "loop"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out", "dst", "src", "sq", "cq", "uar", "dbr", "sink", "sig"]

[[nic_qps]]
name = "qp0"
device = 0
peer = 0
qpn = 0x42
sq = "sq"
sq_wqes = 2
cq = "cq"
cq_cqes = 2
db = "uar"

[[nic_mrs]]
key = 0x100
buffer = "src"

[[nic_mrs]]
key = 0x101
buffer = "sink"

[[nic_mrs]]
key = 0x200
buffer = "dst"

[[nic_mrs]]
key = 0x201
buffer = "sig"

[[buffers]]
name = "x"
dtype = "f32"
shape = [4]
init = "zeros"
values = [[0, 0.1], [1, 1.0], [2, 3.0], [3, 1e8]]

[[buffers]]
name = "y"
dtype = "f32"
shape = [4]
init = "zeros"
values = [[0, 0.2], [1, 1e-8], [2, 0.1], [3, 1.0]]

# c[i]: the f32 value x[i] + y[i] rounds to (0x3e99999a, 0x3f800000, 0x40466666, 0x4cbebc20).
[[buffers]]
name = "c"
dtype = "f32"
shape = [4]
init = "zeros"
values = [[0, 0.30000001192092896], [1, 1.0], [2, 3.0999999046325684], [3, 100000000.0]]

[[buffers]]
name = "src"
dtype = "f32"
shape = [4]
init = "zeros"

[[buffers]]
name = "sq"
dtype = "u8"
shape = [128]
init = "zeros"

# CQEs start owned by the hardware: opcode invalid (0xf), owner bit 1.
[[buffers]]
name = "cq"
dtype = "u8"
shape = [128]
init = "zeros"
values = [[63, 241], [127, 241]]

# The doorbell register (UAR page).
[[buffers]]
name = "uar"
dtype = "u64"
shape = [1]
init = "zeros"

[[buffers]]
name = "dbr"
dtype = "u32"
shape = [1]
init = "zeros"

[[buffers]]
name = "sink"
dtype = "u64"
shape = [1]
init = "zeros"

[[buffers]]
name = "dst"
dtype = "f32"
shape = [4]
init = "zeros"

[[buffers]]
name = "sig"
dtype = "u64"
shape = [1]
init = "zeros"

[[buffers]]
name = "out"
dtype = "f32"
shape = [4]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "src"

[[params]]
kind = "ptr"
buffer = "sq"

[[params]]
kind = "ptr"
buffer = "cq"

[[params]]
kind = "ptr"
buffer = "uar"

[[params]]
kind = "ptr"
buffer = "dbr"

[[params]]
kind = "ptr"
buffer = "sink"

[[params]]
kind = "ptr"
buffer = "dst"

[[params]]
kind = "ptr"
buffer = "sig"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "y"

[[params]]
kind = "ptr"
buffer = "c"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
