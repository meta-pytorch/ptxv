name = "nic_num_shadow_arith"
description = """
MISS 224 repro, the payload of loop/ alone: out[i] = x[i] + y[i] (one rounding), stored directly
(no NIC). GB300's output: expected/arith.out.bin (the bits loop/'s RDMA write carries)."""
ptx = "kernel.ptx"
entry = "arith"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "x"
dtype = "f32"
shape = [4]
init = "zeros"
values = [[0, 0.1], [1, 1.0], [2, 3.0], [3, 1e8]]

[[buffers]]
name = "y"
dtype = "f32"
shape = [4]
init = "zeros"
values = [[0, 0.2], [1, 1e-8], [2, 0.1], [3, 1.0]]

[[buffers]]
name = "out"
dtype = "f32"
shape = [4]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "x"

[[params]]
kind = "ptr"
buffer = "y"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
