name = "probe_sb_mio_order_fixture"
description = """
The windows of probes/sb_mio_order as control-bit / encoding patches of the ptxas cubin of
../kernel.ptx (written by `patch.py <cubin> <dir> fixture/case.toml`), one CTA: the static
scoreboard check (L-SB-ORDER) must accept the windows GB300 runs correctly (a later
memory-pipe read scoreboard covers earlier STS reads) and flag the two that fail on GB300.
rd_on_lds: A covered only by a later LDS's read scoreboard; lds_nowait: its positive control.
Another opcode's cover (rd_on_ldg, rd_on_lds) is a strict sb-hwq: contract (E-HW-SB-QUEUE)."""
ptx = "../kernel.ptx"
entry = "sb_mio_order"
grid = [1, 1, 1]
block = [256, 1, 1]
dynamic_smem = 65536
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1024]
init = "zeros"

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "u32"
value = 3072

