# RVS2 merge precision: LDS (no SB), SHFL (SB1, a gb300-only cover), LDS (SB2, the strict cover),
# reader waits on SB2 only. Strict: clean (LDS by a later LDS). gb300/broad: the first LDS moved
# onto the SHFL's SB1 (first match) and not onto the LDS's SB2: a violation at every level.
[[variants]]
id = "MERGE_FALSEV"
patch = [
    { at = "@0x700", bits = [[0, 64, 0x0000000006067984], [64, 41, 0x800]], stall = 1, wbar = 7, rbar = 7, wait = 0, expect = "LDS R6, [R6]" },
    { at = "@0x710", bits = [[0, 64, 0x0c201f0007077f89], [64, 41, 0xe0000]], stall = 4, wbar = 1, rbar = 7, wait = 0, expect = "SHFL.BFLY PT, R7, R7, 0x1, 0x1f" },
    { at = "@0x720", bits = [[0, 64, 0x00000000020a7984], [64, 41, 0x800]], stall = 4, wbar = 2, rbar = 7, wait = 0, expect = "LDS R10, [R2]" },
    { at = "@0x730", bits = [[0, 64, 0x0000000106087836], [64, 41, 0x0]], stall = 5, wbar = 7, rbar = 7, wait = 4, expect = "VIADD R8, R6, 0x1" },
]
expect = ["clean"]
expect_sass = ["clean"]
