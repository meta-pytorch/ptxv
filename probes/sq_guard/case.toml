    { at = "@0x700", bits = [[0, 64, 0x0000000006067984], [64, 41, 0x800]], stall = 1, wbar = 7, rbar = 7, wait = 0, expect = "LDS R6, [R6]" },
    { at = "@0x710", bits = [[0, 64, 0x00000000020a7984], [64, 41, 0x800]], stall = 4, wbar = 1, rbar = 7, wait = 0, expect = "LDS R10, [R2]" },
    { at = "@0x720", bits = [[0, 64, 0x0000000106087836], [64, 41, 0x0]], stall = 2, wbar = 7, rbar = 7, wait = 2, expect = "VIADD R8, R6, 0x1" },
    { at = "@0x730", bits = [[0, 64, 0x0000000207097836], [64, 41, 0x0]], stall = 5, wbar = 7, rbar = 7, wait = 0, expect = "VIADD R9, R7, 0x2" },
