name = "probe_wide_data"
description = """Probe (MISS 181, the review repro): the data registers of STG.E.ENL2.256 (8) and REDG.E.ADD.F32x4 (4) are read late;
an overwrite of a non-first register right after the store (no wait) changes what is stored.
S256_*: 0x0120 (REDG) replaced by `MOV Rk, 0x7777` (no wait). RED_*: STG.256 a NOP, 0x0130 replaced by
`MOV Rk, 0x7777`. *_REF: the store gets rd=SB5 and the MOV waits on it. GB300 counts in results.txt."""
ptx = "kernel.ptx"
entry = "wide"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out", "acc"]
ptxas_args = ["-maxrregcount", "24"]

[[buffers]]
name = "in"
dtype = "f32"
shape = [2048]
init = "iota"

[[buffers]]
name = "out"
dtype = "u32"
shape = [3072]
init = "zeros"

[[buffers]]
name = "acc"
dtype = "f32"
shape = [1024]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "acc"

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "S256_R5"
expect = ["violation"]
patch = [
  { at = "@0x0120", bits = [[0, 64, 131352985171970], [64, 64, 4470614278541056]], expect = "MOV R5, 0x7777" },
]

[[variants]]
id = "S256_R6"
expect = ["violation"]
patch = [
