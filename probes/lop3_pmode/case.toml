name = "probe_lop3_pmode"
description = """
Probe (L-LOP3-P) for the predicate operand of SASS `LOP3.LUT Pd, RZ, a, b, c, lut, Pq` and
its `.PAND` mode (cuBLAS nvjet NVFP4 2-CTA kernels). Not a plain `ptxv probe`: patch.py rewrites
the ptxas `LOP3.LUT P0, RZ, a, b, RZ, 0x30, !PT` into four forms (`.PAND` / default, with P1 /
!P1, P1 = c >= 0), checked by nvdisasm; run each patched cubin with `ptxv hw-worker
probes/lop3_pmode <patched.cubin> --runs 1 --dump expected/<form>.bin`.
out[i] = P0 + 2 (c < 0)."""
ptx = "kernel.ptx"
entry = "lop3_pmode"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024, 3]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1024]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
