name = "probe_tc_f16"
description = """
Probe (N-MMA) for tcgen05.mma.kind::f16 with f16 A and B (idesc format 0), f32 D:
D[128x64] = A[128x64] * B[64x64]^T in 4 MMAs of K = 16 (kernel.ptx; r1a_tcgen05_tile with f16
operands; inputs from gen.py, normal f16). expected/ is GB300's output; `ptxv calib-mma probes/tc_f16` scores the model family."""
ptx = "kernel.ptx"
entry = "tc_f16"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "f16"
shape = [128, 64]
init = "file"
file = "A.bin"

[[buffers]]
name = "B"
dtype = "f16"
shape = [64, 64]
init = "file"
file = "B.bin"

[[buffers]]
name = "D"
dtype = "f32"
shape = [128, 64]
init = "nan"
expect = "expected/D.bin"

# A[m][k] row-major viewed as 3-D (k%8, m, k/8): box (8, 128, 8) lands in shared memory as
# 8 K-chunks of 128 rows x 16 B (LBO = 2048 B, SBO = 128 B).
[[params]]
kind = "tensormap"
buffer = "A"
box = [8, 128, 8]
dims = [8, 128, 8]
strides = [128, 16]

[[params]]
kind = "tensormap"
buffer = "B"
box = [8, 64, 8]
dims = [8, 64, 8]
strides = [128, 16]

[[params]]
kind = "ptr"
buffer = "D"

[[variants]]
id = "good"
expect = ["clean"]
