name = "probe_bulk_s2s"
description = """
Probe (S-TMA) for cp.async.bulk.shared::cluster.shared::cta.mbarrier::complete_tx::bytes (SASS
UBLKCP.S.S, FA4 backward's dQ hand-off): in a 2-CTA cluster each CTA copies 4 KB of its shared
memory into the peer's (completing on the peer's mbarrier) and 4 KB into its own, then writes
what it received (kernel.ptx). expected/ is GB300's output (ptxas cubin, `ptxv hw-worker
probes/bulk_s2s <cubin> --runs 20 --dump`)."""
ptx = "kernel.ptx"
entry = "bulk_s2s"
grid = [2, 1, 1]
block = [128, 1, 1]
cluster = [2, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [2, 2048]
init = "bits"
seed = 21

[[buffers]]
name = "out"
dtype = "u32"
shape = [2, 2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["contract"]
# SASS strict: E-HW-SB-QUEUE contracts (memory-queue order across opcodes); clean at gb300.
expect_sass = ["contract"]

# MISS 131: the first UBLKCP's read scoreboard removed (and its wait), then UR12 (its
# destination address) rewritten: UBLKCP reads its operands late like the other bulk / TMA ops,
# so the rewrite is a SCOREBOARD WAR (before: unseen, UBLKCP was not an asynchronous reader).
# An edited binary: no hardware claim.
[[variants]]
id = "NORB"
summary = "UBLKCP with no read scoreboard, UR12 rewritten with no wait"
patch = [
    { at = "@0x740", rbar = 7, expect = "UBLKCP.S.S [UR12], [UR9], UR6" },
    { at = "@0x770", wait = 0, expect = "@P0 BRA.U.ANY `(.L_x_6)" },
]
expect = ["contract"]
expect_sass = ["contract", "violation"]
