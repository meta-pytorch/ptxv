name = "probe_fmad_multi"
description = """
Probe (PTX-FMAD) for a plain mul.f32 with several readers (gen.py writes kernel.ptx and
in.bin): every live reader a plain add / sub (directly, through a copy or a neg): contracted
into each; any other live reader (a store, a mul, a compare, add.rn, an fma addend, add p, p,
another .ftz setting, a neg or copy read by such): no contraction; dead readers ignored; an
add of two products folds the one with no other reader (both: the first operand's). In 3 of
4 threads the addends cancel the product to +- 1 ulp. expected/ is GB300's output
(kernel.cubin = ptxas -arch=sm_103a kernel.ptx, `ptxv hw`)."""
ptx = "kernel.ptx"
entry = "fmad_multi"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [2048]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [16384]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
