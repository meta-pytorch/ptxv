name = "rdp2_vip_undef2"
description = "RDP2: E-POLL-ANY and undefined bytes: partial words, sub-word stores, TMA writes, .sys loads"
ptx = "kernel.ptx"
entry = "vip_undef_load"
grid = [1, 1, 1]
block = [96, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [2]
init = "zeros"

[[buffers]]
name = "scr"
dtype = "u32"
shape = [8]
init = "undef"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "scr"

[[variants]]
id = "PART"
summary = "an 8-byte strong load of scr[2..3]: scr[2] written 0, scr[3] never written"
expect = ["violation"]
marker = "@T"
find = "ld.volatile.shared.u32 %r16, [%r4];"
replace = "cvta.to.global.u64 %rd3, %rd2;\n    ld.relaxed.gpu.global.v2.u32 {%r16, %r18}, [%rd3+8];\n    add.u32 %r16, %r16, %r18;"

[[variants]]
id = "SYS"
summary = "ld.volatile.global (LDG.E.STRONG.SYS) of a never-written scratch word"
expect = ["violation"]
marker = "@T"
find = "ld.volatile.shared.u32 %r16, [%r4];"
replace = "cvta.to.global.u64 %rd3, %rd2;\n    ld.volatile.global.u32 %r16, [%rd3];"

[[variants]]
id = "SUB8"
summary = "UST with a one-byte strong store of undefined data into the polled defined word"
expect = ["violation"]
[[variants.edits]]
marker = "@T"
find = "ld.volatile.shared.u32 %r16, [%r4];"
replace = "cvta.to.global.u64 %rd3, %rd2;\n    ld.global.u32 %r20, [%rd3+4];\n    st.relaxed.gpu.global.u8 [%rd3+9], %r20;"
[[variants.edits]]
marker = "@S"
find = "st.global.u32 [%rd1], %r15;"
replace = ""
[[variants.edits]]
marker = "@Z"
find = "// @Z"
replace = "cvta.to.global.u64 %rd3, %rd2;\n    ld.relaxed.gpu.global.u32 %r16, [%rd3+8];\n    st.global.u32 [%rd1], %r16;"

[[variants]]
id = "TMAU"
summary = "warp 1 bulk-copies 16 never-written scratch bytes over buf (defined); warp 2 strong-loads a buf word"
expect = ["violation"]
[[variants.edits]]
marker = "@T"
find = "ld.volatile.shared.u32 %r16, [%r4];"
replace = "mov.u32 %r10, m2;\n    mov.u32 %r11, buf;\n    mbarrier.arrive.expect_tx.shared::cta.b64 _, [%r10], 16;\n    cp.async.bulk.shared::cluster.global.mbarrier::complete_tx::bytes [%r11], [%rd2], 16, [%r10];"
[[variants.edits]]
marker = "@S"
find = "st.global.u32 [%rd1], %r15;"
replace = ""
[[variants.edits]]
marker = "@Z"
find = "// @Z"
replace = "mov.u32 %r11, buf;\n    ld.relaxed.cta.shared.u32 %r16, [%r11+4];\n    st.global.u32 [%rd1], %r16;"

[[variants]]
id = "TMAS"
summary = "warp 1 bulk-stores 16 never-written shared bytes over scr[4..7] (defined); warp 2 strong-loads scr[5]"
expect = ["violation"]
[[variants.edits]]
marker = "@T"
find = "ld.volatile.shared.u32 %r16, [%r4];"
replace = "cvta.to.global.u64 %rd3, %rd2;\n    add.u64 %rd4, %rd3, 16;\n    mov.u32 %r11, ubuf;\n    cp.async.bulk.global.shared::cta.bulk_group [%rd4], [%r11], 16;\n    cp.async.bulk.commit_group;\n    cp.async.bulk.wait_group 0;"
[[variants.edits]]
marker = "@S"
find = "st.global.u32 [%rd1], %r15;"
replace = ""
[[variants.edits]]
marker = "@Z"
find = "// @Z"
replace = "cvta.to.global.u64 %rd3, %rd2;\n    ld.relaxed.gpu.global.u32 %r16, [%rd3+20];\n    st.global.u32 [%rd1], %r16;"
