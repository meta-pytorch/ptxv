name = "probe_mma_bs_ovf_mxf4"
description = """
Probe (N-MMA-BS, MISS 144; probes/mma_bs/ovf/gen.py): mxf4.block_scale 2X e2m1, ue8m0;
SFA 2^127 in rows 32..63 (every step leaves f32) and 96..127 (step 0 only). expected/ is GB300's
output (+-Inf where a step overflows); the model reports the overflowing step as not modeled."""
ptx = "../../kernel.ptx"
entry = "mma_mxf4"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "u8"
shape = [128, 128]
init = "file"
file = "A.bin"

[[buffers]]
name = "B"
dtype = "u8"
shape = [64, 128]
init = "file"
file = "B.bin"

[[buffers]]
name = "SFA"
dtype = "u32"
shape = [128, 16]
init = "file"
file = "SFA.bin"

[[buffers]]
name = "SFB"
dtype = "u32"
shape = [128, 16]
init = "file"
file = "SFB.bin"

[[buffers]]
name = "D"
dtype = "f32"
shape = [128, 64]
init = "file"
file = "D0.bin"
expect = "expected/out.bin"

[[params]]
kind = "tensormap"
buffer = "A"
box = [16, 128, 8]
dims = [16, 128, 8]
strides = [128, 16]

[[params]]
kind = "tensormap"
buffer = "B"
box = [16, 64, 8]
dims = [16, 64, 8]
strides = [128, 16]

[[params]]
kind = "ptr"
buffer = "D"

[[params]]
kind = "u32"
value = 143656064

[[params]]
kind = "u32"
value = 143656064

[[params]]
kind = "ptr"
buffer = "SFA"

[[params]]
kind = "ptr"
buffer = "SFB"

[[variants]]
id = "good"
expect = ["unmodeled"]
