name = "probe_cvt_tf32"
description = """
Probe (L-ROSETTA) for PTX cvt.rna.tf32.f32 on random words, ties, near-overflow values, NaN
payloads, Inf and subnormals (kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin =
ptxas -arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "cvt_tf32"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
