name = "probe_sqrt_rn"
description = """
Probe for sqrt.rn.f32 on 4096 f32 patterns (+-0, subnormals, every exponent, +-inf, NaNs,
negatives, random words; kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin,
`ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "sqrt_rn"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [4096]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [4096]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
