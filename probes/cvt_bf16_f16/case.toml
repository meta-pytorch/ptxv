name = "probe_cvt_bf16_f16"
description = """
Probe (N-FCVT) for cvt.bf16.f16 and cvt.f16.bf16 without a rounding modifier on every 16-bit
pattern (kernel.ptx). expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a
kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "cvt_bf16_f16"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [65536]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
