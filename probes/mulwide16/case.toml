name = "probe_mulwide16"
description = """
Probe (L-ROSETTA) for PTX mul.wide.u16 / mul.wide.s16 (16 x 16 -> 32, operands zero / sign
extended from 16 bits) on 16-bit registers from ld.s16, ld.u16, cvt.u16.u32, add.s16 and on
immediates (kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin = ptxas 13.0
-arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "mulwide16"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [512]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
