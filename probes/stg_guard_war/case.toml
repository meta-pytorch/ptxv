name = "probe_stg_guard_war"
description = """
Probe (L-SB-ORDER) for a guarded-off STG's read scoreboard. base.cubin is ptxas's build of kernel.ptx;
patch.py makes data_w0 / addr_w0 (A's data or address register rewritten after a wait on the
read scoreboard of B, which is guarded off when param on = 0) and data_nw / addr_nw (no wait).
GB300 (`ptxv hw-worker`, 20 launches of 262,144 threads per cubin and on = 0 / 1, analyze.py):
base and the _w0 mutants store every A intact; the _nw mutants store the rewritten value in
all but at most 150 of the 262,144 threads per launch. The fixture checks the scoreboard pass accepts the _w0
mutants and flags the _nw ones."""
cubin = "base.cubin"
entry = "stg_war"
grid = [1024, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [4718596]
init = "zeros"

[[buffers]]
name = "out2"
dtype = "u32"
shape = [524288]
init = "zeros"

[[buffers]]
name = "junk"
dtype = "u32"
shape = [4194304]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "out2"

[[params]]
kind = "ptr"
buffer = "junk"

[[params]]
kind = "u32"
value = 0

[[variants]]
id = "good"
expect = ["clean"]
