name = "probe_generic8"
description = """
Probe for generic byte accesses and CTA-scope global atomics: ld.u8 / ld.s8 / st.u8 through
generic addresses (SASS LD.E.U8, LD.E.S8, ST.E.U8) and atom / red.global.cta.add.u32
(ATOMG / REDG .E.ADD.STRONG.SM), one CTA (kernel.ptx, gen.py). expected/ is GB300's output
(ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "generic8"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u8"
shape = [256]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [384]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
