name = "probe_mad_wide16"
description = """
Probe (L-ROSETTA) for mad.wide.{s,u}16 d, a, imm, c (32-bit result) on random and edge 16-bit
operands (kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "mad_wide16"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [512]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
