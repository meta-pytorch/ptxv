name = "probe_discard_l2"
description = """
Probe (S-INIT) for discard.global.L2: a line written, discarded, rewritten and read back
(good: clean, bitwise); read_after skips the rewrite, so the read sees the discarded line
(indeterminate: an S-INIT finding). kernel.ptx; expected/ is GB300's output for good
(kernel.cubin = ptxas -arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "discard_l2"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["buf"]

[[buffers]]
name = "buf"
dtype = "u32"
shape = [64]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "buf"

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "read_after"
summary = "the line is read back after the discard without a rewrite"
expect = ["violation"]
marker = "@RA"
find = "mov.pred        %p2, 0;"
replace = "mov.pred        %p2, 1;"
