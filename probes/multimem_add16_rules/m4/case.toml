name = "multimem_add16_m4"
description = """
MISS 208 repro: multimem.ld_reduce f16 / bf16 adds of 4 members (one per GPU) on vectors picked
whole from GB300 sweeps (mklanes.py, expected/vectors.csv): out = the reduced vectors of the
tests bf16x8, bf16x8a, f16x8, f16x8a (174, 182, 22, 22 vectors). GB300's output for the
same vectors: expected/m4.<test>.out.bin (check.py compares lane by lane)."""
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "mm16"
grid = [3, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "mem0"
dtype = "u32"
shape = [1600]
init = "file"
file = "../data/m4.in0.bin"
device = 0

[[buffers]]
name = "mem1"
dtype = "u32"
shape = [1600]
init = "file"
file = "../data/m4.in1.bin"
device = 1

[[buffers]]
name = "mem2"
dtype = "u32"
shape = [1600]
init = "file"
file = "../data/m4.in2.bin"
device = 2

[[buffers]]
name = "mem3"
dtype = "u32"
shape = [1600]
init = "file"
file = "../data/m4.in3.bin"
device = 3

[[buffers]]
name = "out"
dtype = "u32"
shape = [1600]
init = "zeros"
device = 0

[[multicast]]
name = "mc"
size = 6400
binds = [
    { device = 0, offset = 0, buffer = "mem0", byte_offset = 0, size = 6400 },
    { device = 1, offset = 0, buffer = "mem1", byte_offset = 0, size = 6400 },
    { device = 2, offset = 0, buffer = "mem2", byte_offset = 0, size = 6400 },
    { device = 3, offset = 0, buffer = "mem3", byte_offset = 0, size = 6400 },
]

[[params]]
kind = "ptr"
buffer = "mc"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "u32"
value = 174

[[params]]
kind = "u32"
value = 182

[[params]]
kind = "u32"
value = 22

[[params]]
kind = "u32"
value = 22

[[params]]
kind = "u32"
value = 174

[[params]]
kind = "u32"
value = 356

[[params]]
kind = "u32"
value = 378

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
