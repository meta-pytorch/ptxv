name = "probe_fset_nan"
description = """
Probe (N-FALU, L-ROSETTA) for the unordered f32 compare as a 1.0f / 0 value: SASS
FSET.BF.NAN.AND Rd, a, b, Pc | !Pc | PT, b a register (also a itself: isnan), a uniform
register, an immediate or RZ, |R| / -R operands, and under a guard (PTX set.nan[.and].f32.f32,
and setp.nan.f32 + selp.f32 1.0, 0.0; kernel.ptx and in.bin are written by gen.py). 1024
records: every pair of 22 f32 patterns (signed zeros, subnormals, the neighbours of the
immediate, the largest finite values, infinities, quiet and signalling NaNs of either sign with
the smallest and largest payloads) with the incoming predicate false and true, then random
words. expected/ is GB300's output (kernel.cubin = ptxas 13.1 -arch=sm_103a kernel.ptx, `ptxv
hw-worker`); `gen.py --check expected/out.bin` compares it with a bit-level model."""
ptx = "kernel.ptx"
entry = "fset_nan"
grid = [1, 1, 1]
block = [1024, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [4096]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [12288]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "u32"
value = 0x3fc00001

[[variants]]
id = "good"
expect = ["clean"]
