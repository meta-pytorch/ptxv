name = "probe_dpor_tx_overdec"
description = """
DPOR repro (MISS 231 follow-up): an over-decrement with no arrival pending. Two complete_tx
into a phase whose tx is 4 with every arrival made: the 4-byte one first completes the phase
early (race), the 8-byte one first takes tx below 0 (deadlock). The two do not commute, so a
decrement that takes tx below 0 with no arrival pending writes the count key (exec.rs
`rec_tx`). run.sh pins every explorer's classes (expected/classes.txt); fixtures.rs
`dpor_orders_tx_increments_against_decrements` cross-checks DPOR against the stateful search.
"""
ptx = "kernel.ptx"
entry = "tx_overdec"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "thread 32 completes 8 bytes of 4 expected: thread 64 first completes phase 0 early"
expect = ["deadlock", "nondeterministic", "race"]
expect_sass = ["deadlock", "nondeterministic"]

[[variants]]
id = "BAL"
summary = "balanced: expect 12, complete 8 + 4 (no early completion)"
expect = ["clean"]
marker = "@AE"
find = "[%r4], 4;"
replace = "[%r4], 12;"
