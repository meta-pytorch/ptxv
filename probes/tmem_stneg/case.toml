name = "probe_tmem_stneg"
description = """
Probe for tcgen05.st at a TMEM address with a negative offset folded in (SASS
`STTM.x8 tmem[UR+-0x10]`): columns 0..31, then 8 columns at c0 - 16 (c0 = 48), read back with
tcgen05.ld (kernel.ptx). expected/ is GB300's output (ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "tmem_stneg"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [5120]
init = "zeros"
expect = "expected/out.bin"

[[buffers]]
name = "in"
dtype = "u32"
shape = [8192]
init = "bits"
seed = 7

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "u32"
value = 48

[[variants]]
id = "good"
expect = ["clean"]
