name = "tc_pair_bs"
description = """
Probe (E-PAIR, N-MMA-BS) for the block-scaled tcgen05.mma.cta_group::2 (SASS
UTCOMMA.2CTA.BLOCK16): one kind::mxf4nvf4 block16 MMA, M = 256, N = 64, K = 64, ue4m3; every
operand and scale factor differs between the two CTAs of the pair (kernel.ptx, entry mma_pair).
Inputs from gen.py; expected/D.bin is the GB300 output. cp/ probes tcgen05.cp.cta_group::2."""
ptx = "kernel.ptx"
entry = "mma_pair"
grid = [2, 1, 1]
cluster = [2, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "u8"
shape = [256, 32]
init = "file"
file = "data/A.bin"

[[buffers]]
name = "B"
dtype = "u8"
shape = [64, 32]
init = "file"
file = "data/B.bin"

[[buffers]]
name = "SFA"
dtype = "u32"
shape = [2, 128, 4]
init = "file"
file = "data/SFA.bin"

[[buffers]]
name = "SFB"
dtype = "u32"
shape = [2, 128, 4]
init = "file"
file = "data/SFB.bin"

[[buffers]]
name = "D"
dtype = "f32"
shape = [256, 64]
init = "nan"

[[params]]
kind = "ptr"
buffer = "A"

[[params]]
kind = "ptr"
buffer = "B"

[[params]]
kind = "ptr"
buffer = "SFA"

[[params]]
kind = "ptr"
buffer = "SFB"

[[params]]
kind = "ptr"
buffer = "D"

# idesc: A / B e2m1 (1 at bits 7 / 10), ue4m3 scales (bit 23 clear), N >> 3 = 8 at bit 17,
# M >> 4 = 16 at bit 24.
[[params]]
kind = "u32"
value = 0x10100480

[[variants]]
id = "good"
# PTX: cta1's tcgen05.ld of D after the cta_group::2 commit's multicast arrival, waited at
# .cta scope, is an S-MBAR-SCOPE contract finding (as in probes/tc_pair_atmem); SASS: clean.
expect = ["contract"]
expect_sass = ["clean"]
