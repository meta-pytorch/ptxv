name = "probe_bfi_clz"
description = """
Probe (L-ROSETTA) for bfi.b32 (register pos / len around 0, 31, 32, 255, 256; immediate,
clipped at bit 31) and clz.b32 (zero, all ones, varying leading zeros) (kernel.ptx, gen.py).
expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a kernel.ptx,
`ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "bfi_clz"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [256]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
