name = "probe_redux_masks"
description = """
Probe (L-REDUX): redux.sync with partial membermasks, each executed by exactly its mask's lanes
(kernel.ptx generated by ../gen.py; SASS REDUX / CREDUX under divergence behind BRA.DIV).
expected/ is GB300's output."""
ptx = "kernel.ptx"
entry = "redux_masks"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256]
init = "file"
file = "../in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [256, 9]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
