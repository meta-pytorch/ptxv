name = "probe_redux_s32"
description = """
Probe (L-REDUX) for full-warp redux.sync forms (SASS REDUX[.SUM|.OR|.XOR][.S32], CREDUX.MIN /
.MAX[.S32]) on signed extremes, wrapping sums and random words, and atom / red .global.add.s32
(ATOMG / REDG .E.ADD.S32). masks/ is the same reductions with partial active-lane masks (SASS
front only: PTX redux.sync with a partial membermask is not modeled). expected/ is GB300's
output (ptxas cubin, `ptxv hw-worker probes/redux_s32 <cubin> --runs 1 --dump`)."""
ptx = "kernel.ptx"
entry = "redux_s32"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out", "old", "m"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [256]
init = "file"
file = "in.bin"

[[buffers]]
name = "m"
dtype = "u32"
shape = [256]
init = "file"
file = "in.bin"
expect = "expected/m.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [128, 9]
init = "zeros"
expect = "expected/out.bin"

[[buffers]]
name = "old"
dtype = "u32"
shape = [128]
init = "zeros"
expect = "expected/old.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "m"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "old"

[[variants]]
id = "good"
expect = ["clean"]
