name = "probe_fmad2_v133"
description = """
Probe (PTX-FMAD-X2-VERSION) for the ptxas version dependence of mul.f32x2 + add.f32x2
contraction, five independent products with cancelling addends (kernel.ptx, gen.py): ptxas
13.0 contracts every same-mode pair (FFMA2 / FFMA2.RZ), 13.1 and 13.3 only a plain mul into a
plain add. This case is built by ptxas 13.3 (kernel.cubin); expected/ is GB300's output of it
(`ptxv hw`). The 13.0 rule applied here gives different bits (a mutant the fixture kills)."""
ptxas_toolkit = "13.3"
ptx = "kernel.ptx"
entry = "fmad2_v133"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [4096]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1280]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
