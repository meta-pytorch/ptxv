name = "mma_k96_layout_n256"
description = "probes/mma_k96 input set layout_n256 (gen.py): kind::mxf4nvf4 block16, K = 96."
ptx = "../kernel.ptx"
entry = "k96_n256"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "A"
dtype = "u8"
shape = [128, 96]
init = "file"
file = "A.bin"

[[buffers]]
name = "B"
dtype = "u8"
shape = [256, 96]
