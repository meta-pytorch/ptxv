shape = [32]
init = "file"
file = "data/c.bin"

[[buffers]]
name = "e"
dtype = "f32"
shape = [32]
init = "file"
file = "data/e.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [416]
init = "zeros"

[[params]]
