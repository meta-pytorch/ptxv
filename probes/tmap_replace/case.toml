name = "probe_tmap_replace"
description = """
Probe (S-TMAP) for tensormap.replace.tile.<field>.shared::cta.b1024 on every field, every
ordinal, every elemtype / interleave / swizzle / fill value, over maps that start as random
words, and tensormap.cp_fenceproxy of one map to global memory (kernel.ptx, gen.py).
expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "tmap_replace"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1536]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [1056]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
