name = "probe_tma_prefetch"
description = """
Probe (L-ROSETTA) for cp.async.bulk.prefetch.tensor.2d.L2.global[.tile] (SASS UTMAPF.L2.2D):
fixtures/r0_tma_sum's kernel with two tensor prefetches before its TMA load (kernel.ptx).
expected/ is GB300's output (ptxas cubin, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "r0_tma_sum"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "A"
dtype = "bf16"
shape = [64, 64]
init = "normal"
seed = 1

[[buffers]]
name = "out"
dtype = "f32"
shape = [128]
init = "nan"
expect = "expected/out.bin"

[[params]]
kind = "tensormap"
buffer = "A"
box = [64, 64]

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
