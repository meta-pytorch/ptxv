name = "probe_copysign"
description = """
Probe (L-ROSETTA) for PTX copysign.f32 (b with the sign bit of a) on random words, NaN
payloads, signed zeros, Inf and subnormals, both operand orders and an immediate magnitude
(kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin = ptxas -arch=sm_103a
kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "copysign"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [512]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [768]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
