name = "probe_uninit_poll_publish"
description = """
Repro (MISS 279, RDP2 finding H): a thread polling an mbarrier before its init next to a racy
publish through another mbarrier. The poll of the uninitialized mbarrier reads the object's
word and its (re)initialization key, so the reductions order it against the init. PTX: the
reductions keep the race and may lose nondeterministic past it (E-DRF).
"""
ptx = "kernel.ptx"
entry = "uninit_poll_publish"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [1]
init = "zeros"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["nondeterministic", "race", "violation"]
expect_sass = ["nondeterministic", "race", "violation"]

[[variants]]
id = "NOSPIN"
summary = "without the stuck poller"
expect = ["nondeterministic", "race"]
expect_sass = ["nondeterministic"]
marker = "@SPIN"
find = "mbarrier.try_wait.parity.shared::cta.b64 %p5, [%r5], 0;"
replace = "setp.eq.u32 %p5, %r1, %r1;"
