name = "probe_tma_im2col"
description = """
Probe (S-TMA, S-TMAP) for im2col TMA (gen.py): cp.async.bulk.tensor.{3,4,5}d ... .im2col
loads (SASS UTMALDG.<n>D.IM2COL) through six cuTensorMapEncodeIm2col maps (u8 / u16 / u32,
pixel-box corners, channels per pixel past C, no swizzle / 64B / 128B, offsets including the
largest per rank), 8 loads each, and .im2col_no_offs stores (UTMASTG.<n>D.IM2COL) through three
maps, 4 each. expected/ is GB300's output (ptxas cubin, `ptxv hw-worker`).
"""
