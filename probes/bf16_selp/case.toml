name = "probe_bf16_selp"
description = """
Probe (L-ROSETTA) for plain mul.bf16 through Triton's NaN-override selp, a pack,
and stmatrix or tcgen05.st (the MX GEMM epilogues): no contraction, .rn products. expected/ is GB300's output
(kernel.cubin = ptxas -arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "bf16_selp"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [96]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [64]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
