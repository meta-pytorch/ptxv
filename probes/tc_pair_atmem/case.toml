name = "probe_tc_pair_atmem"
description = """
Probe (E-PAIR, S-TMEM) for tcgen05.mma.cta_group::2 at M = 128 with A in TMEM, N = 64
(kernel.ptx, gen.py pattern data). The output is both CTAs' whole TMEM; expected/ is GB300's
(kernel.cubin = ptxas -arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "mma_pair"
grid = [2, 1, 1]
block = [128, 1, 1]
cluster = [2, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "u16"
shape = [4096]
init = "file"
file = "data/a.bin"

[[buffers]]
name = "b"
dtype = "u16"
shape = [8192]
init = "file"
file = "data/b.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [65536]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "u32"
value = 0x8100490

[[variants]]
id = "good"
expect = ["contract"]
# SASS: the overlapping un-fenced STTMs are a tmem-queue contract finding (E-TMEM-QUEUE),
# a contract under the GB300 profile too (the test: probe_bitwise_queue).
expect_sass = ["contract"]
