name = "probe_imma_s8"
description = """
Probe (N-IMMA) for mma.sync.aligned.m16n8k32.row.col.satfinite.s32.s8.s8.s32 (SASS
IMMA.16832.S8.S8.SAT): four chained steps on random, extreme and saturating s8 inputs with C
near both s32 limits (kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin = ptxas
-arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "imma_s8"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [512]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
