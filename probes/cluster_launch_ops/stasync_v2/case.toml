name = "cluster_launch_ops_stasync_v2"
description = """
MISS 209 hardware probe: st.async ... .v2.b32 by threads 0..15 (S[2t], S[2t + 1] = t + 7, t + 8); out[t] = S[t] afterwards (S[t] starts at t). Variant cluster1:
.reqnctapercluster 1, 1, 1; variant none: no cluster dimensions. GB300 (ptxv probe): cluster1
runs, none traps (illegal instruction) (expected/stasync_v2.gb300.txt)."""
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "cl_stasync_v2"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [32]
init = "zeros"

[[buffers]]
name = "src"
dtype = "u32"
shape = [4]
init = "file"
file = "../src.bin"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "src"

[[variants]]
id = "cluster1"
summary = ".reqnctapercluster 1, 1, 1"
expect = ["clean"]

[[variants]]
id = "none"
summary = "no cluster dimensions"
marker = "@NOCLUSTER"
replace = "<delete>"
expect = ["fault"]
expect_sass = ["deadlock", "fault"]
