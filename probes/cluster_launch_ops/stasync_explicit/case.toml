name = "cluster_launch_ops_stasync_explicit"
description = """
MISS 209 hardware probe: st.async.shared::cluster.mbarrier::complete_tx::bytes.b32 of the thread's own word (S[t] = t + 7); out[t] = S[t] afterwards (S[t] starts at t). Launch: .explicitcluster without a shape; no cluster in case.toml (a 1 x 1 x 1 cluster launch).
GB300 (ptxv probe): runs (expected/stasync_explicit.gb300.txt)."""
ptx = "kernel.ptx"
arch = "sm_103a"
entry = "cl_stasync_explicit"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [32]
init = "zeros"

[[buffers]]
name = "src"
dtype = "u32"
shape = [4]
init = "file"
file = "../src.bin"

[[params]]
kind = "ptr"
buffer = "out"

[[params]]
kind = "ptr"
buffer = "src"

[[variants]]
id = "good"
summary = ".explicitcluster without a shape"
expect = ["clean"]
