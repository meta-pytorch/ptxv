name = "equiv_claims_product_underflow_prodr_u"
description = "a * (b * c) (mul.rn.f32) (set u: a ~ 2^-80, b ~ 2^-60, c ~ 2^100); expected/: GB300's output (ptxas 13.0)"
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "a"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/a_u.bin"

[[buffers]]
name = "b"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/b_u.bin"

[[buffers]]
name = "c"
dtype = "f32"
shape = [1024]
init = "file"
file = "../data/c_u.bin"

[[buffers]]
name = "out"
dtype = "f32"
shape = [1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "ptr"
buffer = "b"

[[params]]
kind = "ptr"
buffer = "c"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "as written"
expect = ["clean"]
