name = "probe_tma_red_order"
description = """
Probe (N-RED16) for the order of two bf16 tensor bulk reductions (UTMAREDG.2D.ADD) into one
64 x 64 box (kernel.ptx, gen.py: per element (g, a0, a1) with the a0-first, a1-first and
single-rounding sums three different bf16 words). Mode 0 (this case): the two CTAs of a cluster
each add their box at once, after a cluster barrier. GB300, 300 launches (analyze.py): every
element is one of the two sequential orders, never the single rounding or anything else; the
order switches at 128-byte (64-element) row boundaries within the box, and every element was
seen in both orders. observed.bin: per element the smaller then the larger value seen (4096 +
4096 bf16). Mode 1 (param 1): one thread issues both reductions back to back: issue order in
300 of 300 launches."""
ptx = "kernel.ptx"
entry = "tma_red_order"
grid = [2, 1, 1]
block = [128, 1, 1]
cluster = [2, 1, 1]
outputs = ["g"]

[[buffers]]
name = "a"
dtype = "u16"
shape = [8192]
init = "file"
file = "a.bin"

[[buffers]]
name = "g"
dtype = "bf16"
shape = [64, 64]
init = "file"
file = "g.bin"

[[params]]
kind = "ptr"
buffer = "a"

[[params]]
kind = "u32"
value = 0

[[params]]
kind = "tensormap"
buffer = "g"
box = [64, 64]

[[variants]]
id = "good"
expect = ["nondeterministic"]
