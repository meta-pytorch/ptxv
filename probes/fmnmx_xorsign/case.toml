name = "probe_fmnmx_xorsign"
description = """
Probe (N-XORSIGN) for PTX min / max [.NaN] [.ftz] .xorsign.abs.f32, SASS FMNMX[.NAN][.FTZ].XORSIGN
with |register|, immediate and |uniform register| operands, on every pair of 32 f32 edge
patterns (kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin, `ptxv hw-worker
probes/fmnmx_xorsign <cubin> --runs 1 --dump`)."""
ptx = "kernel.ptx"
entry = "fmnmx_xorsign"
grid = [4, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [1024, 2]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [8, 1024]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
