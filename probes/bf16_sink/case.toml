name = "probe_bf16_sink"
description = """
Probe (L-ROSETTA) for plain mul.bf16 / mul.bf16x2 whose products reach only uses ptxas cannot
contract into: packs, a .b64 pack / unpack, an mma.sync B operand, prmt, shfl.sync and a
conversion (kernel.ptx, gen.py). expected/ is GB300's output (kernel.cubin = ptxas
-arch=sm_103a kernel.ptx, `ptxv hw-worker`)."""
ptx = "kernel.ptx"
entry = "bf16_sink"
grid = [1, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [384]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [256]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
