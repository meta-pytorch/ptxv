name = "probe_warpsync_pairs"
description = """
Probe (E-WARPCOLL) for bar.warp.sync with a membermask naming only the lane's pair (SASS
WARPSYNC on per-lane masks, CuTeDSL RouterEpilogue's form): shared-memory exchange with the
partner, converged, after a branch on lane < 16, and with the two lanes of each pair on
separate paths (kernel.ptx, gen.py). expected/ is GB300's output (ptxas cubin, `ptxv
hw-worker`)."""
ptx = "kernel.ptx"
entry = "warpsync_pairs"
grid = [1, 1, 1]
block = [64, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [64]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [256]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
expect = ["clean"]
# ptxas 13.0 lowers each bar.warp.sync to WARPSYNC.COLLECTIVE; the two lanes of a pair parked
# at different collective instructions are not combined (E-COLLECTIVE): a false deadlock.
expect_sass = ["deadlock"]
hw_note = "GB300 completes, 50/50 scrubbed (ptxv hw-worker, 2026-11-07)"
