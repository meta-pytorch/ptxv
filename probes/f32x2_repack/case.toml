name = "probe_f32x2_repack"
description = """
Probe (PTX-FMAD) for plain mul.f32x2 products unpacked and repacked: a half next to a value
not from its product (own lane or the other) and integer reads of the product bits stay apart
from the add (FMUL2 + FADD2); the identity repack {p.lo, p.hi} contracts (FFMA2) and is
refused on PTX (marker @K, tests::probe_f32x2_repack). expected/ is GB300's output for good (kernel.cubin = ptxas -arch=sm_103a
kernel.ptx, `ptxv hw-worker`); in.bin = gen.py."""
ptx = "kernel.ptx"
entry = "f32x2_repack"
grid = [1, 1, 1]
block = [256, 1, 1]
outputs = ["out"]

[[buffers]]
name = "in"
dtype = "u32"
shape = [4096]
init = "file"
file = "in.bin"

[[buffers]]
name = "out"
dtype = "u32"
shape = [2048]
init = "zeros"
expect = "expected/out.bin"

[[params]]
kind = "ptr"
buffer = "in"

[[params]]
kind = "ptr"
buffer = "out"

[[variants]]
id = "good"
summary = "mixed repacks and integer reads"
expect = ["clean"]

