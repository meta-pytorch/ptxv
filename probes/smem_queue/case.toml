    { at = "@0x0800", bits = [[0, 64, 0x811137c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R19, R17, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0810", bits = [[0, 64, 0x800117c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R17, R0, UR8, RZ, 0x3c, !PT" },
