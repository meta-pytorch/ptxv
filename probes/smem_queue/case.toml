summary = "FIRST LDSs, SECOND - 2 stall cycles later, FIRST's reader 64 stall cycles after it (NOWAIT)"
patch = [
    { at = "@0x0770", bits = [[0, 64, 0x3d80000003117820], [64, 64, 0x3ffea0000400000]], expect = "FMUL R17, R3, 0.0625" },
    { at = "@0x0780", bits = [[0, 64, 0x5002027825], [64, 64, 0x3ffe400078e0012]], expect = "IMAD.WIDE.U32 R2, R2, 0x50, R18" },
    { at = "@0x0790", bits = [[0, 64, 0x40c08783b], [64, 64, 0xa640008000200]], expect = "LDSM.16.M88.4 R8, [R12+UR4]" },
    { at = "@0x07a0", bits = [[0, 64, 0x4000000d14783b], [64, 64, 0xe640000000200]], expect = "LDSM.16.M88.4 R20, [R13+0x4000]" },
