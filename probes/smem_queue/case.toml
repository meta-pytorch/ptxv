    { at = "@0x07c0", bits = [[0, 64, 0x4000000f007984], [64, 64, 0xe640000000800]], expect = "LDS R0, [R15+0x4000]" },
    { at = "@0x07d0", bits = [[0, 64, 0xc201f0018187f89], [64, 64, 0xe6400000e0000]], expect = "SHFL.BFLY PT, R24, R24, 0x1, 0x1f" },
