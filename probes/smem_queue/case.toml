    { at = "@0x0890", bits = [[0, 64, 0x40c0c7c36], [64, 64, 0x3ffe40008000000]], expect = "VIADD R12, R12, UR4" },
    { at = "@0x08a0", bits = [[0, 64, 0x7918], [64, 64, 0xff00000000000]], expect = "NOP" },
    { at = "@0x08b0", bits = [[0, 64, 0x400c02007986], [64, 64, 0xfe2000c101d06]], expect = "STG.E.128 desc[UR6][R2.64+0x40], R12" },
