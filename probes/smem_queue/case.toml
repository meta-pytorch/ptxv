summary = "FIRST LDSMs, SECOND LDSMf 2 stall cycles later, FIRST's reader 4 stall cycles after it (NOWAIT)"
patch = [
    { at = "@0x0770", bits = [[0, 64, 0x3d80000003117820], [64, 64, 0x3ffea0000400000]], expect = "FMUL R17, R3, 0.0625" },
    { at = "@0x0780", bits = [[0, 64, 0x5002027825], [64, 64, 0x3ffe400078e0012]], expect = "IMAD.WIDE.U32 R2, R2, 0x50, R18" },
    { at = "@0x0790", bits = [[0, 64, 0xe107984], [64, 64, 0xe640000000800]], expect = "LDS R16, [R14]" },
    { at = "@0x07a0", bits = [[0, 64, 0x4200000d04783b], [64, 64, 0xe640000004200]], expect = "LDSM.16.MT88.4 R4, [R13+0x4200]" },
    { at = "@0x07b0", bits = [[0, 64, 0x4000000f007984], [64, 64, 0xe640000000800]], expect = "LDS R0, [R15+0x4000]" },
    { at = "@0x07c0", bits = [[0, 64, 0xc201f0018187f89], [64, 64, 0xe6400000e0000]], expect = "SHFL.BFLY PT, R24, R24, 0x1, 0x1f" },
    { at = "@0x07d0", bits = [[0, 64, 0x1100117308], [64, 64, 0xe640000000800]], expect = "MUFU.EX2 R17, R17" },
    { at = "@0x07e0", bits = [[0, 64, 0x810107c12], [64, 64, 0x3ffe4000f8e3cff]], expect = "LOP3.LUT R16, R16, UR8, RZ, 0x3c, !PT" },
    { at = "@0x07f0", bits = [[0, 64, 0x818127c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R18, R24, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0800", bits = [[0, 64, 0x811137c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R19, R17, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0810", bits = [[0, 64, 0x800117c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R17, R0, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0820", bits = [[0, 64, 0x40c08783b], [64, 64, 0x3fbe40008000200]], expect = "LDSM.16.M88.4 R8, [R12+UR4]" },
    { at = "@0x0830", bits = [[0, 64, 0x4000000d14783b], [64, 64, 0xee40000000200]], expect = "LDSM.16.M88.4 R20, [R13+0x4000]" },
    { at = "@0x0840", bits = [[0, 64, 0x808087c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R8, R8, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0850", bits = [[0, 64, 0x809097c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R9, R9, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0860", bits = [[0, 64, 0x80a0a7c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R10, R10, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0870", bits = [[0, 64, 0x80b0b7c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R11, R11, UR8, RZ, 0x3c, !PT" },
    { at = "@0x0880", bits = [[0, 64, 0x40c0c7c36], [64, 64, 0x3ffe40008000000]], expect = "VIADD R12, R12, UR4" },
    { at = "@0x0890", bits = [[0, 64, 0x814147c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R20, R20, UR8, RZ, 0x3c, !PT" },
    { at = "@0x08a0", bits = [[0, 64, 0x815157c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R21, R21, UR8, RZ, 0x3c, !PT" },
    { at = "@0x08b0", bits = [[0, 64, 0x816167c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R22, R22, UR8, RZ, 0x3c, !PT" },
    { at = "@0x08c0", bits = [[0, 64, 0x817177c12], [64, 64, 0xfe4000f8e3cff]], expect = "LOP3.LUT R23, R23, UR8, RZ, 0x3c, !PT" },
    { at = "@0x08d0", bits = [[0, 64, 0x7918], [64, 64, 0xff00000000000]], expect = "NOP" },
    { at = "@0x08e0", bits = [[0, 64, 0x400c02007986], [64, 64, 0xfe2000c101d06]], expect = "STG.E.128 desc[UR6][R2.64+0x40], R12" },
    { at = "@0x08f0", bits = [[0, 64, 0x802007986], [64, 64, 0xfe2000c101d06]], expect = "STG.E.128 desc[UR6][R2.64], R8" },
    { at = "@0x0900", bits = [[0, 64, 0x101402007986], [64, 64, 0xfe2000c101d06]], expect = "STG.E.128 desc[UR6][R2.64+0x10], R20" },
    { at = "@0x0910", bits = [[0, 64, 0x200402007986], [64, 64, 0xfe2000c101d06]], expect = "STG.E.128 desc[UR6][R2.64+0x20], R4" },
    { at = "@0x0920", bits = [[0, 64, 0x301002007986], [64, 64, 0xfe2000c101d06]], expect = "STG.E.128 desc[UR6][R2.64+0x30], R16" },
    { at = "@0x0930", bits = [[0, 64, 0x7918], [64, 64, 0xfe20000000000]], expect = "NOP" },
    { at = "@0x0940", bits = [[0, 64, 0x7918], [64, 64, 0xfe20000000000]], expect = "NOP" },
    { at = "@0x0950", bits = [[0, 64, 0x7918], [64, 64, 0xfe20000000000]], expect = "NOP" },
]
