name = "tma_store_reuse"
description = """
Soundness-harness reproducer (docs/soundness-harness.md): a double-buffered TMA-store epilogue
whose `noreuse` variant lets threads rewrite a staging buffer that an earlier bulk store may
still be reading (the r3_grouped_mm mutant sass-del-bar-0xc420 in miniature)."""
ptx = "kernel.ptx"
entry = "k"
grid = [1, 1, 1]
block = [128, 1, 1]
outputs = ["D"]

[[buffers]]
name = "D"
dtype = "u32"
shape = [4, 128]
init = "zeros"

[[params]]
kind = "tensormap"
buffer = "D"
box = [128, 1]

[[variants]]
id = "good"
expect = ["clean"]

[[variants]]
id = "noreuse"
summary = "no bar.sync after the wait_group.read 1"
marker = "@REUSE"
replace = "<delete>"
expect = ["race"]
