name = "rep_div0"
description = "integer division whose divisor is input data, zero only in CTA 3's slice"
ptx = "kernel.ptx"
entry = "k"
grid = [4, 1, 1]
block = [32, 1, 1]
outputs = ["out"]

[[buffers]]
name = "out"
dtype = "u32"
shape = [128]
init = "zeros"

[[buffers]]
name = "in"
dtype = "u32"
